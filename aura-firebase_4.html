<title>Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080A;
    --bg-elevated:#0F0F10;
    --card:#111112;
    --card-hover:#151516;
    --border:rgba(255,255,255,0.07);
    --border-strong:rgba(255,255,255,0.14);
    --text:#F5F5F3;
    --text-muted:#9C9CA1;
    --text-icon:#B8B8BD;
    --text-faint:#616164;
    --violet:#9380D9;
    --gold:#F2C464;
    --indigo:#5E77E8;
    --rose:#F2607E;
    --off-white:#F2F2F0;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:28px 20px 80px;
    min-height:100vh;
    position:relative;
    z-index:1;
  }

  /* ---- Shell com menu lateral ---- */
  .shell{ display:flex; min-height:100vh; max-width:1100px; margin:0 auto; position:relative; z-index:1; }
  .sidebar{
    width:76px; flex-shrink:0;
    padding:24px 10px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    border-right:1px solid var(--border);
    position:sticky; top:0; height:100vh;
  }
  .sidebar-logo{ padding:4px 0 22px; }
  .sidebar-logo img{ height:26px; }
  .side-link{
    display:flex; align-items:center; justify-content:center;
    width:44px; height:44px;
    background:none; border:none; color:var(--text-icon);
    padding:0; border-radius:12px; cursor:pointer;
    transition:background .15s ease, color .15s ease;
    position:relative;
  }
  .side-link svg{ flex-shrink:0; }
  .side-link:hover{ background:var(--card); color:var(--text); }
  .side-link.active{ background:var(--card); color:var(--text); }
  .side-link.active svg{ color:var(--violet); }
  .side-link-settings{ margin-top:auto; }
  .nav-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:16px; height:16px; padding:0 4px;
    border-radius:999px; background:var(--rose); color:#fff;
    font-size:9px; font-weight:700; font-family:'Manrope', sans-serif;
    position:absolute; top:2px; right:2px;
  }
  .main-col{ flex:1; min-width:0; max-width:600px; padding:0 20px 100px; margin:0 auto; }
  .right-col{ width:290px; flex-shrink:0; padding:24px 16px; display:none; }
  @media (min-width: 1080px){ .right-col{ display:block; } }
  .right-col-title{ font-size:12.5px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px; padding:0 8px; }
  .suggest-row{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:12px; transition:background .15s ease; }
  .suggest-row:hover{ background:var(--card); }
  .suggest-row-info{ flex:1; min-width:0; }
  .suggest-row-info .name{ font-size:13.5px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .aura-mini{ font-size:11px; color:var(--text-faint); margin-top:1px; }
  .follow-btn-mini{
    padding:6px 14px; border-radius:13px; font-size:12px; font-weight:700; font-family:'Manrope', sans-serif;
    border:1px solid var(--violet); background:var(--violet); color:#fff; cursor:pointer; flex-shrink:0;
  }
  .follow-btn-mini:disabled{ opacity:0.5; }
  .top-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 0 16px;
    position:relative;
  }
  .top-bar-logo{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    height:26px; display:flex; align-items:center;
    background:none; border:none; cursor:pointer; color:var(--text);
    padding:0;
  }
  .top-bar-logo img{ height:100%; width:auto; display:block; }
  .top-bar-avatar, .top-bar-msg{
    background:none; border:none; cursor:pointer; color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    padding:0; position:relative; border-radius:50%;
    transition:opacity .15s ease;
  }
  .top-bar-avatar:hover, .top-bar-msg:hover{ opacity:0.8; }
  .top-bar-msg{
    width:38px; height:38px; border-radius:13px; background:var(--card); border:1px solid var(--border);
  }

  @media (max-width: 860px){
    .shell{ flex-direction:column; }
    .sidebar{
      position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; width:100%;
      flex-direction:row; justify-content:space-around; align-items:center;
      padding:12px 4px calc(18px + env(safe-area-inset-bottom));
      border-right:none; border-top:1px solid var(--border);
      background:var(--bg-elevated); z-index:40;
    }
    .sidebar-logo{ display:none; }
    .side-link-settings{ display:none; }
    .main-col{ padding:0 16px 150px; max-width:100%; }
  }

  /* ---- Perfil: estatísticas ---- */
  .profile-stats{ display:flex; justify-content:center; gap:30px; margin-top:16px; flex-wrap:wrap; }
  .profile-stats .stat{ text-align:center; cursor:default; }
  .profile-stats .stat .num{ font-family:'Manrope', sans-serif; font-weight:600; font-size:17px; color:var(--text); }
  .profile-stats .stat .lbl{ font-size:10px; color:var(--text-faint); font-weight:500; text-transform:uppercase; letter-spacing:.06em; margin-top:3px; }

  /* ---- Seguir ---- */
  .follow-btn{
    padding:10px 26px; border-radius:12px; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px;
    border:1px solid var(--violet); background:var(--violet); color:#fff; cursor:pointer; transition:all .15s ease;
    margin-top:18px;
  }
  .follow-btn.following{ background:transparent; color:var(--text); border-color:var(--border-strong); }

  .profile-tab-btn.active{ color:var(--text); border-bottom-color:var(--violet); }

  /* ---- Ações da frequência (ícones) ---- */
  .feed-icon-btn{
    background:none; border:none; color:var(--text-faint); cursor:pointer;
    display:inline-flex; align-items:center; gap:5px;
    padding:6px 8px; border-radius:13px; transition:all .15s ease;
    font-family:'Manrope', sans-serif; font-size:12px; font-weight:600;

  .feed-icon-btn:hover{ background:var(--bg-elevated); color:var(--text); }
  .feed-icon-btn.active{ color:var(--violet); }
  .feed-delete-btn{

    padding:4px; border-radius:8px; display:inline-flex; transition:all .15s ease; flex-shrink:0;
  }
  .feed-delete-btn:hover{ color:var(--rose); background:var(--bg-elevated); }
  .post-image{ width:100%; border-radius:13px; margin-top:8px; display:block; max-height:420px; object-fit:cover; }
  .feed-comment-row{ display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--text-muted); line-height:1.5; padding:12px 0; border-bottom:1px solid var(--border); }
  .feed-comment-row:last-child{ border-bottom:none; }
  .feed-comment-avatar{ flex-shrink:0; margin-top:1px; }
  .feed-comment-body{ flex:1; min-width:0; }
  .feed-comment-row strong{ color:var(--text); font-weight:700; margin-right:4px; }
  .feed-comment-reply-note{ font-size:11px; color:var(--text-faint); margin-bottom:3px; display:flex; align-items:center; gap:4px; }
  .feed-comment-reply-btn{
    background:none; border:none; color:var(--text-faint); font-size:11.5px; font-weight:700;
    cursor:pointer; padding:6px 0 0; font-family:'Manrope', sans-serif;
  }
  .feed-comment-reply-btn:hover{ color:var(--violet); }
  .replying-to-bar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:13px;
    padding:8px 12px; margin-top:12px; font-size:12.5px; color:var(--text-muted);
  }
  .replying-to-bar button{
    background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; padding:0 4px;
  }
  .replying-to-bar button:hover{ color:var(--text); }
  .feed-comment-compose{ display:flex; gap:8px; align-items:center; }
  .feed-comment-compose .chat-input{ padding:10px 16px; font-size:14px; }

  /* ---- Mensagens diretas ---- */
  .conv-list{ display:flex; flex-direction:column; gap:4px; }
  .conv-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 10px; border-radius:14px; cursor:pointer;
    transition:background .15s ease;
  }
  .conv-row:hover{ background:var(--card); }
  .conv-row .info{ flex:1; min-width:0; }
  .conv-row .name{ font-family:'Manrope', sans-serif; font-weight:600; font-size:14.5px; }
  .conv-row .preview{ color:var(--text-muted); font-size:12.5px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv-row .time{ color:var(--text-faint); font-size:11px; flex-shrink:0; }
  .conv-row .conv-right{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }

  .conv-badge{

    padding:0 6px; font-family:'Manrope', sans-serif;
  }

  .notif-row{
    display:flex; align-items:center; gap:16px;
    padding:12px 10px; border-radius:14px; cursor:pointer;
    transition:background .15s ease;
  }

  .notif-row .notif-content{ flex:1; min-width:0; }
  .notif-row .notif-text{ font-size:13.5px; line-height:1.4; color:var(--text-muted); }
  .notif-icon{ display:inline-flex; vertical-align:middle; margin-right:10px; color:var(--text-faint); }
  .notif-row .notif-text strong{ color:var(--text); font-weight:700; }
  .notif-row .notif-time{ color:var(--text-faint); font-size:11px; margin-top:3px; }

  .chat-header-info{ display:flex; align-items:center; gap:10px; }
  .dm-notice{
    background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:13px; padding:10px 14px; font-size:11.5px; color:var(--text-faint);
    margin-bottom:16px; line-height:1.5;
  }
  .chat-messages{
    display:flex; flex-direction:column; gap:8px;
    min-height:200px; max-height:55vh; overflow-y:auto;
    padding:6px 2px 16px;
  }
  .chat-row{ display:flex; }
  .chat-row.mine{ justify-content:flex-end; }
  .chat-bubble{
    max-width:75%; padding:10px 14px; border-radius:13px;
    background:var(--card); color:var(--text); font-size:14px; line-height:1.4;
    word-wrap:break-word; white-space:pre-wrap;
  }
  .chat-row.mine .chat-bubble{ background:var(--off-white); color:#18181A; border-bottom-right-radius:4px; }
  .chat-row:not(.mine) .chat-bubble{ border-bottom-left-radius:4px; }
  .chat-compose{
    display:flex; gap:8px; align-items:center;
    position:sticky; bottom:0; background:var(--bg); padding-top:10px;
  }
  .chat-input{
    flex:1; background:var(--card); border:1px solid var(--border); color:var(--text);
    padding:12px 16px; border-radius:999px; font-size:14px; outline:none;
  }
  .chat-input:focus{ border-color:var(--violet); }
  .chat-input::placeholder{ color:var(--text-faint); }
  #chatSendBtn{ background:var(--off-white); color:#18181A; border:none; flex-shrink:0; }
  h1,h2,h3{font-family:'Manrope', sans-serif; margin:0;}
  .eyebrow{
    font-family:'Manrope', sans-serif;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:6px;
    display:block;
  }
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
  }
  .brand{
    display:flex;
    align-items:center;
  }
  .brand img{ height:22px; width:auto; display:block; }
  button, input{ font-family:inherit; }
  .icon-btn{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text-muted);
    width:38px;height:38px;
    border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:all .15s ease;
  }
  .icon-btn:hover{ color:var(--text); border-color:var(--border-strong); background:var(--card-hover); }

  /* ---- Aura ring ---- */
  .aura-ring{
    position:relative;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    border:1px solid var(--border-strong);
  }
  @media (prefers-reduced-motion: reduce){ .aura-ring::before{ animation:none; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .avatar{
    border-radius:50%;
    object-fit:cover;
    background:var(--bg-elevated);
    display:flex;align-items:center;justify-content:center;
    font-family:'Manrope', sans-serif;
    font-weight:600;
    color:var(--text-muted);
    overflow:hidden;
  }

  /* ---- Onboarding ---- */
  .onboard{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-top:9vh;
    gap:6px;
  }
  .onboard .app-icon{ width:64px; height:64px; margin-bottom:18px; object-fit:contain; }
  .onboard h1{ font-size:32px; font-weight:600; }
  .onboard p{ color:var(--text-muted); font-size:15px; max-width:340px; margin:6px 0 28px; line-height:1.5; }
  .photo-picker{
    width:92px;height:92px;
    border-radius:50%;
    border:2px dashed var(--border-strong);

  .photo-picker img{ width:100%;height:100%;object-fit:cover; }
  .photo-picker .ph-label{ font-size:12px; color:var(--text-faint); text-align:center; padding:0 10px; }
  .field{
    width:100%;
    max-width:320px;
  }
  .edit-photo-row{ display:flex; justify-content:center; margin-bottom:22px; }
  .edit-field{ margin-bottom:16px; }
  .edit-field-label{ display:block; font-size:12px; font-weight:600; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
  .edit-field .username-wrap{ max-width:none; }
  .edit-field .bio-input{ max-width:none; }
  input[type=text], input[type=email], input[type=password]{
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 16px;
    border-radius:14px;
    font-size:15px;
    outline:none;
    transition:border-color .15s ease;
  }
  input[type=text]:focus, input[type=email]:focus, input[type=password]:focus{ border-color:var(--violet); }
  input[type=text]::placeholder, input[type=email]::placeholder, input[type=password]::placeholder{ color:var(--text-faint); }
  .btn{
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:14px;
    border:none;
    border-radius:14px;
    padding:14px 22px;
    cursor:pointer;
    transition:transform .12s ease, opacity .15s ease;

  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-primary{

  .btn-ghost{

    border:1px solid var(--border-strong);
    color:var(--text);
  }
  .btn-block{ width:100%; }
  .onboard .btn{ margin-top:18px; width:100%; max-width:320px; }

  /* ---- Home ---- */
  .me-card{

    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:26px;

    transition:border-color .15s ease, background .15s ease;
  }
  .me-card:hover{ border-color:var(--border-strong); background:var(--card-hover); }
  .me-card .info{ flex:1; min-width:0; }
  .me-card .name{ font-family:'Manrope', sans-serif; font-size:18px; font-weight:600; }
  .me-card .sub{ color:var(--text-muted); font-size:13px; margin-top:2px; }
  .score-chip{
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--gold);

  }

  .search{

    margin-bottom:16px;

  .grid{

    grid-template-columns:1fr 1fr;
    gap:12px;

  .discover-list{ display:flex; flex-direction:column; gap:8px; }
  .discover-row{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:12px 14px; cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .discover-row:hover{ border-color:var(--border-strong); background:var(--card-hover); }
  .discover-row-info{ flex:1; min-width:0; }
  .discover-row-info .name{ font-family:'Manrope', sans-serif; font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .discover-row-meta{ display:flex; align-items:center; gap:10px; margin-top:4px; }
  .discover-row-meta .score-chip{ font-size:13px; font-weight:700; }
  .discover-row-meta .count{ color:var(--text-faint); font-size:12px; }
  .discover-row .follow-btn{ flex-shrink:0; margin-top:0; }
  .p-card{
    background:var(--card);
    border:1px solid var(--border);

    text-align:center;

  .p-card .score-chip{ margin-top:6px; font-size:14px; }
  .p-card .count{ color:var(--text-faint); font-size:11px; margin-top:2px; }
  .p-card .follow-btn{ width:100%; }

  .empty{

    border:1px dashed var(--border-strong);
    border-radius:var(--radius);

  .empty h3{ font-size:17px; font-weight:600; margin-bottom:8px; color:var(--text); }

  /* ---- Profile detail ---- */

  .rate-box{
    background:var(--card);
    border:1px solid var(--border);

    padding:24px 22px;
    margin-top:28px;

    font-weight:600;

  .row-2{ display:flex; gap:10px; width:100%; max-width:320px; margin-top:8px; }

  /* ---- Busca estilo Instagram ---- */

  .suggest-card{
    flex:0 0 auto; width:92px;
    background:var(--card); border:1px solid var(--border); border-radius:13px;
    padding:14px 8px; display:flex; flex-direction:column; align-items:center; text-align:center;
    cursor:pointer; transition:border-color .15s ease, background .15s ease;
  }
  .suggest-card:hover{ border-color:var(--border-strong); background:var(--card-hover); }

    font-family:'Manrope', sans-serif; font-weight:600; font-size:12px; margin-top:8px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .suggest-card .score-chip{ font-size:11px; margin-top:4px; }

  /* ---- Ranking ---- */
  .rank-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .rank-row{
    display:flex; align-items:center; gap:12px;
    background:#0C0C0D; border:1px solid var(--border); border-radius:14px; padding:10px 14px;
    cursor:pointer; transition:border-color .15s ease, background .15s ease;
  }
  .rank-row:hover{ border-color:var(--border-strong); background:#141415; }
  .rank-medal{ font-size:14px; font-weight:700; color:var(--text-faint); width:22px; text-align:center; flex-shrink:0; }
  .rank-row .info{ flex:1; min-width:0; }
  .rank-row .name{ font-family:'Manrope', sans-serif; font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-row .count{ color:var(--text-faint); font-size:11px; margin-top:1px; }

  .feed-unit:last-child{ border-bottom:none; }

    display:flex; gap:12px; padding:14px 4px 16px;
    cursor:pointer;
    transition:background .15s ease;

  .repost-note{
    font-size:12px; color:var(--text-faint); font-weight:600;
    display:flex; align-items:center; gap:6px;
    padding:12px 4px 0 48px;

  .repost-note strong{ color:var(--text-muted); font-weight:700; }
  .feed-item .content{ flex:1; min-width:0; }
  .feed-item .head{ display:flex; align-items:center; justify-content:space-between; }
  .feed-item .head-left{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0; }
  .feed-item .name{ font-family:'Manrope', sans-serif; font-weight:700; font-size:13.5px; color:var(--text); }
  .feed-item .time{ color:var(--text-faint); font-size:11px; }
  .feed-item .text{ font-size:14px; line-height:1.5; margin-top:3px; word-wrap:break-word; white-space:pre-wrap; }
  .feed-item-footer{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .feed-actions-right{ display:flex; align-items:center; gap:6px; flex-shrink:0; }

  .section-divider{ height:1px; background:linear-gradient(90deg, transparent, var(--border-strong), transparent); margin:36px 0 4px; }

  .settings-section{ margin-bottom:28px; }

  .settings-privacy-text{
    margin-top:10px; padding:16px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px;
    font-size:13px; line-height:1.6; color:var(--text-muted);

  .settings-privacy-text p{ margin:0 0 12px; }
  .settings-privacy-text p:last-child{ margin-bottom:0; }
  .settings-privacy-text strong{ color:var(--text); }

  /* ---- Bio ---- */
  .bio-input{
    width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
    padding:12px 14px; border-radius:14px; font-size:13px; outline:none; resize:none;
    min-height:60px; font-family:inherit; line-height:1.4;
  }
  .bio-input:focus{ border-color:var(--violet); }

  .username-wrap{ position:relative; }
  .username-wrap .username-at{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    color:var(--text-faint); font-size:15px; pointer-events:none;
  }
  .username-wrap .username-input{
    width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
    padding:14px 16px 14px 30px; border-radius:14px; font-size:15px; outline:none;
    font-family:inherit; transition:border-color .15s ease;
  }
  .username-wrap .username-input:focus{ border-color:var(--violet); }
  .username-input::placeholder{ color:var(--text-faint); }
  .field-error{ color:var(--rose); font-size:12px; margin-top:6px; min-height:14px; text-align:left; max-width:320px; }
  .password-field-wrap{ position:relative; }
  .password-field-wrap input{ padding-right:44px; }
  .password-toggle-btn{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--text-faint); cursor:pointer;
    display:flex; align-items:center; padding:4px;
  }
  .password-toggle-btn:hover{ color:var(--text); }
  .auth-tabs{
    display:flex; background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:4px; gap:4px; width:100%; max-width:320px; margin-bottom:22px;
  }
  .auth-tab-btn{
    flex:1; padding:10px 0; border-radius:9px; border:none; background:none;
    color:var(--text-muted); font-weight:700; font-size:14px; cursor:pointer;
    font-family:'Manrope',sans-serif; transition:all .15s ease;
  }
  .auth-tab-btn.active{ background:var(--violet); color:#fff; }
  .auth-forgot-link{
    background:none; border:none; color:var(--text-muted); font-size:12.5px;

  .auth-forgot-link:hover{ color:var(--text); }

  .profile-username{ color:var(--text-faint); font-size:13px; margin-top:2px; }
  .bio-input::placeholder{ color:var(--text-faint); }
  .p-hero .bio{ color:var(--text-muted); font-size:13px; max-width:280px; margin-top:10px; line-height:1.5; }

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs,
    addDoc, query, orderBy, limit, updateDoc, increment
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD4XkwODyk8bIfMPCOUdmOT5UIqdskCquc",
    authDomain: "aura-e8ef3.firebaseapp.com",
    projectId: "aura-e8ef3",
    storageBucket: "aura-e8ef3.firebasestorage.app",
    messagingSenderId: "208146657091",
    appId: "1:208146657091:web:0d1897f3eb0838010049f6",
    measurementId: "G-K56S2510XC"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);

  // ---------- camada de compatibilidade ----------
  // Faz o Firestore se comportar como o window.storage do Claude:
  // cada "chave" tipo "colecao:idDoDocumento" vira um documento real no Firestore.
  // Assim, praticamente todo o app continua funcionando sem precisar reescrever
  // cada função de get/set/list uma por uma.
  function keyToRef(key){
    const parts = key.split(':');
    const coll = parts[0];
    const docId = parts.slice(1).join(':') || '_root';
    return doc(db, coll, docId);
  }
  window.storage = {
    async get(key){
      const snap = await getDoc(keyToRef(key));
      if(!snap.exists()) return null;
      const data = snap.data();
      return { key, value: JSON.stringify(data.v), shared: true };
    },
    async set(key, value){
      await setDoc(keyToRef(key), { v: JSON.parse(value) });
      return { key, value, shared: true };
    },
    async delete(key){
      await deleteDoc(keyToRef(key));
      return { key, deleted: true, shared: true };
    },
    async list(prefix){
      const coll = prefix.replace(/:$/, '');
      const snap = await getDocs(collection(db, coll));
      const keys = snap.docs.map(d => coll + ':' + d.id);
      return { keys, prefix, shared: true };
    }
  };

  // ---------- autenticação real (substitui o truque de identidade por URL) ----------
  window._auraAuth = {
    auth,
    signInEmail: (email, pass) => signInWithEmailAndPassword(auth, email, pass),
    signUpEmail: (email, pass) => createUserWithEmailAndPassword(auth, email, pass),
    signInGoogle: () => signInWithRedirect(auth, new GoogleAuthProvider()),
    signOut: () => signOut(auth),
    onChange: (cb) => onAuthStateChanged(auth, cb),
    sendPasswordReset: (email) => sendPasswordResetEmail(auth, email)
  };

  // captura erro do redirecionamento do Google, se houver, pra mostrar na tela
  getRedirectResult(auth).catch((err) => {
    window._auraGoogleRedirectError = err;
  });

  // ---------- posts (frequências) como documentos individuais ----------
  // diferente do resto do app: cada post é o seu próprio documento no Firestore,
  // porque um único documento "feed" com todos os posts + imagens estourava
  // o limite de 1MB por documento assim que alguém postava uma foto.
  window._auraPosts = {
    async loadFeed(limitCount){
      const q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'), limit(limitCount || 200));
      const snap = await getDocs(q);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    async publish(postData){
      const ref = await addDoc(collection(db, 'posts'), postData);
      return ref.id;
    },
    async publishWithId(id, postData){
      // usado só na migração dos posts antigos — preserva o ID original,
      // pra notas e comentários que já apontavam pra esse post continuarem válidos
      await setDoc(doc(db, 'posts', id), postData);
    },
    async remove(postId){
      await deleteDoc(doc(db, 'posts', postId));
    },
    async incrementCommentCount(postId, delta){
      await updateDoc(doc(db, 'posts', postId), { commentCount: increment(delta) });
    },
    async setCommentCount(postId, count){
      // auto-correção: usado quando abrimos um post e percebemos que a contagem
      // guardada não bate com a real (ex: comentários antigos de antes dessa função existir)
      await updateDoc(doc(db, 'posts', postId), { commentCount: count });
    }
  };

  // captura o prompt de instalação do PWA (Android/Chrome e navegadores baseados nele —
  // iOS Safari não tem esse recurso, lá precisa ser manual pelo botão de compartilhar)
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window._auraInstallPrompt = e;
  });

  window.dispatchEvent(new CustomEvent('aura-firebase-ready'));
</script>

  function animateNumber(el, to, duration){
    if(!el) return;

    function tick(now){
      const p = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (to * eased).toFixed(1);
      if(p < 1) requestAnimationFrame(tick);
      else el.textContent = to.toFixed(1);
    }
    requestAnimationFrame(tick);

  async function withRetry(fn, retries, delayMs){

    delayMs = delayMs || 1000;
    let lastErr;
    for(let i = 0; i <= retries; i++){
      try{ return await fn(); }
      catch(e){ lastErr = e; if(i < retries) await new Promise(r => setTimeout(r, delayMs)); }
    }
    throw lastErr;

    return boostsCache[postId];
  }

      if(r && r.value) obj = JSON.parse(r.value);

  async function toggleBoost(postId){
    let obj = {};
    try{
      const r = await withTimeout(window.storage.get('boosts:' + postId, true), 8000);
      if(r && r.value) obj = JSON.parse(r.value);
    }catch(e){ obj = {}; }
    if(obj[ME_ID]) delete obj[ME_ID]; else obj[ME_ID] = true;
    await withTimeout(window.storage.set('boosts:' + postId, JSON.stringify(obj), true), 8000);
    boostsCache[postId] = { count: Object.keys(obj).length, amIBoosting: !!obj[ME_ID] };
    // guarda no índice pessoal quais frequências essa pessoa farmou — pra aparecer no perfil dela também
    try{
      let mine = {};
      const r2 = await window.storage.get('boostedPosts:' + ME_ID, true);
      if(r2 && r2.value) mine = JSON.parse(r2.value);
      if(obj[ME_ID]) mine[postId] = Date.now(); else delete mine[postId];
      await window.storage.set('boostedPosts:' + ME_ID, JSON.stringify(mine), true);
      boostedPostsCache[ME_ID] = mine;
    }catch(e){ /* best-effort */ }
    if(obj[ME_ID]){
      const post = feedCache.find(p => p.id === postId);
      if(post) pushNotification(post.authorId, { type: 'boost_post', postId }); // best-effort
    }
    return boostsCache[postId];
  }

  // ---------- mensagens diretas (DM) ----------
  // aviso: guardado em storage compartilhado (não é criptografado ponta-a-ponta).
  // a interface só mostra a conversa pra quem participa dela, mas tecnicamente
  // não tem o mesmo nível de privacidade de um app de mensagens de verdade.
  function convId(a, b){ return [a, b].sort().join('__'); }

  async function loadConversationRaw(otherId){
    let raw = { messages: [], lastRead: {} };
    try{
      const r = await withTimeout(window.storage.get('dm:' + convId(ME_ID, otherId), true), 8000);
      if(r && r.value){
        const parsed = JSON.parse(r.value);
        raw = Array.isArray(parsed)
          ? { messages: parsed, lastRead: {} }
          : { messages: parsed.messages || [], lastRead: parsed.lastRead || {} };
      }
    }catch(e){}
    return raw;
  }
  async function saveConversationRaw(otherId, raw){
    await withTimeout(window.storage.set('dm:' + convId(ME_ID, otherId), JSON.stringify(raw), true), 8000);
  }
  function unreadCountInRaw(raw){
    const lastReadTs = raw.lastRead[ME_ID] || 0;
    return raw.messages.filter(m => m.senderId !== ME_ID && m.createdAt > lastReadTs).length;
  }
  async function loadConversation(otherId){
    const raw = await loadConversationRaw(otherId);
    return raw.messages;
  }
  async function sendMessage(otherId, text){
    const raw = await loadConversationRaw(otherId);
    const msg = { id: uid(), senderId: ME_ID, text, createdAt: Date.now() };
    raw.messages.push(msg);
    if(raw.messages.length > 300) raw.messages = raw.messages.slice(raw.messages.length - 300);
    raw.lastRead[ME_ID] = msg.createdAt; // quem manda já "leu" até a própria mensagem
    await saveConversationRaw(otherId, raw);
    return raw.messages;
  }
  async function markConversationRead(otherId){
    const raw = await loadConversationRaw(otherId);
    if(raw.messages.length === 0) return;
    const lastTs = raw.messages[raw.messages.length - 1].createdAt;
    if(raw.lastRead[ME_ID] === lastTs) return; // já estava em dia, não precisa gravar
    raw.lastRead[ME_ID] = lastTs;
    try{ await saveConversationRaw(otherId, raw); }catch(e){ /* best-effort */ }
  }
  async function loadMyConversations(){
    let keys = [];
    try{
      const r = await withTimeout(window.storage.list('dm:', true), 8000);
      keys = (r ? r.keys : []).filter(k => k.includes(ME_ID));
    }catch(e){ keys = []; }
    const results = await Promise.all(keys.map(async k => {
      try{
        const r = await window.storage.get(k, true);
        if(!r || !r.value) return null;
        const parsed = JSON.parse(r.value);
        const raw = Array.isArray(parsed)
          ? { messages: parsed, lastRead: {} }
          : { messages: parsed.messages || [], lastRead: parsed.lastRead || {} };
        if(raw.messages.length === 0) return null;
        const ids = k.replace('dm:', '').split('__');
        const otherId = ids.find(x => x !== ME_ID);
        if(!otherId) return null;
        const last = raw.messages[raw.messages.length - 1];
        return { otherId, last, unread: unreadCountInRaw(raw) };
      }catch(e){ return null; }
    }));
    return results.filter(Boolean).sort((a, b) => b.last.createdAt - a.last.createdAt);
  }

  // ---------- notificações (seguidor novo, nota recebida, engajamento) ----------
  let notificationsCache = null; // { items: [...], lastSeenAt }
  let unreadNotifCount = 0;
  async function pushNotification(targetUserId, notif){
    if(!targetUserId || targetUserId === ME_ID) return; // não notifica você mesmo
    try{
      let data = { items: [], lastSeenAt: 0 };
      const r = await window.storage.get('notifications:' + targetUserId, true);
      if(r && r.value){
        const parsed = JSON.parse(r.value);
        data = { items: parsed.items || [], lastSeenAt: parsed.lastSeenAt || 0 };
      }
      data.items.unshift({ id: uid(), fromId: ME_ID, createdAt: Date.now(), ...notif });
      if(data.items.length > 100) data.items = data.items.slice(0, 100);
      await window.storage.set('notifications:' + targetUserId, JSON.stringify(data), true);
    }catch(e){ /* best-effort — nunca trava a ação principal por causa disso */ }
  }
  async function loadMyNotifications(){
    let data = { items: [], lastSeenAt: 0 };
    try{
      const r = await withTimeout(window.storage.get('notifications:' + ME_ID, true), 8000);
      if(r && r.value){
        const parsed = JSON.parse(r.value);
        data = { items: parsed.items || [], lastSeenAt: parsed.lastSeenAt || 0 };

  async function markNotificationsRead(){
    try{
      const data = notificationsCache || await loadMyNotifications();
      const maxTs = data.items.length ? data.items[0].createdAt : Date.now();
      if(data.lastSeenAt === maxTs) return;
      data.lastSeenAt = maxTs;
      await window.storage.set('notifications:' + ME_ID, JSON.stringify(data), true);

  const ONLINE_WINDOW_MS = 2 * 60 * 1000; // considerado online se ativo nos últimos 2 minutos
  async function updateMyPresence(){
    if(!ME_ID) return;
    try{ await window.storage.set('presence:' + ME_ID, JSON.stringify({ lastActive: Date.now() }), true); }
    catch(e){ /* best-effort */ }

  async function refreshOnlineSet(){
    try{
      const r = await window.storage.list('presence:', true);
      const keys = r ? r.keys : [];
      const now = Date.now();
      const results = await Promise.all(keys.map(async k => {
        try{

          if(!rr || !rr.value) return null;

        }catch(e){ return null; }
      }));
      onlineIds = new Set(results.filter(Boolean));
    }catch(e){ /* mantém o que já tinha */ }
  }

  // ---------- image resize ----------
  const MAX_UPLOAD_BYTES = 20 * 1024 * 1024; // 20MB — acima disso, nem tenta processar
  function fileToResizedDataUrl(file){
    if(file.size > MAX_UPLOAD_BYTES){
      return Promise.reject(new Error('arquivo muito grande (máx. 20MB)'));
    }
    return withTimeout(new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const size = 240;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const s = Math.min(img.width, img.height);
          const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
          ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = () => reject(new Error('não consegui abrir essa imagem'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('não consegui ler o arquivo'));
      reader.readAsDataURL(file);
    }), 15000);
  }

  // lê o arquivo direto, sem redimensionar — usado pra GIFs, já que passar
  // por canvas destrói a animação (viraria uma imagem parada)
  function fileToRawDataUrl(file){
    if(file.size > MAX_UPLOAD_BYTES){
      return Promise.reject(new Error('arquivo muito grande (máx. 20MB)'));
    }
    return withTimeout(new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = () => reject(new Error('não consegui ler o arquivo'));
      reader.readAsDataURL(file);
    }), 15000);
  }

  // redimensiona mantendo a proporção (usado nas imagens de frequência, ao contrário
  // do corte quadrado usado nas fotos de perfil)
  function resizeImageDataUrl(file, maxDim, quality){
    if(file.size > MAX_UPLOAD_BYTES){
      return Promise.reject(new Error('arquivo muito grande (máx. 20MB)'));
    }
    return withTimeout(new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality || 0.75));
        };
        img.onerror = () => reject(new Error('não consegui abrir essa imagem'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('não consegui ler o arquivo'));
      reader.readAsDataURL(file);
    }), 15000);
  }

  // pontuação de relevância pro feed "Para você" — mistura recência + engajamento,
  // com uma leve vantagem pra quem você já segue (parecido com Twitter/Instagram)
  function computeFeedScore(post){
    const stats = postRatingsCache[post.id] || { avg: null, count: 0 };
    const boost = boostsCache[post.id] || { count: 0 };
    const commentCount = post.commentCount || 0;
    const engagement = (stats.count * 2) + (boost.count * 3) + commentCount + (stats.avg && stats.avg >= 7 ? 2 : 0);
    const ageHours = Math.max(0, (Date.now() - post.createdAt) / (1000 * 60 * 60));
    const decay = 1 / Math.pow(ageHours + 2, 1.5);
    const followBonus = (followersCache[post.authorId] && followersCache[post.authorId].amIFollowing) ? 1.3 : 1;
    return (1 + engagement) * decay * followBonus;
  }
  function feedListHtml(authorFilterId, sortMode){
    if(authorFilterId){
      const list = feedCache.filter(p => p.authorId === authorFilterId);
      if(!list || list.length === 0){
        return `<div class="feed-empty">Essa pessoa ainda não publicou nenhuma frequência.</div>`;
      }
      return list.map(p => feedItemHtml(p)).join('');
    }
    // feed geral: mistura os posts públicos de todo mundo + os que EU farmei
    // (posts de grupo ficam de fora — só aparecem dentro do próprio grupo)
    const publicPosts = feedCache.filter(p => !p.groupId);
    const myBoosted = boostedPostsCache[ME_ID] || {};
    const originals = publicPosts.map(p => ({ post: p, ts: p.createdAt, boosted: false }));
    const myReposts = Object.keys(myBoosted)
      .map(postId => feedCache.find(p => p.id === postId))
      .filter(p => p && !p.groupId)
      .map(p => ({ post: p, ts: myBoosted[p.id], boosted: true }));
    const combined = [...originals, ...myReposts];
    if(sortMode === 'recent'){
      combined.sort((a, b) => b.ts - a.ts);
    } else {
      combined.sort((a, b) => computeFeedScore(b.post) - computeFeedScore(a.post));
    }
    if(combined.length === 0){
      return `<div class="feed-empty">Ainda não tem nenhuma frequência publicada. Seja o primeiro.</div>`;
    }
    const meName = profiles[ME_ID]?.name || 'Você';
    return combined.map(item => feedItemHtml(item.post, item.boosted ? meName : null)).join('');
  }
  // combina o que a pessoa publicou + o que ela farmou (igual timeline com retweets)

    const authored = feedCache.filter(p => p.authorId === profileId).map(p => ({ post: p, ts: p.createdAt, boosted: false }));

      .map(postId => feedCache.find(p => p.id === postId))
      .filter(p => p && p.authorId !== profileId)
      .map(p => ({ post: p, ts: boostedMap[p.id], boosted: true }));
    const combined = [...authored, ...boosted].sort((a, b) => b.ts - a.ts);
    if(combined.length === 0) return `<div class="feed-empty">Nenhuma frequência publicada ainda.</div>`;
    const profileName = profiles[profileId]?.name || 'Alguém';
    return combined.map(item => feedItemHtml(item.post, item.boosted ? profileName : null)).join('');

      imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        try{
          if(file.type === 'image/gif'){
            if(file.size > 700 * 1024){
              showToast('Esse GIF é grande demais (máx. ~700KB). Escolha um menor.', 3500);
              imageInput.value = '';
              return;
            }
            composeImageData = await fileToRawDataUrl(file);
          } else {
            // comprime progressivamente até caber com folga no limite de 1MB
            // por documento do Firestore (senão a publicação falha)
            const attempts = [[1000, 0.7], [800, 0.55], [600, 0.4], [450, 0.3]];
            let result = null;
            for(const [dim, q] of attempts){
              result = await resizeImageDataUrl(file, dim, q);
              if(result.length < 700000) break; // ~700KB em base64, com folga segura
            }
            if(result.length >= 900000){
              showToast('Essa foto é grande demais mesmo comprimida. Tenta uma mais simples.', 3500);
              imageInput.value = '';
              return;
            }
            composeImageData = result;
          }
          imageImg.src = composeImageData;
          imagePreview.style.display = 'block';
        }catch(err){
          showToast('Não deu (' + ((err && err.message) || 'erro desconhecido') + '). Tente outra imagem.', 4000);
        }
      });
      imageRemove.addEventListener('click', () => {
        composeImageData = null;
        imageInput.value = '';
        imagePreview.style.display = 'none';
      });
      postBtn.addEventListener('click', async () => {
        const text = textarea.value.trim();
        if(!text && !composeImageData) return;
        if(containsBlockedContent(text)){
          showToast('Esse conteúdo não é permitido no Aura.', 3500);

        const original = postBtn.textContent;

          postBtn.disabled = false;
          postBtn.textContent = original;
          const detail = (err && err.message) ? err.message : 'erro desconhecido';
          showToast('Não deu pra publicar (' + detail + ').', 5000);
        }
      });
    }
  }

  async function createGroup(name, description){

  async function loadMyGroups(){
    let list = [];
    try{
      const r = await withTimeout(window.storage.list('groups:', true), 8000);
      const keys = r ? r.keys : [];
      const results = await Promise.all(keys.map(async k => {
        try{
          const rr = await window.storage.get(k, true);
          if(!rr || !rr.value) return null;
          const data = JSON.parse(rr.value);
          return { id: k.replace('groups:', ''), ...data };
        }catch(e){ return null; }
      }));
      list = results.filter(g => g && g.memberIds && g.memberIds.includes(ME_ID));
    }catch(e){}
    myGroupsCache = list;
    return list;
  }
  async function loadGroup(groupId){
    try{
      const r = await withTimeout(window.storage.get('groups:' + groupId, true), 8000);
      if(r && r.value) return { id: groupId, ...JSON.parse(r.value) };
    }catch(e){}
    return null;
  }
  async function addGroupMember(groupId, userId){
    const group = await loadGroup(groupId);
    if(!group) throw new Error('grupo não encontrado');
    if(!group.memberIds.includes(userId)) group.memberIds.push(userId);
    const { id, ...data } = group;
    await withTimeout(window.storage.set('groups:' + groupId, JSON.stringify(data), true), 8000);

  function renderRanking(){
    if(!profiles[ME_ID]){ view = { name: 'onboard' }; return renderOnboard(); }
    const rankingTab = view.rankingTab || 'global';

    if(rankingTab === 'following' && !(ME_ID in followingIdsCache)){
      loadFollowingIds(ME_ID).then(() => {
        if(view.name === 'ranking') renderRanking();
      }).catch(() => {});
    }

    // exige um mínimo de avaliações pra entrar no ranking — é isso que impede
    // uma nota 10 com 1 avaliação só de aparecer acima de alguém com 4 avaliações e nota 7.5
    const MIN_RATINGS_FOR_RANKING = 3;
    let allRated = Object.values(profiles)
      .map(p => ({ p, stats: ratingsCache[p.id] || { avg: null, count: 0 } }))
      .filter(x => x.stats.count > 0 && x.stats.avg !== null);

    if(rankingTab === 'following'){
      const myFollowing = followingIdsCache[ME_ID] || {};
      allRated = allRated.filter(x => myFollowing[x.p.id]);
    }

    const rated = allRated.filter(x => x.stats.count >= MIN_RATINGS_FOR_RANKING);

    // dentro de quem já qualificou, pondera nota média + volume de avaliações
    // (média bayesiana), pra quem tem muito mais avaliações pesar mais que
    // quem só passou raspando do mínimo.
    const totalCount = rated.reduce((s, x) => s + x.stats.count, 0);
    const totalScore = rated.reduce((s, x) => s + x.stats.avg * x.stats.count, 0);
    const C = totalCount > 0 ? totalScore / totalCount : 0;
    const avgCount = rated.length > 0 ? totalCount / rated.length : 0;
    const m = Math.max(avgCount, MIN_RATINGS_FOR_RANKING);
    const ranked = rated
      .map(x => ({ ...x, weighted: (x.stats.count / (x.stats.count + m)) * x.stats.avg + (m / (x.stats.count + m)) * C }))
      .sort((a, b) => b.weighted - a.weighted)
      .slice(0, 10);

    const content = renderShellAndGetContent();
    content.innerHTML = `
      <div class="auth-tabs" style="max-width:none;">
        <button class="auth-tab-btn ranking-tab-btn ${rankingTab === 'global' ? 'active' : ''}" data-tab="global">Global</button>
        <button class="auth-tab-btn ranking-tab-btn ${rankingTab === 'following' ? 'active' : ''}" data-tab="following">Seguindo</button>
      </div>
      ${ranked.length === 0 ? `
        <div class="empty"><h3>Ranking ainda vazio</h3><p>${rankingTab === 'following' ? 'Ninguém que você segue entrou no ranking ainda.' : (allRated.length === 0 ? 'Assim que alguém receber uma nota de aura, o ranking aparece aqui.' : `É preciso pelo menos ${MIN_RATINGS_FOR_RANKING} avaliações pra entrar no ranking — ainda ninguém chegou lá.`)}</p></div>
      ` : `
        <div class="rank-panel">
          <div class="rank-list">${ranked.map((x, i) => rankRowHtml(x.p, x.stats, i)).join('')}</div>
        </div>
      `}
    `;
    document.querySelectorAll('.ranking-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => { view.rankingTab = btn.dataset.tab; renderRanking(); });
    });
    document.querySelectorAll('.rank-row').forEach(el => {
      el.addEventListener('click', () => { view = { name: 'profile', id: el.dataset.id }; render(); });
    });
  }

  async function exportAllData(){
    const backup = { exportedAt: new Date().toISOString(), profiles: {}, ratings: {}, feed: [] };
    // perfis
    const profileKeys = await window.storage.list('profile:', true);
    await Promise.all((profileKeys?.keys || []).map(async k => {
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) backup.profiles[k] = JSON.parse(r.value);
      }catch(e){}
    }));
    // notas (formato novo, uma chave por perfil)
    const ratingKeys = await window.storage.list('ratings:', true);
    await Promise.all((ratingKeys?.keys || []).map(async k => {
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) backup.ratings[k] = JSON.parse(r.value);
      }catch(e){}
    }));
    // feed (frequências)
    try{
      const r = await window.storage.get('feed', true);
      backup.feed = (r && r.value) ? JSON.parse(r.value) : [];
    }catch(e){}
    return backup;
  }

  function openBackupModal(){
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <div class="handle"></div>
        <h3>Backup dos dados</h3>
        <div class="field" style="text-align:center; max-width:320px;">
          <p style="color:var(--text-muted); font-size:13px; line-height:1.5; margin:0 0 16px;" id="backupStatus">

          </p>
        </div>
        <div class="row-2" id="backupActions" style="display:none;">
          <button class="btn btn-primary" id="downloadBackupBtn">Baixar .json</button>
          <button class="btn btn-ghost" id="selectAllBtn">Selecionar tudo</button>
        </div>
        <textarea id="backupText" readonly style="display:none; width:100%; max-width:320px; height:160px; margin-top:14px; background:var(--card); border:1px solid var(--border); border-radius:13px; color:var(--text); font-family:'Manrope', sans-serif; font-size:11px; padding:10px;"></textarea>
        <button class="btn btn-ghost btn-block" id="closeBackupModal" style="max-width:320px; margin-top:14px;">Fechar</button>

    `;
    document.body.appendChild(bg);
    bg.addEventListener('click', (e) => { if(e.target === bg) bg.remove(); });
    document.getElementById('closeBackupModal').addEventListener('click', () => bg.remove());

    exportAllData().then(backup => {
      const json = JSON.stringify(backup, null, 2);
      const status = document.getElementById('backupStatus');
      const nProfiles = Object.keys(backup.profiles).length;
      const nRatingSets = Object.keys(backup.ratings).length;
      status.textContent = `${nProfiles} perfis e ${nRatingSets} conjuntos de notas encontrados.`;
      document.getElementById('backupActions').style.display = 'flex';
      const textarea = document.getElementById('backupText');
      textarea.style.display = 'block';
      textarea.value = json;

      document.getElementById('downloadBackupBtn').addEventListener('click', () => {
        try{
          const blob = new Blob([json], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'aura-backup-' + new Date().toISOString().slice(0,10) + '.json';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }catch(e){
          showToast('Não deu pra baixar — copie o texto abaixo.');
        }
      });
      document.getElementById('selectAllBtn').addEventListener('click', () => {
        textarea.focus();
        textarea.select();
        showToast('Texto selecionado — use Ctrl+C / Cmd+C');
      });
    }).catch(() => {
      document.getElementById('backupStatus').textContent = 'Não consegui reunir os dados agora. Tente de novo em instantes.';
    });
  }

        </div>
        <div class="settings-row">
          <div class="settings-row-label">Nome de usuário</div>
          <div class="settings-row-value">@${escapeHtml(me?.username || '—')}</div>
        </div>
        ${hasPasswordProvider ? `
          <button class="settings-link-row" id="changePasswordBtn" style="margin-top:10px;">
            <span>Trocar senha</span>
            <span class="settings-chevron">${ICON_CHEVRON}</span>
          </button>
        ` : `
          <div class="settings-row"><div class="settings-row-label" style="font-size:12px;">Você entra com o Google, não tem senha pra trocar aqui.</div></div>
        `}
      </div>

      <div class="settings-section">
        <div class="settings-section-title">App</div>
        ${isStandalone ? `
          <div class="settings-row"><div class="settings-row-label">Já instalado nesse dispositivo ✓</div></div>
        ` : `
          <button class="settings-link-row" id="installAppBtn">
            <span>Instalar app na tela inicial</span>
            <span class="settings-chevron">${ICON_CHEVRON}</span>
          </button>
        `}
      </div>

      <div class="settings-section">
        <div class="settings-section-title">Sobre</div>
        <button class="settings-link-row" id="togglePrivacy">
          <span>Termos de Privacidade</span>
          <span class="settings-chevron">${ICON_CHEVRON}</span>
        </button>
        <div id="privacyText" class="settings-privacy-text" style="display:none;">${PRIVACY_TERMS_HTML}</div>
      </div>

      <button class="btn btn-ghost btn-block" id="settingsLogoutBtn" style="margin-top:24px;">Sair da conta</button>
    `;
    const changePasswordBtn = document.getElementById('changePasswordBtn');
    if(changePasswordBtn){
      changePasswordBtn.addEventListener('click', async () => {
        changePasswordBtn.disabled = true;
        try{
          await window._auraAuth.sendPasswordReset(email);
          showToast('Te mandamos um e-mail com o link pra trocar a senha.', 4000);
        }catch(err){
          showToast('Não deu pra enviar o e-mail. Tente de novo.');
        }
        changePasswordBtn.disabled = false;
      });
    }
    const installBtn = document.getElementById('installAppBtn');
    if(installBtn){
      installBtn.addEventListener('click', async () => {
        if(window._auraInstallPrompt){
          window._auraInstallPrompt.prompt();
          const result = await window._auraInstallPrompt.userChoice;
          window._auraInstallPrompt = null;
          if(result.outcome === 'accepted') showToast('App instalado!');
        } else {
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          if(isIOS){
            showToast('No iPhone: toque em Compartilhar ⬆️ e escolha "Adicionar à Tela de Início".', 5000);
          } else {
            showToast('Abra o menu do navegador e procure "Instalar app" ou "Adicionar à tela inicial".', 5000);
          }
        }
      });
    }
    document.getElementById('togglePrivacy').addEventListener('click', () => {
      const el = document.getElementById('privacyText');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    });
    document.getElementById('settingsLogoutBtn').addEventListener('click', () => {
      window._auraAuth.signOut();
    });
  }

  function renderEdit(){
    const me = profiles[ME_ID];
    const content = renderShellAndGetContent();
    content.innerHTML = `
      <div class="back-row">
        <div class="lbl">Editar perfil</div>
      </div>
      <div class="edit-photo-row">
        <div class="photo-picker" id="photoPicker">
          ${me.photo ? `<img src="${me.photo}" />` : `<div class="ph-label">toque para<br/>escolher foto</div>`}
        </div>
      </div>
      <input type="file" accept="image/*" id="fileInput" style="display:none;" />
      <div class="edit-field">
        <label class="edit-field-label">Nome</label>
        <input type="text" id="nameInput" placeholder="Seu nome" maxlength="40" value="${escapeHtml(me.name)}" />
      </div>
      <div class="edit-field">
        <label class="edit-field-label">Nome de usuário</label>
        <div class="username-wrap">
          <span class="username-at">@</span>
          <input type="text" id="usernameInput" class="username-input" placeholder="nome_de_usuario" maxlength="24" value="${escapeHtml(me.username || '')}" />
        </div>
        <div class="field-error" id="usernameError"></div>
      </div>
      <div class="edit-field">
        <label class="edit-field-label">Bio</label>
        <textarea class="bio-input" id="bioInput" maxlength="140" placeholder="Escreva uma bio curta (opcional)">${escapeHtml(me.bio || '')}</textarea>
      </div>
      <button class="btn btn-primary btn-block" id="saveBtn">Salvar alterações</button>
    `;
    let photoData = me.photo;
    const picker = document.getElementById('photoPicker');
    const fileInput = document.getElementById('fileInput');
    const usernameInput = document.getElementById('usernameInput');
    const usernameError = document.getElementById('usernameError');
    picker.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      try{
        photoData = await fileToResizedDataUrl(file);
        picker.innerHTML = `<img src="${photoData}" />`;
      }catch(err){
        showToast('Não deu (' + ((err && err.message) || 'erro desconhecido') + '). Tente outra foto.', 4000);
      }
    });
    usernameInput.addEventListener('input', () => {
      const clean = usernameInput.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
      if(clean !== usernameInput.value) usernameInput.value = clean;
      usernameError.textContent = '';
    });
    document.getElementById('saveBtn').addEventListener('click', async (e) => {
      const name = document.getElementById('nameInput').value.trim();
      const username = usernameInput.value.trim();
      if(!name) return;
      if(username.length < 3){ usernameError.textContent = 'O nome de usuário precisa de pelo menos 3 caracteres.'; return; }
      if(usernameTaken(username, ME_ID)){ usernameError.textContent = 'Esse nome de usuário já está em uso.'; return; }
      const bioVal = document.getElementById('bioInput').value.trim();
      if(containsBlockedContent(name) || containsBlockedContent(bioVal)){
        showToast('Esse conteúdo não é permitido no Aura.', 3500);
        return;
      }
      const btn = e.target;
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Salvando...';
      try{
        const bio = bioVal;
        const p = { ...me, name, username, photo: photoData, bio };
        await saveProfile(p);
        view = { name: 'profile', id: ME_ID };
        render();
      }catch(err){
        btn.disabled = false;
        btn.textContent = originalLabel;
        const detail = (err && err.message) ? err.message : 'erro desconhecido';
        showToast('Não deu pra salvar (' + detail + ').', 5000);
      }
    });
  }

  // ---------- boot ----------
  // ---------- puxar pra baixo no topo do feed pra atualizar ----------
  (function setupPullToRefresh(){
    let startY = null, pulling = false, triggered = false, refreshing = false;
    document.addEventListener('touchstart', (e) => {
      if(view.name === 'home' && window.scrollY <= 0){
        startY = e.touches[0].clientY;
        pulling = true;
        triggered = false;
      }
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if(!pulling || startY === null) return;
      const diff = e.touches[0].clientY - startY;
      if(diff > 80) triggered = true;
    }, { passive: true });
    document.addEventListener('touchend', async () => {
      if(pulling && triggered && !refreshing){
        refreshing = true;
        showToast('Atualizando o feed...', 1200);
        try{
          await loadFeed();
          await loadAllPostRatings();
          await loadAllBoosts();
          if(view.name === 'home') renderHome();
        }catch(e){ /* best-effort */ }
        refreshing = false;
      }
      pulling = false; startY = null; triggered = false;
    }, { passive: true });
  })();

  let authInited = false;
  async function boot(){
    if(!ME_ID){
      view = { name: 'auth' };
      render();
      return;
    }
    view = { name: 'loading' };
    render();
    try{
      await withTimeout(loadAllProfiles(), 10000);
    }catch(e){
      view = { name: 'error' };
      render();
      return;
    }
    if(profiles[ME_ID]){
      try{ await withTimeout(loadAllRatings(), 10000); }catch(e){ /* segue com o que já temos */ }
      try{ await withTimeout(loadFeed(), 10000); }catch(e){ /* feed é best-effort */ }
      try{ await withTimeout(loadAllPostRatings(), 10000); }catch(e){ /* idem */ }
      try{ await withTimeout(loadAllFollowers(), 10000); }catch(e){ /* idem */ }
      try{ await withTimeout(loadAllBoosts(), 10000); }catch(e){ /* idem */ }
      try{ await withTimeout(loadBoostedPosts(ME_ID), 10000); }catch(e){ /* idem */ }
      refreshUnreadBadge(); // best-effort, não bloqueia a tela inicial
      refreshUnreadNotifCount(); // idem
      updateMyPresence();
      refreshOnlineSet();
      if(!window._auraUnreadPoll){
        window._auraUnreadPoll = setInterval(() => {
          refreshUnreadBadge();
          refreshUnreadNotifCount();
          updateMyPresence();
          refreshOnlineSet();
        }, 20000);
      }
      view = { name: 'home' };
    } else {
      view = { name: 'onboard' };
    }
    render();
  }
  window.addEventListener('unhandledrejection', (ev) => {
    showToast('Algo deu errado. Tente de novo.');
  });
  view = { name: 'loading' };
  render();
  window._auraAuth.onChange((user) => {
    const newId = user ? user.uid : null;
    if(authInited && newId === ME_ID) return; // nada mudou
    authInited = true;
    ME_ID = newId;
    boot();
  });
})();
});
</script>
