  }
  // ---------- algoritmo do "Para você" ----------
  // Antes disso, o feed "Para você" só olhava pra 3 coisas: engajamento total do
  // post, idade dele, e se você segue o autor (sim/não). Isso funciona, mas não
  // aprende NADA sobre você especificamente — o feed de duas pessoas que seguem
  // as mesmas contas ficava idêntico, e conta nova nunca aparecia pra ninguém
  // (sem engajamento → nunca sobe → nunca ganha engajamento → ciclo sem saída).
  // Os pontos novos abaixo resolvem isso sem reescrever a base que já funcionava:

  // uma "semente" sorteada uma vez por sessão (não a cada render) — dá uma
  // variedade sutil de ordem entre uma abertura do app e outra, sem o feed
  // ficar embaralhando sozinho toda vez que você rola ou dá refresh na tela
  let feedSessionSeed = null;
  function getFeedSessionSeed(){
    if(feedSessionSeed === null) feedSessionSeed = Math.random().toString(36).slice(2);
    return feedSessionSeed;
  }
  function seededJitter(postId){
    const s = postId + getFeedSessionSeed();
    let h = 0;
    for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return 0.9 + (Math.abs(h) % 1000) / 1000 * 0.2; // fica entre 0.9x e 1.1x
  }
  // sinal pessoal: quanto mais você já deu aura ou farmou posts de alguém, mais
  // o algoritmo entende que quer ver mais dessa pessoa — é o que faz o feed
  // ficar "seu" com o tempo em vez de igual pra todo mundo que segue as mesmas contas
  function computeAuthorAffinity(authorId){
    if(authorId === ME_ID) return 0;
    let score = 0;
    feedCache.forEach(p => {
      if(p.authorId !== authorId) return;
      const r = postRatingsCache[p.id];
      if(r && r.myScore !== null && r.myScore !== undefined) score += 1.5;
      const b = boostsCache[p.id];
      if(b && b.amIBoosting) score += 1;
    });
    return score;
  }
  function computeFeedScore(post){
    const stats = postRatingsCache[post.id] || { avg: null, count: 0 };
    const boost = boostsCache[post.id] || { count: 0 };
    const commentCount = post.commentCount || 0;
    const engagement = (stats.count * 2) + (boost.count * 3) + commentCount + (stats.avg && stats.avg >= 7 ? 2 : 0);
    const ageHours = Math.max(0, (Date.now() - post.createdAt) / (1000 * 60 * 60));
    const decay = 1 / Math.pow(ageHours + 2, 1.5);
    const followBonus = (followersCache[post.authorId] && followersCache[post.authorId].amIFollowing) ? 1.3 : 1;
    const affinity = 1 + Math.min(computeAuthorAffinity(post.authorId) * 0.15, 1.2);
    // te marcaram nesse post? isso quase sempre sobe pro topo — é conteúdo
    // que fala diretamente com você, não só "relevante em geral"
    const mentionBoost = extractMentionedUserIds(post.text || '').includes(ME_ID) ? 3 : 1;
    // força extra pra quem ainda tem poucas frequências publicadas — sem isso,
    // ninguém nunca vê o post de uma conta nova, ela nunca recebe aura/comentário,
    // e desiste de usar o app antes de criar qualquer laço aqui
    const authorPostCount = feedCache.filter(p => p.authorId === post.authorId).length;
    const newCreatorBoost = authorPostCount <= 3 ? 1.35 : 1;
    return (1 + engagement) * decay * followBonus * affinity * mentionBoost * newCreatorBoost * seededJitter(post.id);
  }
  // depois de ordenar por relevância, evita que a MESMA pessoa apareça 3x seguidas
  // no feed — mesmo que ela tenha os posts mais "fortes", intercala com o próximo
  // autor diferente disponível. É o que faz o feed parecer variado em vez de virar
  // o mural pessoal de quem posta mais
  function diversifyByAuthor(items){
    const pool = items.slice();
    const result = [];
    let lastAuthor = null, streak = 0;
    while(pool.length){
      let idx = 0;
      if(lastAuthor !== null && streak >= 2){
        const altIdx = pool.findIndex(x => x.post.authorId !== lastAuthor);
        if(altIdx !== -1) idx = altIdx;
      }
      const chosen = pool.splice(idx, 1)[0];
      result.push(chosen);
      if(chosen.post.authorId === lastAuthor) streak++; else { lastAuthor = chosen.post.authorId; streak = 1; }
    }
    return result;
  }

  function buildFeedInsightPool(){
    const pool = [];
    recapUpdates.forEach(u => pool.push({ icon: ICON_STAR, text: u }));

    const top3 = computeGlobalTopRanked(3);
    if(top3.length > 0){
      const leader = top3[0];
      const name = '@' + (leader.p.username || leader.p.name);
      pool.push({ icon: ICON_TROPHY, text: `No topo do ranking global agora: ${name}, com nota ${leader.stats.avg.toFixed(1)}.`, targetId: leader.p.id });
      if(top3.length > 1){
        const pick = top3[1 + Math.floor(Math.random() * (top3.length - 1))];
        const pickName = '@' + (pick.p.username || pick.p.name);
        pool.push({ icon: ICON_TROPHY, text: `${pickName} está no Top ${top3.indexOf(pick) + 1} do ranking global.`, targetId: pick.p.id });
      }
    }

    const followingWithScore = Object.keys(profiles).filter(pid =>
      pid !== ME_ID && followersCache[pid] && followersCache[pid].amIFollowing &&
      ratingsCache[pid] && ratingsCache[pid].avg !== null && ratingsCache[pid].avg !== undefined
    );
    if(followingWithScore.length > 0){
      const pid = followingWithScore[Math.floor(Math.random() * followingWithScore.length)];
      const p = profiles[pid];
      const st = ratingsCache[pid];
      pool.push({ icon: ICON_STAR, text: `A aura de @${p.username || p.name} está em ${st.avg.toFixed(1)}, com ${st.count} avaliaç${st.count === 1 ? 'ão' : 'ões'}.`, targetId: pid });
    }

    const notRatedYet = Object.keys(profiles).filter(pid =>
      pid !== ME_ID && !(ratingsCache[pid] && ratingsCache[pid].myScore !== null && ratingsCache[pid].myScore !== undefined)
    );
    if(notRatedYet.length > 0){
      const pid = notRatedYet[Math.floor(Math.random() * notRatedYet.length)];
      const p = profiles[pid];
      pool.push({ icon: ICON_STAR, text: `Você ainda não deu aura pra @${p.username || p.name}. Que tal medir agora?`, targetId: pid });
    }

    const myStats = ratingsCache[ME_ID];
    if(myStats && myStats.avg !== null && myStats.avg !== undefined){
      pool.push({ icon: ICON_STAR, text: `Sua aura está em ${myStats.avg.toFixed(1)}, com ${myStats.count} avaliaç${myStats.count === 1 ? 'ão' : 'ões'} no total.`, targetId: ME_ID });
    }

    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool;
  }
  // o cartão de "novidade de aura" que aparece intercalado no feed — desenhado
  // pra parecer uma publicação de verdade vinda da própria conta @aura (igual
  // um aviso oficial da rede), com o logo como foto de perfil, em vez de uma
  // caixinha genérica solta no meio do feed
  function auraNoticeCardHtml(insight){
    return `<div class="feed-unit">
      <div class="feed-item aura-notice-item"${insight.targetId ? ` data-profile-open="${insight.targetId}"` : ''} style="cursor:pointer;">
        <div class="aura-notice-avatar"><img src="${LOGO_ICON}" alt="Aura" /></div>
        <div class="content">
          <div class="head">
            <div class="head-left">
              <span class="name">@aura</span>
            </div>
            <span class="aura-notice-badge" title="Aviso da Aura">${ICON_BELL}</span>
          </div>
          <div class="text">${escapeHtml(insight.text)}</div>
        </div>
      </div>
    </div>`;
  }
  function feedListHtml(authorFilterId, sortMode){
    if(authorFilterId){
      const list = feedCache.filter(p => p.authorId === authorFilterId && isGroupMember(p.groupId, ME_ID));
      if(!list || list.length === 0){
        return `<div class="feed-empty">Essa pessoa ainda não publicou nenhuma frequência.</div>`;
      }
      return list.map(p => feedItemHtml(p)).join('');
    }
    // feed geral: mistura os posts públicos de todo mundo + os que EU farmei.
    // Frequências publicadas dentro de um grupo TAMBÉM entram aqui, mas só pra
    // quem também é membro daquele grupo — pra quem não é, elas continuam
    // invisíveis fora da própria página do grupo. Frequências de contas
    // privadas que eu não sigo também ficam de fora.
    const publicPosts = feedCache.filter(p => {
      if(!isGroupMember(p.groupId, ME_ID)) return false;
      const author = profiles[p.authorId];
      if(author && author.private && author.id !== ME_ID){
        const amIFollowingAuthor = followersCache[author.id]?.amIFollowing;
        if(!amIFollowingAuthor) return false;
      }
      return true;
    });
    const myBoosted = boostedPostsCache[ME_ID] || {};
    const originals = publicPosts.map(p => ({ post: p, ts: p.createdAt, boosted: false }));
    const myReposts = Object.keys(myBoosted)
      .map(postId => feedCache.find(p => p.id === postId))
      .filter(p => p && isGroupMember(p.groupId, ME_ID))
      .map(p => ({ post: p, ts: myBoosted[p.id], boosted: true }));
    let combined = [...originals, ...myReposts];
    if(sortMode === 'recent'){
      combined.sort((a, b) => b.ts - a.ts);
    } else {
      combined.sort((a, b) => computeFeedScore(b.post) - computeFeedScore(a.post));
      combined = diversifyByAuthor(combined); // só no "Para você" — "Recentes" fica cronológico puro
    }
    if(combined.length === 0){
      return `<div class="feed-empty">Ainda não tem nenhuma frequência publicada. Seja o primeiro.</div>`;
    }
    const meName = profiles[ME_ID]?.name || 'Você';
    // os cartões de aura só aparecem no "Para você" (sortMode !== 'recent') —
    // o "Recentes" fica cronológico puro, sem interrupções, pra quem prefere
    // ver só as frequências mesmo
    const insightPool = (sortMode !== 'recent') ? buildFeedInsightPool() : [];
    const parts = [];
    // um aviso a cada 8 frequências (antes era a cada 5 — tava aparecendo
    // demais) e nunca repete o mesmo aviso dentro do mesmo carregamento do
    // feed: para de inserir assim que o "estoque" de avisos daquela vez acaba,
    // em vez de dar a volta e repetir os mesmos de novo
    combined.forEach((item, i) => {
      parts.push(feedItemHtml(item.post, item.boosted ? meName : null));
      if(insightPool.length > 0 && (i + 1) % 8 === 0){
        const insightIndex = Math.floor((i + 1) / 8) - 1;
        if(insightIndex < insightPool.length){
          parts.push(auraNoticeCardHtml(insightPool[insightIndex]));
        }
      }
    });
    return parts.join('');
  }
  // combina o que a pessoa publicou + o que ela farmou (igual timeline com retweets).
  // Frequências publicadas dentro de um grupo só entram aqui pra quem visita o
  // perfil E também é membro daquele grupo — os demais visitantes nem ficam
  // sabendo que aquela frequência existe.
  function profilePostsOnlyHtml(profileId){
    const boostedMap = boostedPostsCache[profileId] || {};
    const authored = feedCache.filter(p => p.authorId === profileId && isGroupMember(p.groupId, ME_ID)).map(p => ({ post: p, ts: p.createdAt, boosted: false }));
    const boosted = Object.keys(boostedMap)
      .map(postId => feedCache.find(p => p.id === postId))
      .filter(p => p && p.authorId !== profileId && isGroupMember(p.groupId, ME_ID))
      .map(p => ({ post: p, ts: boostedMap[p.id], boosted: true }));
    let combined = [...authored, ...boosted].sort((a, b) => b.ts - a.ts);
    if(combined.length === 0) return `<div class="feed-empty">Nenhuma frequência publicada ainda.</div>`;
    const profileName = profiles[profileId]?.name || 'Alguém';
    // a frequência fixada (só uma por vez) sempre aparece primeiro, com o selinho
    const pinnedPostId = profiles[profileId] && profiles[profileId].pinnedPostId;
    let pinnedHtml = '';
    if(pinnedPostId){
      const idx = combined.findIndex(item => !item.boosted && item.post.id === pinnedPostId);
      if(idx !== -1){

  }
  function profileBoostedOnlyHtml(profileId){
    const boostedMap = boostedPostsCache[profileId] || {};
    const profileName = profiles[profileId]?.name || 'Alguém';
    const list = Object.keys(boostedMap)
      .map(postId => feedCache.find(p => p.id === postId))
      .filter(p => p && p.authorId !== profileId && isGroupMember(p.groupId, ME_ID))
      .sort((a, b) => boostedMap[b.id] - boostedMap[a.id]);

  function profileMediaHtml(profileId){

  function renderProfileTabContent(profileId, tab){

  }
  function commentRowHtml(c, allComments){
    const a = profiles[c.authorId];

  // fecha qualquer menu de "..." aberto num post — chamado antes de abrir outro,

  function closeAllPostMenus(){

  document.addEventListener('click', closeAllPostMenus);
  function bindFeedListEvents(container){
    container.querySelectorAll('.feed-author').forEach(el => {

    });
    container.querySelectorAll('[data-post-id]').forEach(el => {

  // "pontos de aura" — o primeiro passo do sistema de aura cumulativa: em vez
  // de uma média (que pode cair quando alguém te dá uma nota mais baixa), isso
  // é a SOMA de todas as notas que a pessoa já recebeu (ex: notas 5, 5 e 10 =
  // 20 pontos). Como cada pessoa só pode te avaliar 1 vez (reavaliação
  // atualiza a nota dela dentro da mesma soma, não soma de novo do zero), esse
  // total tende a só crescer conforme mais gente avalia. Isolado numa função
  // própria pra já deixar claro que esse é o número que deve crescer com o
  // tempo, caso a gente expanda depois pra somar pontos de outras ações também.
  function getAuraPoints(profileId){
    const stats = ratingsCache[profileId] || { sum: 0 };
    return stats.sum || 0;
  }
  // formata a contagem de aura pro jeito compacto pedido: número cru até
  // 9.999 (com "." separando milhar, ex: "1.000"), e a partir de 10 mil passa
  // pro formato "X.Y mil" (ex: 10100 -> "10.1 mil"), e na casa dos milhões
  // pro "X.Y mi" do mesmo jeito.
  function formatAuraCount(n){
    n = Math.max(0, Math.round(n || 0));
    if(n < 10000) return n.toLocaleString('pt-BR');
    if(n < 1000000) return (n / 1000).toFixed(1) + ' mil';
    return (n / 1000000).toFixed(1) + ' mi';
  }
  // marcos de pontos de aura que disparam uma notificação especial pra quem
  // foi avaliado — de 1000 em 1000 no começo (pra dar aquele gostinho rápido),
  // e depois os saltos vão aumentando, senão quem já tem muita aura acumulada
  // ia ficar recebendo notificação toda hora
  const AURA_POINT_MILESTONES = [1000, 2000, 3000, 4000, 5000, 7000, 10000, 15000, 20000, 30000, 45000, 65000, 100000, 150000, 220000, 320000, 470000, 700000, 1000000, 1500000, 2200000];
  // compara os pontos/avaliações de ANTES e DEPOIS de uma avaliação nova pra
  // ver se algum marco foi cruzado, e notifica quem foi avaliado (não quem
  // avaliou) — best-effort, nunca trava o envio da avaliação em si
  async function notifyAuraMilestones(profileId, prevSum, newSum, prevCount, newCount){
    try{
      if(prevCount === 0 && newCount >= 1){
        await pushNotification(profileId, { type: 'first_rating' });
      }
      const crossed = AURA_POINT_MILESTONES.filter(m => prevSum < m && newSum >= m);
      for(const milestone of crossed){
        await pushNotification(profileId, { type: 'aura_milestone', milestone });
      }
    }catch(e){ /* best-effort */ }
  }
  // widget do medidor + pontos de aura — usado no topo do feed, no perfil e no
  // Top Auras, sempre com a mesma linguagem visual (gauge + número em destaque).
  // opts.hideAura respeita a configuração "esconder nota de aura de quem não
  // te segue" — sem isso, o widget vazaria a nota/pontos escondidos em outro lugar.
  function auraPointsWidgetHtml(profileId, opts){
    opts = opts || {};
    const rawStats = ratingsCache[profileId] || { avg: null, count: 0 };
    const hidden = !!opts.hideAura;
    const displayAvg = hidden ? null : rawStats.avg;
    const points = hidden ? null : getAuraPoints(profileId);
    const subParts = [];
    if(opts.showFollowers){
      const fStats = followersCache[profileId] || { count: 0 };
      subParts.push(`${formatAuraCount(fStats.count)} seguidor${fStats.count === 1 ? '' : 'es'}`);
    }
    if(!hidden) subParts.push(`${rawStats.count} avaliaç${rawStats.count === 1 ? 'ão' : 'ões'}`);
    return `<div class="feed-insights-summary${opts.clickable ? '' : ' feed-insights-summary-static'}${opts.flat ? ' feed-insights-summary-flat' : ''}"${opts.id ? ` id="${opts.id}"` : ''}>
      <div class="feed-insights-summary-left">
        ${scoreGaugeHtml(displayAvg, opts.size || 50)}
        <div>
          <div class="feed-insights-summary-level">${hidden ? '— de aura' : `<span class="feed-insights-points-num">${formatAuraCount(points)}</span> de aura`}</div>
          <div class="feed-insights-summary-sub">${subParts.length ? subParts.join(' · ') : 'Nota de aura privada'}</div>
        </div>
      </div>
      ${opts.clickable ? `<div class="feed-insights-summary-arrow">›</div>` : ''}
    </div>`;
  }
  // resumo compacto de insights do próprio perfil — mostrado no topo do feed,
  // no lugar da caixa de escrever (publicar agora é só pelo "+" da barra de
  // cima), com os pontos de aura (número que só sobe) em destaque.
  function feedInsightsSummaryHtml(){

  let myGroupsCache = null;
  async function createGroup(name, description){
    const groupId = uid();

      name, description: description || '',
      ownerId: ME_ID,
      memberIds: [ME_ID],
      createdAt: Date.now()

  let allGroupsCache = null;
  async function loadAllGroupsRaw(){
    let list = [];
    try{
      const r = await withTimeout(window.storage.list('groups:', true), 8000);
      const keys = r ? r.keys : [];
      const results = await Promise.all(keys.map(async k => {
        try{
          const rr = await window.storage.get(k, true);
          if(!rr || !rr.value) return null;
          const data = JSON.parse(rr.value);
          return { id: k.replace('groups:', ''), ...data };
        }catch(e){ return null; }
      }));
      list = results.filter(g => g && g.memberIds);
    }catch(e){}
    return list;
  }
  // usadas pra decidir se uma frequência publicada dentro de um grupo pode
  // aparecer pra alguém fora da página do próprio grupo (feed geral, perfil de
  // quem postou) — só quem também é membro do grupo enxerga essas frequências
  // ali, os outros nem sabem que ela existe fora do grupo.
  function isGroupMember(groupId, userId){
    if(!groupId) return true; // não é post de grupo, não tem restrição nenhuma
    const group = (allGroupsCache || []).find(g => g.id === groupId);
    if(!group) return false; // ainda não carregou os grupos, ou grupo não existe mais
    return (group.memberIds || []).includes(userId);
  }
  function groupNameFor(groupId){
    const group = (allGroupsCache || []).find(g => g.id === groupId);
    return group ? group.name : 'um grupo';
  }
  async function loadMyGroups(){
    const all = await loadAllGroupsRaw();
    allGroupsCache = all;
    const list = all.filter(g => g.memberIds.includes(ME_ID));
    myGroupsCache = list;
    return list;
  }
  async function loadAllGroups(){
    const all = await loadAllGroupsRaw();
    allGroupsCache = all;
    return all;
  }
  async function loadGroup(groupId){
    try{
      const r = await withTimeout(window.storage.get('groups:' + groupId, true), 8000);
      if(r && r.value) return { id: groupId, ...JSON.parse(r.value) };
    }catch(e){}
    return null;
  }
  async function addGroupMember(groupId, userId){
    const group = await loadGroup(groupId);
    if(!group) throw new Error('grupo não encontrado');
    if(!group.memberIds.includes(userId)) group.memberIds.push(userId);
    const { id, ...data } = group;
    await withTimeout(window.storage.set('groups:' + groupId, JSON.stringify(data), true), 8000);
    return group;
  }
  async function updateGroupPhoto(groupId, photoData){
    const group = await loadGroup(groupId);
    if(!group) throw new Error('grupo não encontrado');
    group.photo = photoData;
    const { id, ...data } = group;
    await withTimeout(window.storage.set('groups:' + groupId, JSON.stringify(data), true), 8000);
    return group;
  }

  // parte de baixo do Top Auras (a lista em si) isolada numa função pura —
  // além de deixar renderRanking mais enxuta, isso permite montar uma prévia
  // real da aba "Global"/"Seguindo" durante o arrasto pro lado, em vez de só
  // um ícone genérico (o conteúdo já vem pronto igualzinho ao que vai aparecer
  // de verdade quando o arrasto for confirmado).
  function rankingListInnerHtml(rankingTab){
    if(rankingTab === 'following' && !(ME_ID in followingIdsCache)){
      loadFollowingIds(ME_ID).then(() => {
        if(view.name === 'ranking') renderRanking();
      }).catch(() => {});
    }

    // exige um mínimo de avaliações pra entrar no ranking — é isso que impede
    // uma nota 10 com poucas avaliações de aparecer acima de alguém com bem mais
    // avaliações e nota um pouco menor (ex: 3 avaliações nota 10 vs 9 avaliações
    // nota 8.2 — com esse mínimo em 5, o primeiro nem entra no ranking ainda).
    const MIN_RATINGS_FOR_RANKING = 5;
    let allRated = Object.values(profiles)
      .map(p => ({ p, stats: ratingsCache[p.id] || { avg: null, count: 0 } }))
      .filter(x => x.stats.count > 0 && x.stats.avg !== null);

    if(rankingTab === 'following'){
      const myFollowing = followingIdsCache[ME_ID] || {};
      allRated = allRated.filter(x => myFollowing[x.p.id]);
    }

    const rated = allRated.filter(x => x.stats.count >= MIN_RATINGS_FOR_RANKING);

    // dentro de quem já qualificou, pondera nota média + volume de avaliações
    // (média bayesiana), pra quem tem muito mais avaliações pesar mais que
    // quem só passou raspando do mínimo. "m" é o quanto a média geral do app
    // "puxa" a nota de quem tem poucas avaliações — um piso fixo mais alto (10,
    // em vez de só o mínimo pra entrar) faz o volume de avaliações pesar mais
    // que uma nota isolada alta logo que a pessoa entra no ranking.
    const totalCount = rated.reduce((s, x) => s + x.stats.count, 0);
    const totalScore = rated.reduce((s, x) => s + x.stats.avg * x.stats.count, 0);
    const C = totalCount > 0 ? totalScore / totalCount : 0;
    const avgCount = rated.length > 0 ? totalCount / rated.length : 0;
    const m = Math.max(avgCount, 10);
    const ranked = rated
      .map(x => ({ ...x, weighted: (x.stats.count / (x.stats.count + m)) * x.stats.avg + (m / (x.stats.count + m)) * C }))
      .sort((a, b) => b.weighted - a.weighted)
      .slice(0, 10);

    if(ranked.length === 0){
      return `<div class="empty"><h3>Ranking ainda vazio</h3><p>${rankingTab === 'following' ? 'Ninguém que você segue entrou no ranking ainda.' : (allRated.length === 0 ? 'Assim que alguém receber uma nota de aura, o ranking aparece aqui.' : `É preciso pelo menos ${MIN_RATINGS_FOR_RANKING} avaliações pra entrar no ranking — ainda ninguém chegou lá.`)}</p></div>`;
    }
    return `<div class="rank-panel"><div class="rank-list">${ranked.map((x, i) => rankRowHtml(x.p, x.stats, i)).join('')}</div></div>`;
  }

  function notificationRowHtml(n){
    const from = profiles[n.fromId];
    const name = from ? from.name : 'Alguém';
    // marcos de aura são um "aviso do sistema", não vêm de uma pessoa
    // específica — usa o logo da própria @aura no lugar do avatar de quem
    // avaliou, senão pareceria que aquela pessoa é quem está "avisando"
    const isAuraMilestoneNotif = n.type === 'aura_milestone' || n.type === 'first_rating';
    const avatarSmall = isAuraMilestoneNotif
      ? `<div class="aura-notice-avatar" style="width:44px;height:44px;"><img src="${LOGO_ICON}" alt="Aura" /></div>`
      : (from ? avatarHtml(from, 44) : `<div class="avatar" style="width:44px;height:44px;font-size:13px;">?</div>`);
    let text = '', icon = ICON_BELL;
    const isPostEngagement = (n.type === 'rate_post' || n.type === 'boost_post' || n.type === 'comment_post' || n.type === 'mention_post' || n.type === 'mention_comment' || n.type === 'reply_comment' || n.type === 'rate_comment' || n.type === 'rate_post_boosted' || n.type === 'comment_post_boosted' || n.type === 'boost_post_boosted') && n.postId;
    if(n.type === 'follow'){ icon = ICON_USERS; text = `<strong>${escapeHtml(name)}</strong> começou a seguir você`; }
    else if(n.type === 'first_rating'){ icon = ICON_STAR; text = `Você recebeu sua primeira avaliação de aura!`; }
    else if(n.type === 'aura_milestone'){ icon = ICON_TROPHY; text = `Você chegou a <strong>${formatAuraCount(n.milestone)} de aura</strong>!`; }
    else if(n.type === 'rate_profile'){ icon = ICON_STAR; text = `<strong>${escapeHtml(name)}</strong> mediu sua aura: ${n.score}/10`; }
    else if(n.type === 'rate_post'){ icon = ICON_STAR; text = `<strong>${escapeHtml(name)}</strong> deu ${n.score}/10 numa sua frequência`; }
    else if(n.type === 'boost_post'){ icon = ICON_REPEAT; text = `<strong>${escapeHtml(name)}</strong> farmou a aura da sua frequência`; }
    else if(n.type === 'comment_post'){ icon = ICON_COMMENT; text = `<strong>${escapeHtml(name)}</strong> comentou na sua frequência`; }
    else if(n.type === 'mention_post'){ icon = ICON_COMMENT; text = `<strong>${escapeHtml(name)}</strong> marcou você numa frequência`; }
    else if(n.type === 'mention_comment'){ icon = ICON_COMMENT; text = `<strong>${escapeHtml(name)}</strong> marcou você num comentário`; }
    else if(n.type === 'reply_comment'){ icon = ICON_COMMENT; text = `<strong>${escapeHtml(name)}</strong> respondeu seu comentário`; }
    else if(n.type === 'rate_comment'){ icon = ICON_STAR; text = `<strong>${escapeHtml(name)}</strong> deu ${n.score}/10 no seu comentário`; }
    else if(n.type === 'rate_post_boosted'){ icon = ICON_STAR; text = `<strong>${escapeHtml(name)}</strong> deu ${n.score}/10 numa frequência que você farmou`; }
    else if(n.type === 'comment_post_boosted'){ icon = ICON_COMMENT; text = `<strong>${escapeHtml(name)}</strong> comentou numa frequência que você farmou`; }
    else if(n.type === 'boost_post_boosted'){ icon = ICON_REPEAT; text = `<strong>${escapeHtml(name)}</strong> também farmou a aura de uma frequência que você farmou`; }
    return `<div class="notif-row" data-id="${n.fromId}" ${isPostEngagement ? `data-post-id="${n.postId}"` : ''}>
      ${avatarSmall}
      <div class="notif-content">
        <div class="notif-text"><span class="notif-icon">${icon}</span>${text}</div>
        <div class="notif-time">${timeAgo(n.createdAt)}</div>
      </div>
    </div>`;
  }

  function renderChat(otherId){
    const other = profiles[otherId];
    if(!other){ view = { name: 'inbox' }; return renderInbox(); }
    const content = renderShellAndGetContent();
    content.innerHTML = `
      <div class="back-row">
        <div class="chat-header-info" id="chatHeaderProfileLink" style="cursor:pointer;">

        </div>
      </div>

      <div class="chat-compose">
        <input type="text" id="chatInput" class="chat-input" maxlength="500" placeholder="Escreva uma mensagem..." />
        <button class="icon-btn" id="chatSendBtn" title="Enviar">➤</button>
      </div>
    `;

    const chatHeaderProfileLink = document.getElementById('chatHeaderProfileLink');
    if(chatHeaderProfileLink) chatHeaderProfileLink.addEventListener('click', () => { view = { name: 'profile', id: otherId }; render(); });

    function scrollToBottom(){
      const el = document.getElementById('chatMessages');
      if(el) el.scrollTop = el.scrollHeight;
    }

    loadConversation(otherId).then(msgs => {
      if(!(view.name === 'chat' && view.id === otherId)) return;
      const msgsEl = document.getElementById('chatMessages');
      if(!msgsEl) return;
      msgsEl.classList.remove('loading');
      msgsEl.innerHTML = msgs.length === 0
        ? `<div class="feed-empty">Nenhuma mensagem ainda. Diga oi.</div>`
        : msgs.map(chatBubbleHtml).join('');
      scrollToBottom();
      // marca como lida e atualiza o selo de notificação do menu
      markConversationRead(otherId).then(() => refreshUnreadBadge()).catch(() => {});
    }).catch(() => {
      const msgsEl = document.getElementById('chatMessages');
      if(msgsEl){ msgsEl.classList.remove('loading'); msgsEl.innerHTML = `<div class="feed-empty">Não deu pra carregar a conversa.</div>`; }
    });

    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('chatSendBtn');
    async function doSend(){
      const text = input.value.trim();
      if(!text) return;
      input.disabled = true;
      sendBtn.disabled = true;
      try{
        const msgs = await sendMessage(otherId, text);
        input.value = '';
        const msgsEl = document.getElementById('chatMessages');
        if(msgsEl){
          msgsEl.classList.remove('loading');
          msgsEl.innerHTML = msgs.map(chatBubbleHtml).join('');
          scrollToBottom();
        }
      }catch(err){
        showToast('Não deu pra enviar. Tente de novo.');
      }
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
    sendBtn.addEventListener('click', doSend);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') doSend(); });
  }

  function renderDiscover(){
    const me = profiles[ME_ID];
    if(!me){ view = { name: 'onboard' }; return renderOnboard(); }
    const othersAll = Object.values(profiles).filter(p => p.id !== ME_ID);

        </div>
      ` : listToShow.length === 0 ? `
        <div class="empty"><p>Nenhum perfil encontrado com "${escapeHtml(searchVal)}".</p></div>
      ` : `
        ${!isSearching ? `<div class="section-label" style="margin-top:6px;"><h2>Sugestões pra seguir</h2></div>` : ''}
        <div class="discover-list">${listToShow.map(discoverCardHtml).join('')}</div>

    `;
    const topPostsEl = document.getElementById('topPostsList');
    if(topPostsEl) bindFeedListEvents(topPostsEl);
    document.getElementById('addFab').addEventListener('click', openAddModal);
    const search = document.getElementById('searchInput');
    if(search){
      search.addEventListener('input', (e) => { view.search = e.target.value; render(); setTimeout(()=>{
        const s = document.getElementById('searchInput'); if(s){ s.focus(); s.selectionStart = s.selectionEnd = s.value.length; }
      },0); });
    }
    document.querySelectorAll('.discover-row').forEach(el => {
      el.addEventListener('click', (e) => {
        if(e.target.closest('.follow-btn')) return;
        view = { name: 'profile', id: el.dataset.id }; render();
      });

    document.querySelectorAll('.follow-btn').forEach(btn => {

  async function exportAllData(){
    const backup = { exportedAt: new Date().toISOString(), profiles: {}, ratings: {}, feed: [] };
    // perfis
    const profileKeys = await window.storage.list('profile:', true);
    await Promise.all((profileKeys?.keys || []).map(async k => {
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) backup.profiles[k] = JSON.parse(r.value);
      }catch(e){}
    }));
    // notas (formato novo, uma chave por perfil)
    const ratingKeys = await window.storage.list('ratings:', true);
    await Promise.all((ratingKeys?.keys || []).map(async k => {
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) backup.ratings[k] = JSON.parse(r.value);
      }catch(e){}
    }));
    // feed (frequências)
    try{
      const r = await window.storage.get('feed', true);
      backup.feed = (r && r.value) ? JSON.parse(r.value) : [];
    }catch(e){}
    return backup;
  }

  function openBackupModal(){
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <div class="handle"></div>
        <h3>Backup dos dados</h3>
        <div class="field" style="text-align:center; max-width:320px;">
          <p style="color:var(--text-muted); font-size:13px; line-height:1.5; margin:0 0 16px;" id="backupStatus">
            Reunindo todos os perfis e notas...
          </p>
        </div>
        <div class="row-2" id="backupActions" style="display:none;">
          <button class="btn btn-primary" id="downloadBackupBtn">Baixar .json</button>
          <button class="btn btn-ghost" id="selectAllBtn">Selecionar tudo</button>
        </div>
        <textarea id="backupText" readonly style="display:none; width:100%; max-width:320px; height:160px; margin-top:14px; background:var(--card); border:1px solid var(--border); border-radius:13px; color:var(--text); font-family:'Manrope', sans-serif; font-size:11px; padding:10px;"></textarea>
        <button class="btn btn-ghost btn-block" id="closeBackupModal" style="max-width:320px; margin-top:14px;">Fechar</button>
      </div>
    `;
    document.body.appendChild(bg);
    bg.addEventListener('click', (e) => { if(e.target === bg) bg.remove(); });
    document.getElementById('closeBackupModal').addEventListener('click', () => bg.remove());

    exportAllData().then(backup => {
      const json = JSON.stringify(backup, null, 2);
      const status = document.getElementById('backupStatus');
      const nProfiles = Object.keys(backup.profiles).length;
      const nRatingSets = Object.keys(backup.ratings).length;
      status.textContent = `${nProfiles} perfis e ${nRatingSets} conjuntos de notas encontrados.`;
      document.getElementById('backupActions').style.display = 'flex';
      const textarea = document.getElementById('backupText');
      textarea.style.display = 'block';
      textarea.value = json;

      document.getElementById('downloadBackupBtn').addEventListener('click', () => {
        try{
          const blob = new Blob([json], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'aura-backup-' + new Date().toISOString().slice(0,10) + '.json';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }catch(e){
          showToast('Não deu pra baixar — copie o texto abaixo.');
        }
      });
      document.getElementById('selectAllBtn').addEventListener('click', () => {
        textarea.focus();
        textarea.select();
        showToast('Texto selecionado — use Ctrl+C / Cmd+C');
      });
    }).catch(() => {
      document.getElementById('backupStatus').textContent = 'Não consegui reunir os dados agora. Tente de novo em instantes.';
    });
  }

    // segue ela, a nota vira "—" pra você — mas o resto (contagem de
    // avaliações, seguidores etc.) continua normal

    const stats = auraHidden ? { ...rawStats, avg: null } : rawStats;

    if(!(id in followersCache) || !(id in givenCountCache) || !(id in boostedPostsCache) || !(id in followingCountCache) || !(id in ratingsCache)){

    document.querySelectorAll('.profile-tab-btn[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => { view.profileTab = btn.dataset.tab; renderProfileDetail(id); });
    });
    const followersStatBtn = document.getElementById('followersStatBtn');
    if(followersStatBtn) followersStatBtn.addEventListener('click', () => openFollowersModal(id));
    const followingStatBtn = document.getElementById('followingStatBtn');
    if(followingStatBtn) followingStatBtn.addEventListener('click', () => openFollowingModal(id));
    const profileAuraWidget = document.getElementById('profileAuraWidget');
    if(profileAuraWidget) profileAuraWidget.addEventListener('click', () => openRatersModal(id)); // nota + pontos de aura vêm das mesmas avaliações — mesma lista
    const profileGroupsTabBtn = document.getElementById('profileGroupsTabBtn');
    if(profileGroupsTabBtn) profileGroupsTabBtn.addEventListener('click', () => { view = { name: 'groups' }; render(); });

    if(isMe){
      const settingsBtn = document.getElementById('openSettingsBtn');
      if(settingsBtn) settingsBtn.addEventListener('click', () => { view = { name: 'settings' }; render(); });
    }

    if(!isMe){
      const followBtn = document.getElementById('followBtn');
      if(followBtn){
        followBtn.addEventListener('click', async () => {
          followBtn.disabled = true;
          try{
            await toggleFollow(id);
            renderProfileDetail(id);
          }catch(err){
            followBtn.disabled = false;
            showToast('Não deu pra seguir agora. Tente de novo.');
          }
        });
      }
      const dmBtn = document.getElementById('dmBtn');
      if(dmBtn) dmBtn.addEventListener('click', () => { view = { name: 'chat', id: id }; render(); });
      const slider = document.getElementById('rateSlider');
      const display = document.getElementById('rateDisplay');
      slider.addEventListener('input', () => {
        display.textContent = slider.value;
        display.style.color = scoreColor(parseInt(slider.value));
      });
      document.getElementById('sendRating').addEventListener('click', async (e) => {
        const btn = e.target;
        const originalLabel = btn.textContent;
        const score = parseInt(slider.value);
        btn.disabled = true;
        btn.textContent = 'Enviando...';
        try{
          await submitRating(id, score);
          showToast('Aura enviada');
          if(score >= 9){
            const rect = btn.getBoundingClientRect();
            burstConfetti(rect.left + rect.width / 2, rect.top);
          }
          renderProfileDetail(id);
        }catch(err){
          btn.disabled = false;
          btn.textContent = originalLabel;
          showToast('Não deu pra enviar. Tente de novo.');
        }
      });
    }
  }

    content.innerHTML = `
      <div class="back-row">
        <div class="lbl">Grupos</div>

  function openInviteToGroupModal(groupId, group){
    const bg = document.createElement('div');
    bg.className = 'modal-bg modal-bg-center';
    bg.innerHTML = `
      <div class="modal" style="max-height:70vh; max-height:70dvh; overflow-y:auto;">
        <h3>Adicionar ao grupo</h3>
        <div id="inviteList" style="width:100%; max-width:320px;"></div>
      </div>
    `;
    document.body.appendChild(bg);
    bg.addEventListener('click', (e) => { if(e.target === bg) bg.remove(); });
    const candidates = Object.values(profiles).filter(p => !(group.memberIds || []).includes(p.id));
    const listEl = document.getElementById('inviteList');
    if(candidates.length === 0){
      listEl.innerHTML = `<div class="feed-empty">Todo mundo que você conhece já está no grupo.</div>`;
      return;
    }
    listEl.innerHTML = candidates.map(p => `
      <div class="suggest-row">
        ${avatarHtml(p, 40)}
        <div class="suggest-row-info"><div class="name">${escapeHtml(p.name)}</div></div>
        <button class="follow-btn-mini" data-add-id="${p.id}">Adicionar</button>
      </div>
    `).join('');
    listEl.querySelectorAll('[data-add-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Adicionando...';
        try{
          await addGroupMember(groupId, btn.dataset.addId);
          btn.textContent = 'Adicionado ✓';
        }catch(err){
          btn.disabled = false;
          btn.textContent = 'Adicionar';
          showToast('Não deu. Tente de novo.');
        }
      });
    });
  }
  function renderGroupDetail(groupId){
    if(!profiles[ME_ID]){ view = { name: 'onboard' }; return renderOnboard(); }
    const content = renderShellAndGetContent();
    content.innerHTML = `
      <div id="groupContent" class="loading" style="padding:30px 0;">carregando grupo...</div>
    `;

    loadGroup(groupId).then(group => {
      const el = document.getElementById('groupContent');

      if(!group || !(group.memberIds || []).includes(ME_ID)){
        el.removeAttribute('style');

        return;
      }
      el.removeAttribute('style');
      el.className = '';
      const memberCount = (group.memberIds || []).length;
      const isOwner = group.ownerId === ME_ID;
      const groupTab = view.groupTab || 'feed';
      const groupPosts = feedCache.filter(p => p.groupId === groupId).sort((a, b) => b.createdAt - a.createdAt);
      const memberRanked = (group.memberIds || [])
        .map(id => ({ p: profiles[id], stats: ratingsCache[id] || { avg: null, count: 0 } }))
        .filter(x => x.p && x.stats.avg !== null)
        .sort((a, b) => (b.stats.avg || 0) - (a.stats.avg || 0));
      const groupAvatarInner = group.photo

          <button class="profile-tab-btn group-tab-btn ${groupTab === 'ranking' ? 'active' : ''}" data-tab="ranking" title="Top auras do grupo">${ICON_TROPHY}</button>
        </div>
        <div id="groupTabContent">${groupTab === 'ranking' ? `
          <div class="rank-panel">
            <div class="rank-list">${memberRanked.length === 0 ? `<div class="feed-empty">Ninguém do grupo tem aura avaliada ainda.</div>` : memberRanked.map((x, i) => rankRowHtml(x.p, x.stats, i)).join('')}</div>
          </div>
        ` : `
          <div class="feed-compose">
            <textarea id="groupPostText" maxlength="240" placeholder="Escreva pro grupo..."></textarea>
            <div class="feed-compose-footer">
              <span></span>
              <span class="feed-char-count" id="groupCharCount">240</span>
              <button class="btn btn-primary feed-post-btn" id="groupPostBtn">Publicar</button>
            </div>
          </div>
          <div id="groupFeedList">${groupPosts.length === 0 ? `<div class="feed-empty">Nenhuma frequência nesse grupo ainda.</div>` : groupPosts.map(p => feedItemHtml(p, null, true)).join('')}</div>
        `}</div>
      `;
      document.querySelectorAll('.group-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => { view.groupTab = btn.dataset.tab; renderGroupDetail(groupId); });
      });
      if(groupTab === 'ranking'){
        document.querySelectorAll('.rank-row').forEach(rowEl => {
          rowEl.addEventListener('click', () => { view = { name: 'profile', id: rowEl.dataset.id }; render(); });
        });
      }
      const groupFeedEl = document.getElementById('groupFeedList');
      if(groupFeedEl) bindFeedListEvents(groupFeedEl);

      const textarea = document.getElementById('groupPostText');
      const charCount = document.getElementById('groupCharCount');
      const postBtn = document.getElementById('groupPostBtn');
      if(textarea){
      attachMentionAutocomplete(textarea, textarea.closest('.feed-compose'));
      textarea.addEventListener('input', () => { charCount.textContent = 240 - textarea.value.length; });
      postBtn.addEventListener('click', async () => {
        const text = textarea.value.trim();
        if(!text) return;
        if(containsBlockedContent(text)){
          showToast('Esse conteúdo não é permitido no Aura.', 3500);
          return;
        }
        postBtn.disabled = true;
        try{
          await publishPost(text, null, groupId);
          renderGroupDetail(groupId);
        }catch(err){
          showToast('Não deu pra publicar. Tente de novo.');
          postBtn.disabled = false;
        }
      });
      }

      document.getElementById('inviteMemberBtn').addEventListener('click', () => openInviteToGroupModal(groupId, group));
      if(isOwner){
        const avatarWrap = document.getElementById('groupAvatarWrap');
        const photoInput = document.getElementById('groupPhotoInput');
        const hoverEl = avatarWrap.querySelector('.group-avatar-hover');
        avatarWrap.addEventListener('mouseenter', () => { if(hoverEl) hoverEl.style.opacity = '1'; });
        avatarWrap.addEventListener('mouseleave', () => { if(hoverEl) hoverEl.style.opacity = '0'; });
        avatarWrap.addEventListener('click', () => photoInput.click());
        photoInput.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if(!file) return;
          try{
            const photoData = await fileToResizedDataUrl(file);
            await updateGroupPhoto(groupId, photoData);
            renderGroupDetail(groupId);
          }catch(err){
            showToast('Não deu pra trocar a foto. Tente de novo.');
          }
        });
      }
    }).catch(() => {
      const el = document.getElementById('groupContent');
      if(el){ el.removeAttribute('style'); el.className = 'empty'; el.innerHTML = `<p>Não deu pra carregar o grupo.</p>`; }
    });
  }

        const val = hideAuraToggle.checked;
        hideAuraToggle.disabled = true;
        try{
          await saveProfile({ ...me, hideAuraFromNonFollowers: val });
          showToast(val ? 'Sua nota de aura agora fica escondida de quem não te segue.' : 'Sua nota de aura voltou a ficar visível pra todo mundo.');
        }catch(err){
          hideAuraToggle.checked = !val;
          showToast('Não deu pra salvar. Tente de novo.');
        }
        hideAuraToggle.disabled = false;
      });
    }
    const rateAnonymouslyToggle = document.getElementById('rateAnonymouslyToggle');
    if(rateAnonymouslyToggle){
      rateAnonymouslyToggle.addEventListener('change', async () => {
        const val = rateAnonymouslyToggle.checked;
        rateAnonymouslyToggle.disabled = true;
        try{
          await saveProfile({ ...me, rateAnonymously: val });
          showToast(val ? 'A partir de agora suas avaliações aparecem como anônimas.' : 'Suas avaliações voltam a mostrar seu nome.');
        }catch(err){
          rateAnonymouslyToggle.checked = !val;
          showToast('Não deu pra salvar. Tente de novo.');
        }
        rateAnonymouslyToggle.disabled = false;
      });
    }
    document.querySelectorAll('.notifPrefToggle').forEach(toggle => {
      toggle.addEventListener('change', async () => {
        const key = toggle.dataset.key;
        const val = toggle.checked;
        toggle.disabled = true;
        try{
          const notifPrefs = { ...(me?.notifPrefs || {}), [key]: val };
          await saveProfile({ ...me, notifPrefs });
        }catch(err){
          toggle.checked = !val;
          showToast('Não deu pra salvar. Tente de novo.');
        }
        toggle.disabled = false;
      });
    });
    const insightsBtn = document.getElementById('insightsBtn');
    if(insightsBtn) insightsBtn.addEventListener('click', () => { view = { name: 'insights' }; render(); });
    const editProfileLinkBtn = document.getElementById('editProfileLinkBtn');
    if(editProfileLinkBtn) editProfileLinkBtn.addEventListener('click', () => { view = { name: 'edit' }; render(); });
    const changePasswordBtn = document.getElementById('changePasswordBtn');
    if(changePasswordBtn){
      changePasswordBtn.addEventListener('click', async () => {
        changePasswordBtn.disabled = true;
        try{
          await window._auraAuth.sendPasswordReset(email);
          showToast('Te mandamos um e-mail com o link pra trocar a senha.', 4000);
        }catch(err){
          showToast('Não deu pra enviar o e-mail. Tente de novo.');
        }
        changePasswordBtn.disabled = false;
      });
    }
    const installBtn = document.getElementById('installAppBtn');
    if(installBtn){
      installBtn.addEventListener('click', async () => {
        if(window._auraInstallPrompt){
          window._auraInstallPrompt.prompt();
          const result = await window._auraInstallPrompt.userChoice;
          window._auraInstallPrompt = null;
          if(result.outcome === 'accepted') showToast('App instalado!');
        } else {
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          if(isIOS){
            showToast('No iPhone: toque em Compartilhar ⬆️ e escolha "Adicionar à Tela de Início".', 5000);
          } else {
            showToast('Abra o menu do navegador e procure "Instalar app" ou "Adicionar à tela inicial".', 5000);
          }
        }
      });
    }
    document.getElementById('togglePrivacy').addEventListener('click', () => {
      const el = document.getElementById('privacyText');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    });
    document.getElementById('settingsLogoutBtn').addEventListener('click', () => {
      window._auraAuth.signOut();
    });
  }

  // ---------- insights (dentro de configurações) ----------
  // um retrato do momento (não é um gráfico histórico — o app não guarda o
  // dado do passado pra isso ainda), reunindo o que já está espalhado pelo
  // app (visualizações, avaliações, farmar aura, comentários) num só lugar.
  function renderInsights(){
    const myPosts = feedCache.filter(p => p.authorId === ME_ID);
    const totalViews = myPosts.reduce((s, p) => s + (postViewsCache[p.id] || 0), 0);
    const totalBoosts = myPosts.reduce((s, p) => s + ((boostsCache[p.id] || {}).count || 0), 0);
    const totalComments = myPosts.reduce((s, p) => s + (postCommentsCache[p.id] ? postCommentsCache[p.id].length : (p.commentCount || 0)), 0);
    const totalPostRatings = myPosts.reduce((s, p) => s + ((postRatingsCache[p.id] || {}).count || 0), 0);
    // a "frequência em destaque" é a que tem MAIS avaliações (não só a nota
    // média mais alta isolada) — uma única nota 10 não deveria ganhar de uma
    // frequência com várias avaliações boas; em empate, desempata pela média
    let bestPost = null;
    myPosts.forEach(p => {
      const stats = postRatingsCache[p.id] || { avg: null, count: 0 };
      if(!stats.count) return;
      if(bestPost === null || stats.count > bestPost.count || (stats.count === bestPost.count && stats.avg > bestPost.avg)){
        bestPost = { post: p, avg: stats.avg, count: stats.count };
      }
    });
    const myStats = ratingsCache[ME_ID] || { avg: null, count: 0 };
    const fStats = followersCache[ME_ID] || { count: 0 };
    const followingCount = followingCountCache[ME_ID] ?? 0;

    const content = renderShellAndGetContent();
    content.innerHTML = `
      <div class="back-row">
        <div class="icon-btn arrow-btn-plain" id="backToSettingsBtn" title="Voltar">${ICON_ARROW_LEFT}</div>
        <div class="lbl">Insights da sua conta</div>
      </div>
      <div class="insights-hero">
        ${scoreGaugeHtml(myStats.avg, 80)}
        <div>
          <div class="score-summary-level">Sua aura</div>
          <div class="score-summary-sub">${myStats.count} avaliaç${myStats.count === 1 ? 'ão' : 'ões'} recebida${myStats.count === 1 ? '' : 's'} no total</div>
        </div>
      </div>
      <div class="insights-grid">
        <div class="insights-tile"><div class="insights-num">${myPosts.length}</div><div class="insights-lbl">Frequências publicadas</div></div>
        <div class="insights-tile"><div class="insights-num">${totalViews}</div><div class="insights-lbl">Visualizações no total</div></div>
        <div class="insights-tile"><div class="insights-num">${totalPostRatings}</div><div class="insights-lbl">Avaliações nas frequências</div></div>
        <div class="insights-tile"><div class="insights-num">${totalBoosts}</div><div class="insights-lbl">Vezes que farmaram sua aura</div></div>
        <div class="insights-tile"><div class="insights-num">${totalComments}</div><div class="insights-lbl">Comentários recebidos</div></div>
        <div class="insights-tile"><div class="insights-num">${formatAuraCount(fStats.count)}</div><div class="insights-lbl">Seguidores</div></div>
        <div class="insights-tile"><div class="insights-num">${formatAuraCount(followingCount)}</div><div class="insights-lbl">Seguindo</div></div>
      </div>
      ${bestPost ? `
        <div class="section-label" style="margin-top:22px;"><h2>Sua frequência mais avaliada</h2></div>
        <div id="insightsBestPost">${feedItemHtml(bestPost.post)}</div>
      ` : ''}
    `;
    document.getElementById('backToSettingsBtn').addEventListener('click', () => { view = { name: view.from || 'settings' }; render(); });
    const bestPostEl = document.getElementById('insightsBestPost');
    if(bestPostEl) bindFeedListEvents(bestPostEl);
  }

  function renderEdit(){
    const me = profiles[ME_ID];
    const content = renderShellAndGetContent();
    content.innerHTML = `
      <div class="back-row">
        <div class="lbl">Editar perfil</div>
      </div>
      <div class="edit-photo-row">
        <div class="photo-picker" id="photoPicker">
          ${me.photo ? `<img src="${me.photo}" />` : `<div class="ph-label">toque para<br/>escolher foto</div>`}
        </div>
      </div>
      <input type="file" accept="image/*" id="fileInput" style="display:none;" />
      <div class="edit-field">
        <label class="edit-field-label">Nome</label>
        <input type="text" id="nameInput" placeholder="Seu nome" maxlength="40" value="${escapeHtml(me.name)}" />
      </div>
      <div class="edit-field">
        <label class="edit-field-label">Nome de usuário</label>
        <div class="username-wrap">
          <span class="username-at">@</span>
          <input type="text" id="usernameInput" class="username-input" placeholder="nome_de_usuario" maxlength="24" value="${escapeHtml(me.username || '')}" />
        </div>
        <div class="field-error" id="usernameError"></div>
      </div>
      <div class="edit-field">
        <label class="edit-field-label">Bio</label>
        <textarea class="bio-input" id="bioInput" maxlength="140" placeholder="Escreva uma bio curta (opcional)">${escapeHtml(me.bio || '')}</textarea>
      </div>
      <button class="btn btn-primary btn-block" id="saveBtn">Salvar alterações</button>
    `;
    let photoData = me.photo;
    const picker = document.getElementById('photoPicker');
    const fileInput = document.getElementById('fileInput');
    const usernameInput = document.getElementById('usernameInput');
    const usernameError = document.getElementById('usernameError');
    picker.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      try{
        photoData = await fileToResizedDataUrl(file);
        picker.innerHTML = `<img src="${photoData}" />`;
      }catch(err){
        showToast('Não deu (' + ((err && err.message) || 'erro desconhecido') + '). Tente outra foto.', 4000);
      }
    });
    usernameInput.addEventListener('input', () => {
      const clean = usernameInput.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
      if(clean !== usernameInput.value) usernameInput.value = clean;
      usernameError.textContent = '';
    });
    document.getElementById('saveBtn').addEventListener('click', async (e) => {
      const name = document.getElementById('nameInput').value.trim();
      const username = usernameInput.value.trim();
      if(!name) return;
      if(username.length < 3){ usernameError.textContent = 'O nome de usuário precisa de pelo menos 3 caracteres.'; return; }
      if(usernameTaken(username, ME_ID)){ usernameError.textContent = 'Esse nome de usuário já está em uso.'; return; }
      const bioVal = document.getElementById('bioInput').value.trim();
      if(containsBlockedContent(name) || containsBlockedContent(bioVal)){
        showToast('Esse conteúdo não é permitido no Aura.', 3500);
        return;
      }
      const btn = e.target;
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Salvando...';
      try{
        const bio = bioVal;
        const p = { ...me, name, username, photo: photoData, bio };
        await saveProfile(p);
        view = { name: 'profile', id: ME_ID };
        render();
      }catch(err){
        btn.disabled = false;
        btn.textContent = originalLabel;
        const detail = (err && err.message) ? err.message : 'erro desconhecido';
        showToast('Não deu pra salvar (' + detail + ').', 5000);
      }
    });
  }

  // ---------- boot ----------
  // ---------- puxar pra baixo no topo do feed pra atualizar ----------
  (function setupPullToRefresh(){
    const REFRESH_THRESHOLD = 80;
    const ARROW_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>';
    let startY = null, pulling = false, triggered = false, refreshing = false;
    let indicatorEl = null;
    function getIndicator(){
      if(indicatorEl) return indicatorEl;
      indicatorEl = document.createElement('div');
      indicatorEl.className = 'ptr-indicator';
      indicatorEl.innerHTML = `<span class="ptr-arrow">${ARROW_SVG}</span><span class="ptr-label">Puxe para atualizar</span>`;
      document.body.appendChild(indicatorEl);
      return indicatorEl;
    }
    // funciona em qualquer tela (não só no feed), desde que já esteja no topo
    // da rolagem e não tenha nenhum modal aberto por cima (senão brigaria com
    // o gesto de fechar/rolar dentro do modal)
    const NO_PULL_VIEWS = { loading: true, auth: true, onboard: true, error: true };
    document.addEventListener('touchstart', (e) => {
      if(!NO_PULL_VIEWS[view.name] && window.scrollY <= 0 && !document.querySelector('.modal-bg')){
        startY = e.touches[0].clientY;
        pulling = true;
        triggered = false;
      }
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if(!pulling || startY === null || refreshing) return;
      const diff = e.touches[0].clientY - startY;
      const ind = getIndicator();
      if(diff <= 4){
        ind.classList.remove('visible');
        triggered = false;
        return;
      }
      triggered = diff > REFRESH_THRESHOLD;
      ind.classList.add('visible');
      const label = ind.querySelector('.ptr-label');
      const arrow = ind.querySelector('.ptr-arrow');
      const pct = Math.min(diff / REFRESH_THRESHOLD, 1);
      arrow.style.transform = `rotate(${triggered ? 180 : pct * 180}deg)`;
      label.textContent = triggered ? 'Solte para atualizar' : 'Puxe para atualizar';
    }, { passive: true });
    document.addEventListener('touchend', async () => {
      const ind = getIndicator();
      if(pulling && triggered && !refreshing){
        refreshing = true;
        ind.classList.add('visible', 'spinning');
        ind.querySelector('.ptr-label').textContent = 'Atualizando...';
        try{
          await Promise.all([
            withTimeout(loadFeed(), 8000).catch(() => {}),
            withTimeout(loadAllPostRatings(), 8000).catch(() => {}),
            withTimeout(loadAllBoosts(), 8000).catch(() => {}),
            withTimeout(loadAllRatings(), 8000).catch(() => {}),
            withTimeout(loadAllFollowers(), 8000).catch(() => {}),
          ]);
          refreshTopAuraRanks();
          render(); // redesenha a tela atual, seja ela qual for, com os dados frescos
          showToast('Atualizado');
        }catch(e){ /* best-effort */ }
        refreshing = false;
        ind.classList.remove('spinning');
      }
      ind.classList.remove('visible');
      pulling = false; startY = null; triggered = false;
    }, { passive: true });
  })();

  let authInited = false;
  async function boot(){
    if(!ME_ID){
      view = { name: 'auth' };
      render();
      return;
    }
    view = { name: 'loading' };
    render();
    try{
      await withTimeout(loadAllProfiles(), 10000);
    }catch(e){
      view = { name: 'error' };
      render();
      return;
    }
    if(profiles[ME_ID]){
      // "conserta sozinho" o índice @usuario -> e-mail pra quem já tinha um @ definido
      // ANTES do login por @ existir — sem isso, só quem TROCASSE de @ depois dessa
      // atualização ganhava o índice, e todo mundo mais antigo ficava sem conseguir
      // entrar digitando o @ (só com e-mail continuava funcionando normalmente)
      backfillUsernameIndex(profiles[ME_ID]); // best-effort, não trava o boot
      try{ await withTimeout(loadAllRatings(), 10000); }catch(e){ /* segue com o que já temos */ }
      refreshTopAuraRanks(); // precisa vir logo depois das avaliações carregarem
      try{ await withTimeout(loadFeed(), 10000); }catch(e){ /* feed é best-effort */ }
      try{ await withTimeout(loadAllPostRatings(), 10000); }catch(e){ /* idem */ }
      try{ await withTimeout(loadAllPostViews(), 10000); }catch(e){ /* idem */ }
      try{ await withTimeout(loadAllFollowers(), 10000); }catch(e){ /* idem */ }
      try{ await withTimeout(loadAllBoosts(), 10000); }catch(e){ /* idem */ }
      try{ await withTimeout(loadBoostedPosts(ME_ID), 10000); }catch(e){ /* idem */ }
      // precisa estar carregado ANTES do feed/perfil renderizarem, senão a gente
      // não sabe ainda quem é membro de qual grupo pra decidir se mostra ou
      // esconde uma frequência de grupo fora da página do próprio grupo
      try{ await withTimeout(loadMyGroups(), 10000); }catch(e){ /* idem */ }
      // precisa vir DEPOIS de ratings e followers carregados, senão não tem com
      // o que comparar; roda só uma vez por abertura do app (não a cada render),
      // pra não sobrescrever a "foto anterior" antes do usuário ver as novidades
      try{ await withTimeout(computeRecapUpdates(), 10000); }catch(e){ /* idem */ }
      refreshUnreadBadge(); // best-effort, não bloqueia a tela inicial
      refreshUnreadNotifCount(); // idem
      updateMyPresence();
      refreshOnlineSet();
      if(!window._auraUnreadPoll){
        window._auraUnreadPoll = setInterval(() => {
          refreshUnreadBadge();
          refreshUnreadNotifCount();
          updateMyPresence();
          refreshOnlineSet();
          refreshTopAuraRanks(); // o Top 10 muda com o tempo — recalcula com o que já está em cache
        }, 20000);
      }
      view = { name: 'home' };
    } else {
      view = { name: 'onboard' };
    }
    render();
  }
  window.addEventListener('unhandledrejection', (ev) => {
    showToast('Algo deu errado. Tente de novo.');
  });
  // mantém elementos fixos no rodapé (como a caixa de digitar do chat) acima do teclado
  // no celular — vh/dvh não sabem que o teclado abriu, só a Visual Viewport API sabe
  if(window.visualViewport){
    const vv = window.visualViewport;
    function syncKeyboardInset(){
      const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--keyboard-inset', inset + 'px');
    }
    vv.addEventListener('resize', syncKeyboardInset);
    vv.addEventListener('scroll', syncKeyboardInset);
    syncKeyboardInset();
  }
  // esconde a barra de topo ao rolar pra baixo, e traz ela de volta assim que
  // o usuário rola pra cima — mesmo no meio do feed, sem precisar voltar ao topo.
  // Fica num listener só (não por render()) porque a .top-bar é recriada toda
  // vez que a tela muda, então buscamos ela de novo a cada evento de scroll.
  (function setupTopBarAutoHide(){
    let lastY = window.scrollY;
    let ticking = false;
    window.addEventListener('scroll', () => {
      if(ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const bar = document.querySelector('.top-bar.top-bar-autohide');
        if(bar){
          const y = window.scrollY;
          const delta = y - lastY;
          if(y < 40) bar.classList.remove('top-bar-hidden');
          else if(delta > 4) bar.classList.add('top-bar-hidden');
          else if(delta < -4) bar.classList.remove('top-bar-hidden');
          lastY = y;
        }
        ticking = false;
      });
    }, { passive: true });
  })();
  view = { name: 'loading' };
  render();
  window._auraAuth.onChange((user) => {
    const newId = user ? user.uid : null;
    if(authInited && newId === ME_ID) return; // nada mudou
    authInited = true;
    ME_ID = newId;
    boot();
  });
})();
});
</script>
