  // galeria no canto inferior esquerdo, texto em cima e enviar no canto
  // inferior direito. Se a câmera falhar (sem permissão, sem câmera, etc.)
  // cai direto pra galeria, sem travar o recurso.
  function openStoryCameraView(){
    const overlay = document.createElement('div');
    overlay.id = 'storyCameraOverlay';
    overlay.className = 'story-camera-overlay';
    overlay.innerHTML = `
      <div class="story-editor-stage" id="storyEditorStage">
        <video id="storyCameraVideo" autoplay playsinline muted></video>
        <img id="storyPickedImg" style="display:none;" />
        <div id="storyTextLayers" style="position:absolute; inset:0; z-index:2;"></div>
        <button class="story-cam-close" id="storyCamClose" title="Fechar">✕</button>
        <button class="story-cam-text-btn" id="storyCamTextBtn" title="Adicionar texto">Aa</button>
        <button class="story-cam-done-btn" id="storyCamDoneBtn" type="button">Concluído</button>
        <div class="story-cam-color-row" id="storyCamColorRow"></div>
        <button class="story-cam-shutter" id="storyCamShutterBtn" title="Tirar foto"></button>
        <div class="story-text-trash-zone" id="storyTextTrashZone">${ICON_TRASH}</div>
      </div>
      <div class="story-cam-bottom-bar" id="storyCamBottomBar">
        <div class="story-cam-mode-row" id="storyCamModeRow">
          <button type="button" class="story-cam-mode-btn active" data-mode="story">Story</button>
          <button type="button" class="story-cam-mode-btn" data-mode="post">Frequência</button>
        </div>
        <div class="story-cam-controls-row">
          <button class="story-cam-gallery-btn" id="storyCamGalleryBtn" title="Escolher da galeria">${ICON_IMAGE}</button>
          <input type="file" id="storyCamGalleryInput" accept="image/*" style="display:none;" />
          <div class="story-cam-right-slot">
            <button class="story-cam-flip-btn" id="storyCamFlipBtn" title="Virar câmera">${ICON_CAMERA_FLIP}</button>
            <button class="story-cam-send-btn" id="storyCamSendBtn" title="Publicar">${ICON_ARROW_RIGHT}</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    let stream = null;
    let mode = 'camera'; // 'camera' (vendo ao vivo, mostra o obturador) ou 'preview' (foto parada, mostra texto+enviar)
    let postMode = 'story'; // 'story' ou 'post' — escolhido pelas abas em cima do obturador, igual Instagram
    let textLayers = []; // { id, text, xPct, yPct, color }
    let nextLayerId = 1;
    let editingLayerId = null; // id da camada de texto sendo digitada agora (ou null)
    let pinchStartDist = null; // distância inicial do beliscão (pinça) pra zoom
    let pinchStartZoom = null;
    // zoom "digital" via CSS transform no próprio <video> do preview, em vez
    // de mandar applyConstraints({zoom}) pro hardware da câmera a cada
    // movimento do dedo — era isso que piscava/travava a tela (o navegador
    // tenta renegociar o stream de vídeo a cada chamada, e isso não é
    // instantâneo). Escalando o preview com CSS o zoom acompanha o dedo AO
    // VIVO, sem nenhuma piscada, igual o Instagram — e na hora de tirar a
    // foto, recorta o frame no mesmo nível de zoom (ver shutterBtn abaixo)
    let currentZoom = 1;
    const MAX_ZOOM = 3;
    function applyVideoTransform(){
      const mirror = currentFacing === 'user' ? 'scaleX(-1) ' : '';
      video.style.transform = mirror + 'scale(' + currentZoom + ')';
    }
    const video = document.getElementById('storyCameraVideo');
    const pickedImg = document.getElementById('storyPickedImg');
    const stage = document.getElementById('storyEditorStage');
    const textLayersWrap = document.getElementById('storyTextLayers');
    const galleryInput = document.getElementById('storyCamGalleryInput');
    const closeBtn = document.getElementById('storyCamClose');
    const textBtn = document.getElementById('storyCamTextBtn');
    const galleryBtn = document.getElementById('storyCamGalleryBtn');
    const shutterBtn = document.getElementById('storyCamShutterBtn');
    const flipBtn = document.getElementById('storyCamFlipBtn');
    const sendBtn = document.getElementById('storyCamSendBtn');
    const doneBtn = document.getElementById('storyCamDoneBtn');
    const modeRow = document.getElementById('storyCamModeRow');
    const colorRow = document.getElementById('storyCamColorRow');
    const trashZone = document.getElementById('storyTextTrashZone');
    let currentFacing = 'environment'; // câmera traseira por padrão; o botão de virar troca pra 'user' (frontal)

    function stopCamera(){
      if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    }
    function closeView(){
      stopCamera();
      overlay.remove();
    }
    // descarta a foto parada e volta pra câmera ao vivo — usado tanto pelo "✕"
    // (quando já tem foto tirada) quanto pelo botão de trocar de câmera
    function discardPhotoAndRestartCamera(){
      pickedImg.style.display = 'none';
      textLayers = [];
      editingLayerId = null;
      renderCamTextLayers();
      startCamera();
    }
    // troca entre "câmera ao vivo, com botão de tirar foto e virar câmera" e
    // "foto parada, com botão de texto e de enviar"
    function setMode(next){
      mode = next;
      if(mode === 'camera'){
        textBtn.style.display = 'none';
        shutterBtn.style.display = 'block';
        flipBtn.style.display = 'flex';
        sendBtn.style.display = 'none';
        modeRow.style.display = 'flex';
      } else {
        textBtn.style.display = 'flex';
        shutterBtn.style.display = 'none';
        flipBtn.style.display = 'none';
        sendBtn.style.display = 'flex';
        modeRow.style.display = 'none';
      }
    }
    modeRow.querySelectorAll('.story-cam-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        postMode = btn.dataset.mode;
        modeRow.querySelectorAll('.story-cam-mode-btn').forEach(b => b.classList.toggle('active', b === btn));
      });
    });
    async function startCamera(){
      try{
        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('sem suporte');
        // ANTES pedia uma resolução quadrada (1920x1920), e depois um formato
        // retrato fixo (1080x1920 + aspectRatio) achando que ia garantir
        // qualidade alta — mas forçar QUALQUER formato que não seja o nativo
        // do sensor faz vários celulares recortarem/aumentarem o zoom da
        // câmera pra encaixar nesse formato. Pedindo só uma largura "ideal"
        // (sem travar altura nem proporção) o navegador fica livre pra
        // escolher a proporção nativa da câmera de verdade — sem recorte,
        // sem zoom estranho — só usando uma resolução melhor que o mínimo.
        const constraints = { video: { facingMode: currentFacing, width: { ideal: 1280 } }, audio: false };
        try{
          stream = await navigator.mediaDevices.getUserMedia(constraints);
        }catch(e2){
          // alguns navegadores/câmeras recusam constraints muito específicas —
          // cai pro pedido simples de antes em vez de desistir da câmera
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing }, audio: false });
        }
        video.srcObject = stream;
        video.style.display = 'block';
        currentZoom = 1;
        // espelha o preview na câmera frontal (selfie), igual todo app de câmera
        applyVideoTransform();
        pickedImg.style.display = 'none';
        setMode('camera');
      }catch(e){
        // sem câmera/permissão negada — abre a galeria direto como alternativa,
        // pra a pessoa conseguir postar um story de qualquer jeito
        video.style.display = 'none';
        galleryInput.click();
      }
    }
    // zoom da câmera beliscando com dois dedos (pinch), igual todo app de
    // câmera — só funciona onde o navegador expõe zoom óptico/digital via
    // getUserMedia (principalmente Chrome no Android; sem suporte, os dedos
    // simplesmente não fazem nada, sem quebrar mais nada na tela)
    function touchDist(touches){
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }
    // { passive:false } + preventDefault: sem isso, o gesto de beliscar
    // controla o zoom da câmera E TAMBÉM o zoom nativo da página ao mesmo
    // tempo (o navegador trata pinch como "dar zoom na tela" por padrão) —
    // com passive:true o preventDefault() não tem efeito nenhum, então o
    // zoom da página continuava acontecendo junto
    stage.addEventListener('touchstart', (e) => {
      if(e.touches.length !== 2 || !stream) return;
      e.preventDefault();
      pinchStartDist = touchDist(e.touches);
      pinchStartZoom = currentZoom;
    }, { passive: false });
    stage.addEventListener('touchmove', (e) => {
      if(e.touches.length !== 2) return;
      e.preventDefault();
      if(pinchStartDist === null || !stream) return;
      const scale = touchDist(e.touches) / pinchStartDist;
      let z = pinchStartZoom * scale;
      z = Math.max(1, Math.min(MAX_ZOOM, z));
      currentZoom = z;
      applyVideoTransform();
    }, { passive: false });
    stage.addEventListener('touchend', (e) => {
      if(e.touches.length < 2) pinchStartDist = null;
    }, { passive: true });
    // no modo de prévia (já tem foto tirada), o "✕" descarta a foto e volta
    // pra câmera em vez de fechar tudo — fechar de verdade só a partir da
    // câmera ao vivo, pra não sumir com uma foto sem querer
    closeBtn.addEventListener('click', () => {
      if(mode === 'preview') discardPhotoAndRestartCamera();
      else closeView();
    });
    flipBtn.addEventListener('click', () => {
      currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
      stopCamera();
      startCamera();
    });

    galleryBtn.addEventListener('click', () => { galleryInput.click(); });
    shutterBtn.addEventListener('click', () => {
      if(!(stream && video.videoWidth)) return;
      // limita o tamanho do lado maior — a câmera do celular às vezes entrega
      // frame gigante (ex: 1920x1080), sem isso a foto ia pro banco bem mais
      // pesada do que precisa
      const maxDim = 1080;
      const scale = Math.min(1, maxDim / Math.max(video.videoWidth, video.videoHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      const ctx = canvas.getContext('2d');
      // a foto capturada da câmera frontal também sai espelhada, igual o
      // preview que a pessoa estava vendo na tela (senão a selfie sai com
      // tudo invertido em relação ao que ela via ao vivo)
      if(currentFacing === 'user'){
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      // recorta o centro do frame de acordo com o zoom digital escolhido no
      // pinça — sem isso a foto salva saía sempre sem zoom nenhum, só o
      // preview na tela é que parecia zoomado
      const cropW = video.videoWidth / currentZoom;
      const cropH = video.videoHeight / currentZoom;
      const cropX = (video.videoWidth - cropW) / 2;
      const cropY = (video.videoHeight - cropH) / 2;
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
      pickedImg.src = canvas.toDataURL('image/jpeg', 0.85);
      pickedImg.style.display = 'block';
      video.style.display = 'none';
      stopCamera();
      setMode('preview');
    });
    galleryInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;

        const attempts = [[1000, 0.7], [800, 0.55], [600, 0.4], [450, 0.3]];
        let result = null;
        for(const [dim, q] of attempts){
          result = await resizeImageDataUrl(file, dim, q);
          if(result.length < 700000) break;
        }
        if(result.length >= 900000){
          showToast('Essa foto é grande demais mesmo comprimida. Tenta uma mais simples.', 3500);
          galleryInput.value = '';
          return;
        }
        pickedImg.src = result;
        pickedImg.style.display = 'block';
        video.style.display = 'none';
        stopCamera();
        setMode('preview');
      }catch(err){
        showToast('Não deu (' + ((err && err.message) || 'erro desconhecido') + '). Tente outra imagem.', 4000);
      }
    });

    // true se o ponto (clientX/clientY) tá em cima da lixeira — usa a
    // distância até o centro dela em vez de getBoundingClientRect simples
    // porque ela é redonda, então os "cantos" do quadrado que envolve o
    // círculo não deviam contar como "em cima"
    function isOverTrashZone(clientX, clientY){
      if(!trashZone) return false;
      const rect = trashZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dist = Math.hypot(clientX - cx, clientY - cy);
      return dist <= (rect.width / 2) + 14; // uma margenzinha extra, pra não precisar mirar certinho
    }
    // renderiza as camadas de texto — a que está sendo digitada agora
    // (editingLayerId) vira um <div contenteditable>, sem arrastar; as outras
    // continuam arrastáveis por pointer events, igual antes
    function renderCamTextLayers(){
      textLayersWrap.innerHTML = textLayers.map(l => {
        // enquanto tá SENDO DIGITADA, a camada fica sempre centralizada — não
        // no meio da FOTO inteira, mas no meio do espaço que sobra ACIMA do
        // teclado (--keyboard-inset, o mesmo valor usado no chat), senão com
        // o teclado aberto ela ficava perto demais da borda de baixo (ou
        // escondida atrás dele), igual o Instagram já resolve. Só quando
        // termina de editar (finishTextEditing) ela volta pra posição
        // salva/arrastada (xPct/yPct).
        const isEditing = l.id === editingLayerId;
        const posStyle = isEditing
          ? 'left:50%; top:calc((100% - var(--keyboard-inset, 0px)) / 2);'
          : `left:${l.xPct}%; top:${l.yPct}%;`;
        return `<div class="story-edit-text-layer" data-layer-id="${l.id}" ${isEditing ? 'contenteditable="true"' : ''} style="${posStyle} color:${l.color};">${escapeHtml(l.text)}</div>`;
      }).join('');
      textLayersWrap.querySelectorAll('.story-edit-text-layer').forEach(el => {
        const layerId = Number(el.dataset.layerId);
        if(layerId === editingLayerId){
          el.addEventListener('input', () => {
            const layer = textLayers.find(l => l.id === layerId);
            if(layer) layer.text = el.textContent;
          });
          el.addEventListener('keydown', (e) => {
            // texto do story é de uma linha só (igual antes) — Enter conclui
            // em vez de quebrar linha
            if(e.key === 'Enter'){ e.preventDefault(); finishTextEditing(); }
          });
          // no celular, apertar "OK"/"concluído" no PRÓPRIO teclado (em vez do
          // botão "Concluído" da tela) muitas vezes não dispara o Enter acima
          // — o teclado só fecha, sem terminar a edição, e a pessoa tinha que
          // apertar "Concluído" de novo, um passo a mais que o Instagram não
          // pede. Como fechar o teclado SEMPRE dispara "blur" (esse sim é
          // confiável em qualquer celular), tratando o blur como "terminei de
          // escrever" cobre esse caso também — sem precisar dos dois toques.
          el.addEventListener('blur', () => finishTextEditing());
          return;
        }
        let dragging = false;
        el.addEventListener('pointerdown', (e) => {
          dragging = true;
          el.setPointerCapture(e.pointerId);
          // lixeira aparece no lugar do obturador enquanto arrasta um texto —
          // soltar em cima dela apaga o texto, igual Instagram/Snapchat
          if(trashZone) trashZone.classList.add('visible');
          if(shutterBtn) shutterBtn.style.opacity = '0';
        });
        el.addEventListener('pointermove', (e) => {
          if(!dragging) return;
          const overTrash = isOverTrashZone(e.clientX, e.clientY);
          if(trashZone) trashZone.classList.toggle('armed', overTrash);
          if(overTrash){
            // "gruda" o texto na lixeira pra ficar óbvio que vai apagar
            el.style.opacity = '0.35';
            el.style.transform = 'translate(-50%, -50%) scale(0.6)';
            return;
          }
          el.style.opacity = '';
          el.style.transform = '';
          const box = stage.getBoundingClientRect();
          let xPct = ((e.clientX - box.left) / box.width) * 100;
          let yPct = ((e.clientY - box.top) / box.height) * 100;
          xPct = Math.max(5, Math.min(95, xPct));
          yPct = Math.max(5, Math.min(95, yPct));
          el.style.left = xPct + '%';
          el.style.top = yPct + '%';
          const layer = textLayers.find(l => l.id === layerId);
          if(layer){ layer.xPct = xPct; layer.yPct = yPct; }
        });
        el.addEventListener('pointerup', (e) => {
          dragging = false;
          if(trashZone) trashZone.classList.remove('visible', 'armed');
          if(shutterBtn) shutterBtn.style.opacity = '';
          if(isOverTrashZone(e.clientX, e.clientY)){
            textLayers = textLayers.filter(l => l.id !== layerId);
            if(editingLayerId === layerId) editingLayerId = null;
            renderCamTextLayers();
          }
        });
        el.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          const layer = textLayers.find(l => l.id === layerId);
          if(layer) beginTextEditing(layer);
        });
      });
    }
    // mostra as bolinhas de cor embaixo enquanto edita — tocar numa muda a cor
    // do texto na hora, igual Instagram
    function renderColorRow(layer){
      colorRow.innerHTML = STORY_TEXT_COLORS.map(c => `<button type="button" class="story-cam-color-dot${c === layer.color ? ' active' : ''}" data-color="${c}" style="background:${c};" title="Cor do texto"></button>`).join('');
      colorRow.querySelectorAll('.story-cam-color-dot').forEach(dot => {
        dot.addEventListener('click', () => {
          layer.color = dot.dataset.color;
          colorRow.querySelectorAll('.story-cam-color-dot').forEach(d => d.classList.toggle('active', d === dot));
          const el = textLayersWrap.querySelector(`[data-layer-id="${layer.id}"]`);
          if(el){ el.style.color = layer.color; el.focus(); }
        });
      });
    }
    // entra no modo "digitando" — em cima da própria imagem, sem abrir
    // nenhum prompt/bloco do navegador (pedido explícito: "igual do insta")
    function beginTextEditing(existingLayer, xPct, yPct){
      const layer = existingLayer || {
        id: nextLayerId++, text: '',
        xPct: xPct !== undefined ? xPct : 50,
        yPct: yPct !== undefined ? yPct : 50,
        color: STORY_TEXT_COLORS[0]
      };
      if(!existingLayer) textLayers.push(layer);
      editingLayerId = layer.id;
      [closeBtn, textBtn, galleryBtn, shutterBtn, sendBtn].forEach(b => { b.style.display = 'none'; });
      doneBtn.style.display = 'flex';
      colorRow.style.display = 'flex';
      renderColorRow(layer);
      renderCamTextLayers();
      const el = textLayersWrap.querySelector(`[data-layer-id="${layer.id}"]`);
      if(el){
        el.focus();
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }
    // conclui a digitação — some sozinha se ficar vazia, senão salva a
    // posição/cor atual e volta a ficar arrastável. finishingTextEdit evita
    // reentrância: o próprio "el.blur()" aqui dentro dispara o listener de
    // "blur" adicionado em renderCamTextLayers (pra pegar o "OK" do teclado),
    // que chamaria essa função de novo no meio da primeira execução.
    let finishingTextEdit = false;
    function finishTextEditing(){
      if(editingLayerId === null || finishingTextEdit) return;
      const id = editingLayerId;
      const layer = textLayers.find(l => l.id === id);
      const el = textLayersWrap.querySelector(`[data-layer-id="${id}"]`);
      const text = (el ? el.textContent : (layer ? layer.text : '')).trim();
      if(text && containsBlockedContent(text)){
        showToast('Esse conteúdo não é permitido no Aura.', 3500);
        return; // continua editando pra pessoa corrigir o texto
      }
      finishingTextEdit = true;
      // fecha o teclado de propósito ANTES de tirar o elemento da tela — sem
      // isso, em alguns celulares o teclado ficava aberto (ou reaparecia
      // sozinho) depois de trocar pro modo arrastável, e como o texto novo
      // não tinha os listeners de arrastar (só quem não tá editando tem),
      // parecia que "não dava pra arrastar"
      if(el) el.blur();
      if(!text){
        textLayers = textLayers.filter(l => l.id !== id);
      } else if(layer){
        layer.text = text.slice(0, 80);
      }
      editingLayerId = null;
      doneBtn.style.display = 'none';
      colorRow.style.display = 'none';
      closeBtn.style.display = '';
      galleryBtn.style.display = '';
      setMode(mode);
      renderCamTextLayers();
      finishingTextEdit = false;
    }
    // pointerdown (não click) de propósito: com o teclado aberto, tocar num
    // botão fora do campo às vezes faz o navegador processar o blur/fechar-
    // teclado ANTES do click chegar a disparar, e o layout que se mexe
    // enquanto o teclado fecha faz o toque "errar" o botão — pointerdown
    // dispara na hora do toque, antes de qualquer uma dessas mudanças
    doneBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); finishTextEditing(); });
    stage.addEventListener('click', (e) => {
      if(editingLayerId !== null){
        // ignora cliques em botões (ex: o próprio "Aa" que ACABOU de abrir a
        // edição — esse mesmo clique borbulha até aqui, e sem essa checagem
        // ele fechava a edição no mesmo instante que abria, parecendo que o
        // botão "não fazia nada")
        if(e.target.closest('button')) return;
        // clicar fora do texto (no resto da foto) conclui — igual Instagram
        if(e.target.dataset && Number(e.target.dataset.layerId) === editingLayerId) return;
        finishTextEditing();
        return;
      }
      // tocar na própria foto (fora de qualquer botão ou texto já existente)
      // também abre a caixa de texto ali na hora, igual Instagram — não
      // precisa necessariamente tocar no "Aa" primeiro
      if(mode === 'preview' && !e.target.closest('button') && !e.target.closest('.story-edit-text-layer')){
        const box = stage.getBoundingClientRect();
        let xPct = ((e.clientX - box.left) / box.width) * 100;
        let yPct = ((e.clientY - box.top) / box.height) * 100;
        xPct = Math.max(5, Math.min(95, xPct));
        yPct = Math.max(5, Math.min(95, yPct));
        beginTextEditing(null, xPct, yPct);
      }
    });
    textBtn.addEventListener('click', () => beginTextEditing(null));

    sendBtn.addEventListener('click', async () => {
      if(!pickedImg.src){
        showToast('Tire ou escolha uma foto primeiro.');
        return;
      }
      sendBtn.disabled = true;
      let finalImageData;
      try{
        finalImageData = await compositeStoryTextOntoImage(pickedImg.src, textLayers);
      }catch(err){
        sendBtn.disabled = false;
        showToast('Não deu pra preparar a imagem. Tente de novo.', 5000);
        return;
      }
      // a aba escolhida em cima do obturador (Story/Frequência) decide pra
      // onde a foto vai — igual Instagram, a mesma câmera serve pros dois
      const isPost = postMode === 'post';
      // fecha a câmera NA HORA, sem esperar o upload/publicação terminar —
      // antes ficava travado na tela de câmera até o Storage confirmar o
      // upload da imagem (às vezes vários segundos), e teve gente reclamando
      // que parecia que tinha travado. Agora, igual Instagram, a pessoa já
      // volta pro feed/story em seguida e o envio continua rolando sozinho
      // em segundo plano — se der erro, ela fica sabendo depois por um toast.
      closeView();
      showToast(isPost ? 'Publicando frequência...' : 'Publicando story...');
      (async () => {
        try{
          if(isPost){
            await publishPost('', finalImageData);
            showToast('Frequência publicada!');
          } else {
            await publishStory(finalImageData);
            showToast('Story publicado! Fica no ar por 24h.');
          }
          if(view.name === 'home') renderHome();
        }catch(err){
          showToast('Não deu pra publicar (' + ((err && err.message) || 'erro desconhecido') + '). Tente de novo.', 5000);
        }
      })();
    });

    setMode('camera');
    startCamera();
  }
  // "queima" o(s) texto(s) direto na imagem, igual o story do Instagram faz —
  // desenha a foto num canvas de proporção fixa (9:16, mesma do editor) com o
  // mesmo corte que o CSS "object-fit:cover" já mostrava pra pessoa lá, pra a
  // posição em % de cada texto cair EXATAMENTE onde ela arrastou na prévia.
  function compositeStoryTextOntoImage(dataUrl, layers){
    return new Promise((resolve, reject) => {
      if(!layers || layers.length === 0){ resolve(dataUrl); return; }
      const img = new Image();
      img.onload = () => {
        try{
          const canvas = document.createElement('canvas');
          canvas.width = 720;
          canvas.height = 1280;
          const ctx = canvas.getContext('2d');
          const scale = Math.max(canvas.width / img.naturalWidth, canvas.height / img.naturalHeight);
          const drawW = img.naturalWidth * scale;
          const drawH = img.naturalHeight * scale;
          const dx = (canvas.width - drawW) / 2;
          const dy = (canvas.height - drawH) / 2;
          ctx.drawImage(img, dx, dy, drawW, drawH);
          const fontSize = Math.round(canvas.width * 0.06);
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = `800 ${fontSize}px sans-serif`;
          layers.forEach(l => {
            const x = (l.xPct / 100) * canvas.width;
            const y = (l.yPct / 100) * canvas.height;
            ctx.lineWidth = Math.max(2, fontSize * 0.14);
            ctx.strokeStyle = 'rgba(0,0,0,0.55)';
            ctx.strokeText(l.text, x, y);
            ctx.fillStyle = l.color;
            ctx.fillText(l.text, x, y);
          });
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        }catch(err){ reject(err); }
      };
      img.onerror = () => reject(new Error('não deu pra processar a imagem'));
      img.src = dataUrl;
    });
  }
  async function publishStory(imageData, caption){
    const storyData = { authorId: ME_ID, createdAt: Date.now() };
    if(caption) storyData.text = caption;
    try{
      storyData.imageUrl = await withTimeout(window._auraStorage.uploadImage(imageData, 'stories'), 15000);
    }catch(e){
      storyData.image = imageData; // Storage falhou (ex: sem plano Blaze ainda) — cai pro base64, igual os posts
    }
    const newId = await withTimeout(window._auraStories.publish(storyData), 10000);
    storiesCache.unshift({ id: newId, ...storyData });
  }
  // ---------- visualizador de stories em tela cheia ----------
  // nome/foto do grupo, guardados aqui pra o cabeçalho do chat de grupo (tela
  // cheia) já poder mostrar alguma coisa antes do loadGroup() (assíncrono)
  // terminar, e pra não precisar re-renderizar a casca inteira só por isso
  const groupHeaderCache = {};
  let storyViewerState = null; // { groups, groupIndex, storyIndex, timer, paused }
  const STORY_DURATION_MS = 5000;
  const STORY_QUICK_REACTIONS = ['❤️', '😂', '😮', '😢', '👏', '🔥'];
  function openStoryViewer(authorId){
    const groups = groupedStoriesForBar().filter(g => g.stories.length > 0);
    const groupIndex = groups.findIndex(g => g.authorId === authorId);
    if(groupIndex === -1) return;
    storyViewerState = { groups, groupIndex, storyIndex: 0, rafId: null, paused: false };
    renderStoryViewerOverlay();
  }
  function renderStoryViewerOverlay(){
    let overlay = document.getElementById('storyViewerOverlay');
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'storyViewerOverlay';
      overlay.className = 'story-viewer-overlay';
      document.body.appendChild(overlay);
    }
    const st = storyViewerState;
    const group = st.groups[st.groupIndex];
    const story = group.stories[st.storyIndex];
    const author = profiles[group.authorId];
    const isMine = group.authorId === ME_ID;
    const viewerIds = Object.keys(storyViewsCache[story.id] || {});
    const viewCount = viewerIds.length;
    // até 3 fotinhas de quem viu, empilhadas — só pra dar uma prévia rápida,
    // a lista completa continua no modal "Quem viu" (clique aqui abre ela)
    const viewerAvatars = viewerIds.slice(0, 3).map(id => profiles[id]).filter(Boolean);
    const rateStats = storyRatingsCache[story.id] || { avg: null, count: 0, myScore: null };
    overlay.innerHTML = `
      <div class="story-media-wrap">
        <img class="story-viewer-img" src="${story.imageUrl || story.image || ''}" alt="" />
        <div class="story-progress-row">
          ${group.stories.map((s, i) => `<div class="story-progress-seg"><div class="story-progress-fill" id="storyFill${i}" style="width:${i < st.storyIndex ? '100%' : '0%'};"></div></div>`).join('')}
        </div>
        <div class="story-viewer-header">
          <div class="story-viewer-author" data-profile-open="${group.authorId}">
            ${avatarHtml(author || { name: '?' }, 34)}
            <span class="story-viewer-name">${escapeHtml(author ? (author.username || author.name) : '?')}</span>
            <span class="story-viewer-time">· ${timeAgo(story.createdAt)}</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            ${isMine ? `<button class="story-viewer-delete" id="storyDeleteBtn" title="Excluir">${ICON_TRASH}</button>` : ''}
            <button class="story-viewer-close" id="storyCloseBtn">✕</button>
          </div>
        </div>
        ${story.text ? `<div class="story-viewer-caption">${escapeHtml(story.text)}</div>` : ''}
        <div class="story-nav-zone story-nav-left" id="storyNavLeft"></div>
        <div class="story-nav-zone story-nav-right" id="storyNavRight"></div>
      </div>
      ${isMine ? `
      <div class="story-bottom-bar-mine">
        <button class="story-viewers-preview" id="storyViewsBtn">
          <div class="story-viewers-avatars">${viewerAvatars.map(p => avatarHtml(p, 26, false, { color: '#000', width: '1.5px' })).join('')}</div>
          <span class="story-viewers-label">${viewCount} views</span>
        </button>
        <button class="story-share-own-btn" id="storyShareOwnBtn" title="Enviar por mensagem">${ICON_SEND}</button>
      </div>
      ` : `
      <div class="story-reply-row" id="storyReplyRow">
        <div class="story-reply-pill">
          <input type="text" class="story-reply-input" id="storyReplyInput" maxlength="300" placeholder="Mensagem..." />
        </div>
        <div class="story-reaction-wrap">
          <div class="story-reaction-popover" id="storyReactionPopover" style="display:none;">
            ${STORY_QUICK_REACTIONS.map(e => `<button type="button" class="story-reply-quick-btn" data-emoji="${e}">${e}</button>`).join('')}
          </div>
          <button class="story-reply-icon-btn story-reaction-btn" id="storyReactionBtn" title="Reagir">❤️</button>
        </div>
        <button class="story-reply-icon-btn story-reply-send" id="storyReplySendBtn" title="Enviar" disabled>${ICON_SEND}</button>
      </div>
      `}
    `;
    document.getElementById('storyCloseBtn').addEventListener('click', closeStoryViewer);
    document.getElementById('storyNavLeft').addEventListener('click', () => stepStory(-1));
    document.getElementById('storyNavRight').addEventListener('click', () => stepStory(1));
    const viewsBtn = document.getElementById('storyViewsBtn');
    if(viewsBtn) viewsBtn.addEventListener('click', (e) => { e.stopPropagation(); st.paused = true; openStoryViewersModal(story.id, () => { st.paused = false; }); });
    const shareOwnBtn = document.getElementById('storyShareOwnBtn');
    if(shareOwnBtn) shareOwnBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      st.paused = true;
      openShareStoryModal(story.id, story.imageUrl || story.image || '', () => { st.paused = false; });
    });
    const rateBtn = document.getElementById('storyRateBtn');
    if(rateBtn) rateBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      st.paused = true;
      openRateStoryModal(story.id, rateStats.myScore ?? 5, () => {
        st.paused = false;
        // atualiza o botão no lugar em vez de re-renderizar o viewer inteiro
        // de novo — assim dá pra ver o "pulso" de confirmação (um
        // renderStoryViewerOverlay() aqui destruiria o botão na mesma hora,
        // sem tempo da animação aparecer) e também não reinicia à toa o
        // cronômetro de progresso do story, que um re-render completo faria
        const btn = document.getElementById('storyRateBtn');
        const newStats = storyRatingsCache[story.id];
        if(btn && newStats){
          btn.classList.add('active');
          btn.innerHTML = `${ICON_STAR}${newStats.count > 0 ? ` ${newStats.avg.toFixed(1)}` : ''}`;
          pulseFeedback(btn);
        }
      });
    });
    const delBtn = document.getElementById('storyDeleteBtn');
    if(delBtn) delBtn.addEventListener('click', async () => {
      if(!confirm('Excluir esse story?')) return;
      try{
        await withTimeout(window._auraStories.remove(story.id), 10000);
        storiesCache = storiesCache.filter(s => s.id !== story.id);
        showToast('Story excluído.');
        closeStoryViewer();
      }catch(e){ showToast('Não deu pra excluir. Tente de novo.'); }
    });
    const profileLink = overlay.querySelector('[data-profile-open]');
    if(profileLink) profileLink.addEventListener('click', () => { closeStoryViewer(); view = { name: 'profile', id: group.authorId }; render(); });
    const imgEl = overlay.querySelector('.story-viewer-img');
    ['mousedown', 'touchstart'].forEach(evt => imgEl.addEventListener(evt, () => { st.paused = true; }));
    ['mouseup', 'touchend', 'mouseleave'].forEach(evt => imgEl.addEventListener(evt, () => { st.paused = false; }));
    // responder ao story por DM / reagir com emoji — só existe em story de
    // outra pessoa (o dono do story não manda mensagem pra si mesmo)
    const storySnapshotImg = story.imageUrl || story.image || null;
    const replyInput = document.getElementById('storyReplyInput');
    const replySendBtn = document.getElementById('storyReplySendBtn');
    if(replyInput && replySendBtn){
      replyInput.addEventListener('focus', () => { st.paused = true; });
      replyInput.addEventListener('blur', () => { st.paused = false; });
      replyInput.addEventListener('input', () => { replySendBtn.disabled = !replyInput.value.trim(); });
      replyInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); if(!replySendBtn.disabled) replySendBtn.click(); } });
      replySendBtn.addEventListener('click', async () => {
        const text = replyInput.value.trim();
        if(!text) return;
        replySendBtn.disabled = true;
        replyInput.disabled = true;
        try{
          await sendStoryReplyMessage(group.authorId, story.id, storySnapshotImg, text);
          replyInput.value = '';
          showToast('Resposta enviada');
        }catch(e){
          showToast('Não deu pra enviar. Tente de novo.');
        }
        replyInput.disabled = false;
        replySendBtn.disabled = true;
        replyInput.blur();
        st.paused = false;
      });
    }
    // um emoji só (❤️) representa a reação — clicar nele abre um bloquinho
    // com as opções (em vez da fileira de emojis solta de antes); escolher
    // uma delas manda a reação E toca uma animaçãozinha do emoji voando pra
    // cima a partir do botão, igual o efeito de curtir do Instagram
    const reactionWrap = overlay.querySelector('.story-reaction-wrap');
    const reactionBtn = document.getElementById('storyReactionBtn');

        }catch(e){

        }
      });
    });
    // arrastar a foto do story pra baixo fecha o viewer, igual o Instagram —
    // só entra em modo "arrastando" se o gesto for majoritariamente vertical
    // pra baixo (senão deixa passar normal pro toque nas zonas de navegação)
    (function bindStoryDragToClose(){
      const mediaWrap = overlay.querySelector('.story-media-wrap');
      if(!mediaWrap) return;
      const CLOSE_THRESHOLD = 110;
      let startX = 0, startY = 0, active = false, dragging = false;
      mediaWrap.addEventListener('pointerdown', (e) => {
        if(e.pointerType === 'mouse' && e.button !== 0) return;
        startX = e.clientX; startY = e.clientY; active = true; dragging = false;
        try{ mediaWrap.setPointerCapture(e.pointerId); }catch(err){}
      });
      mediaWrap.addEventListener('pointermove', (e) => {
        if(!active) return;
        const dy = e.clientY - startY;
        const dx = e.clientX - startX;
        if(!dragging){
          if(dy > 12 && dy > Math.abs(dx)){
            dragging = true;
            st.paused = true;
            overlay.style.transition = 'none';
          } else if(Math.abs(dx) > 12 || dy < -12){
            active = false; // não é um arrasto pra baixo, ignora (deixa o toque normal acontecer)
          }
          return;
        }
        e.preventDefault();
        const clamped = Math.max(0, dy);
        const scale = Math.max(0.85, 1 - clamped / 1400);
        overlay.style.transform = `translateY(${clamped}px) scale(${scale})`;
        overlay.style.opacity = String(Math.max(0.35, 1 - clamped / 400));
        overlay.style.borderRadius = '18px';
      });
      const finishDrag = (e) => {
        if(!active) return;
        active = false;
        if(!dragging) return;
        dragging = false;
        const dy = Math.max(0, (e.clientY || startY) - startY);
        overlay.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
        if(dy > CLOSE_THRESHOLD){
          overlay.style.transform = 'translateY(100%) scale(0.85)';
          overlay.style.opacity = '0';
          setTimeout(() => closeStoryViewer(), 190);
        } else {
          overlay.style.transform = '';
          overlay.style.opacity = '';
          overlay.style.borderRadius = '';
          st.paused = false;
        }
      };
      mediaWrap.addEventListener('pointerup', finishDrag);
      mediaWrap.addEventListener('pointercancel', finishDrag);
    })();
    registerStoryView(story.id);
    startStoryProgress();
  }
  // barrinha de progresso do story — antes rodava num setInterval de 50ms
  // (só 20 atualizações por segundo), o que dava aquele efeito "travado",
  // pouco fluido. requestAnimationFrame acompanha a taxa de atualização de
  // verdade da tela (normalmente 60fps, ou mais em telas de 120Hz), então o
  // preenchimento anda bem mais suave — sem mudar em nada a duração de cada
  // story nem o jeito de pausar (segurar a tela) que já existia.
  function startStoryProgress(){
    const st = storyViewerState;
    if(!st) return;
    if(st.rafId) cancelAnimationFrame(st.rafId);
    const fillEl = document.getElementById('storyFill' + st.storyIndex);
    let elapsed = 0;
    let lastTs = null;
    function tick(ts){
      if(storyViewerState !== st) return; // story mudou/fechou nesse meio tempo
      if(lastTs === null) lastTs = ts;
      const delta = ts - lastTs;
      lastTs = ts;
      if(!st.paused){
        elapsed += delta;
        if(fillEl) fillEl.style.width = Math.min(100, (elapsed / STORY_DURATION_MS) * 100) + '%';
        if(elapsed >= STORY_DURATION_MS){ stepStory(1); return; }
      }
      st.rafId = requestAnimationFrame(tick);
    }
    st.rafId = requestAnimationFrame(tick);
  }
  function stepStory(direction){
    const st = storyViewerState;
    if(!st) return;
    if(st.rafId){ cancelAnimationFrame(st.rafId); st.rafId = null; }
    let { groupIndex, storyIndex, groups } = st;
    storyIndex += direction;
    if(storyIndex < 0){
      groupIndex -= 1;
      if(groupIndex < 0) return closeStoryViewer();
      storyIndex = groups[groupIndex].stories.length - 1;
    } else if(storyIndex >= groups[groupIndex].stories.length){
      groupIndex += 1;
      if(groupIndex >= groups.length) return closeStoryViewer();
      storyIndex = 0;
    }
    st.groupIndex = groupIndex;
    st.storyIndex = storyIndex;
    renderStoryViewerOverlay();
  }
  function closeStoryViewer(){
    if(storyViewerState && storyViewerState.rafId) cancelAnimationFrame(storyViewerState.rafId);

  // "quem viu" + "quem avaliou" combinados numa lista só, igual pedido —
  // busca os dois storages direto (mesmo padrão do openRatersModal/
  // openFollowersModal) em vez de depender só do cache, pra sempre vir
  // atualizado na hora que a pessoa clica.
  async function openStoryViewersModal(storyId, onClose){
    const bg = document.createElement('div');
    bg.className = 'modal-bg modal-bg-center modal-bg-over-story';
    bg.innerHTML = `
      <div class="modal" style="max-height:70vh; max-height:70dvh; overflow-y:auto;">

      </div>
    `;
    document.body.appendChild(bg);
    const finish = () => { bg.remove(); if(onClose) onClose(); };
    bg.addEventListener('click', (e) => { if(e.target === bg) finish(); });

    let viewsObj = {}, ratingsObj = {};
    try{
      const [rv, rr] = await Promise.all([
        window.storage.get('storyViews:' + storyId),
        window.storage.get('storyratings:' + storyId)
      ]);
      if(rv && rv.value) viewsObj = JSON.parse(rv.value);
      if(rr && rr.value) ratingsObj = JSON.parse(rr.value);
    }catch(e){}
    const listEl = document.getElementById('storyViewersModalList');
    if(!listEl) return;
    listEl.className = '';
    const allIds = Array.from(new Set([...Object.keys(viewsObj), ...Object.keys(ratingsObj)]));
    const list = allIds.map(id => ({ p: profiles[id], score: ratingsObj[id] !== undefined ? ratingsObj[id] : null })).filter(x => x.p);
    const titleEl = document.getElementById('storyViewersModalTitle');
    if(titleEl){
      titleEl.textContent = list.length === 0 ? 'Ninguém viu ainda'
        : (list.length === 1 ? '1 pessoa viu' : `${list.length} pessoas viram`);
    }
    if(list.length === 0){
      listEl.innerHTML = `<div class="feed-empty">Ninguém viu esse story ainda.</div>`;
      return;
    }
    // quem avaliou aparece primeiro (nota mais alta primeiro), depois quem só viu
    list.sort((a, b) => {
      if(a.score !== null && b.score !== null) return b.score - a.score;
      if(a.score !== null) return -1;
      if(b.score !== null) return 1;
      return 0;
    });
    listEl.innerHTML = list.map(x => `
      <div class="suggest-row">
        <div class="feed-author" data-id="${x.p.id}" style="cursor:pointer;">${avatarHtml(x.p, 40)}</div>
        <div class="suggest-row-info feed-author" data-id="${x.p.id}" style="cursor:pointer;">
          <div class="name">${escapeHtml(x.p.name)}</div>
        </div>
        ${x.score !== null ? `<div class="score-chip" style="color:${scoreColor(x.score)}">${x.score}</div>` : `<div class="story-viewers-just-viewed">${ICON_EYE}</div>`}
      </div>
    `).join('');
    listEl.querySelectorAll('.feed-author').forEach(el => {
      el.addEventListener('click', () => { finish(); view = { name: 'profile', id: el.dataset.id }; render(); });
    });
  }

    const avg = count > 0 ? scores.reduce((a, b) => a + b, 0) / count : null;

  async function rateComment(postId, commentId, score){

    comment.ratings[ME_ID] = score;
    await withTimeout(window.storage.set('postComments:' + postId, JSON.stringify(arr), true), 8000);
    postCommentsCache[postId] = arr;

  async function addPostComment(postId, text, replyToId, imageData){
    if(containsBlockedContent(text)){
      throw new Error('Esse conteúdo não é permitido no Aura.');
    }
    let arr = [];
    try{
      const r = await withTimeout(window.storage.get('postComments:' + postId, true), 8000);
      arr = (r && r.value) ? JSON.parse(r.value) : [];
    }catch(e){ arr = []; }
    const comment = { id: uid(), authorId: ME_ID, text, createdAt: Date.now() };
    let parentComment = null;
    if(replyToId){
      comment.replyTo = replyToId;
      parentComment = arr.find(c => c.id === replyToId) || null;
    }
    if(imageData) comment.image = imageData;
    arr.push(comment);
    if(arr.length > 200) arr = arr.slice(arr.length - 200);
    await withTimeout(window.storage.set('postComments:' + postId, JSON.stringify(arr), true), 8000);
    postCommentsCache[postId] = arr;
    const post = feedCache.find(p => p.id === postId);
    if(post){
      post.commentCount = arr.length; // reflete na hora, sem esperar recarregar
      pushNotification(post.authorId, { type: 'comment_post', postId }); // best-effort
      notifyBoosters(postId, { type: 'comment_post_boosted', postId }, post.authorId); // best-effort
      // quem comentou também merece saber quando respondem o comentário DELE,
      // não só quando o dono do post é avisado
      if(parentComment && parentComment.authorId !== post.authorId){
        pushNotification(parentComment.authorId, { type: 'reply_comment', postId }); // best-effort
      }
      extractMentionedUserIds(text).forEach(mentionedId => {
        if(mentionedId !== post.authorId){
          pushNotification(mentionedId, { type: 'mention_comment', postId }); // best-effort
        }
      });
      try{ await window._auraPosts.incrementCommentCount(postId, 1); }catch(e){ /* best-effort */ }
    }
    return arr;
  }

  // ---------- impulsionar (RT) ----------
  let boostsCache = {}; // postId -> { count, amIBoosting }
  async function loadBoosts(postId){
    let obj = {};
    try{
      const r = await withTimeout(window.storage.get('boosts:' + postId, true), 8000);
      if(r && r.value) obj = JSON.parse(r.value);
    }catch(e){ obj = {}; }
    boostsCache[postId] = { count: Object.keys(obj).length, amIBoosting: !!(ME_ID && obj[ME_ID]) };
    return boostsCache[postId];
  }
  async function loadAllBoosts(){
    // idem: uma leitura pra coleção inteira em vez de uma por post
    let listedValues = {};
    try{
      const r = await withTimeout(window.storage.list('boosts:', true), 10000);
      listedValues = (r && r.values) || {};
    }catch(e){ listedValues = {}; }
    const needsFallback = [];
    feedCache.forEach(post => {
      const raw = listedValues['boosts:' + post.id];
      if(raw === undefined){ needsFallback.push(post.id); return; }
      try{
        const obj = raw ? JSON.parse(raw) : {};
        boostsCache[post.id] = { count: Object.keys(obj).length, amIBoosting: !!(ME_ID && obj[ME_ID]) };
      }catch(e){ needsFallback.push(post.id); }
    });
    if(needsFallback.length > 0) await Promise.all(needsFallback.map(id => loadBoosts(id)));
  }
  let boostedPostsCache = {}; // profileId -> {postId: timestamp em que farmou}
  async function loadBoostedPosts(profileId){
    let obj = {};
    try{
      const r = await withTimeout(window.storage.get('boostedPosts:' + profileId, true), 8000);
      if(r && r.value) obj = JSON.parse(r.value);
    }catch(e){}
    boostedPostsCache[profileId] = obj;
    return obj;
  }
  // avisa todo mundo que já farmou (repostou) essa frequência quando ela recebe
  // uma nova interação — assim quem repostou também fica sabendo que "seu" repost
  // está bombando, e não só o autor original
  async function notifyBoosters(postId, notif, excludeId){
    try{
      const r = await withTimeout(window.storage.get('boosts:' + postId, true), 8000);
      const obj = (r && r.value) ? JSON.parse(r.value) : {};
      Object.keys(obj).forEach(boosterId => {
        if(boosterId !== excludeId) pushNotification(boosterId, notif); // pushNotification já ignora auto-notificação
      });
    }catch(e){ /* best-effort */ }
  }
  async function toggleBoost(postId){
    let obj = {};
    try{
      const r = await withTimeout(window.storage.get('boosts:' + postId, true), 8000);
      if(r && r.value) obj = JSON.parse(r.value);
    }catch(e){ obj = {}; }
    if(obj[ME_ID]) delete obj[ME_ID]; else obj[ME_ID] = true;
    await withTimeout(window.storage.set('boosts:' + postId, JSON.stringify(obj), true), 8000);
    boostsCache[postId] = { count: Object.keys(obj).length, amIBoosting: !!obj[ME_ID] };
    // guarda no índice pessoal quais frequências essa pessoa farmou — pra aparecer no perfil dela também
    try{
      let mine = {};
      const r2 = await window.storage.get('boostedPosts:' + ME_ID, true);
      if(r2 && r2.value) mine = JSON.parse(r2.value);
      if(obj[ME_ID]) mine[postId] = Date.now(); else delete mine[postId];
      await window.storage.set('boostedPosts:' + ME_ID, JSON.stringify(mine), true);
      boostedPostsCache[ME_ID] = mine;
    }catch(e){ /* best-effort */ }
    if(obj[ME_ID]){
      const post = feedCache.find(p => p.id === postId);
      if(post){
        pushNotification(post.authorId, { type: 'boost_post', postId }); // best-effort
        // avisa quem já tinha farmado essa mesma frequência antes de você
        Object.keys(obj).forEach(boosterId => {
          if(boosterId !== ME_ID && boosterId !== post.authorId) pushNotification(boosterId, { type: 'boost_post_boosted', postId });
        });
      }
    }
    return boostsCache[postId];
  }

  // ---------- mensagens diretas (DM) ----------
  // aviso: guardado em storage compartilhado (não é criptografado ponta-a-ponta).
  // a interface só mostra a conversa pra quem participa dela, mas tecnicamente
  // não tem o mesmo nível de privacidade de um app de mensagens de verdade.
  function convId(a, b){ return [a, b].sort().join('__'); }

  async function loadConversationRaw(otherId){
    let raw = { messages: [], lastRead: {} };
    try{
      const r = await withTimeout(window.storage.get('dm:' + convId(ME_ID, otherId), true), 8000);
      if(r && r.value){
        const parsed = JSON.parse(r.value);
        raw = Array.isArray(parsed)
          ? { messages: parsed, lastRead: {} }
          : { messages: parsed.messages || [], lastRead: parsed.lastRead || {} };
      }
    }catch(e){}
    return raw;
  }
  async function saveConversationRaw(otherId, raw){
    await withTimeout(window.storage.set('dm:' + convId(ME_ID, otherId), JSON.stringify(raw), true), 8000);
  }
  function unreadCountInRaw(raw){
    const lastReadTs = raw.lastRead[ME_ID] || 0;
    return raw.messages.filter(m => m.senderId !== ME_ID && m.createdAt > lastReadTs).length;
  }
  async function loadConversation(otherId){
    const raw = await loadConversationRaw(otherId);
    return raw.messages;
  }
  async function sendMessage(otherId, text, image, audio, audioDuration){
    const raw = await loadConversationRaw(otherId);
    const msg = { id: uid(), senderId: ME_ID, text, createdAt: Date.now() };
    if(image) msg.image = image;
    if(audio){ msg.audio = audio; if(audioDuration) msg.audioDuration = audioDuration; }
    raw.messages.push(msg);
    if(raw.messages.length > 300) raw.messages = raw.messages.slice(raw.messages.length - 300);
    raw.lastRead[ME_ID] = msg.createdAt; // quem manda já "leu" até a própria mensagem
    await saveConversationRaw(otherId, raw);
    return raw.messages;
  }
  // "enviar" uma frequência é uma mensagem especial (sem texto, com o id do
  // post) — chatBubbleHtml sabe desenhar isso como uma prévia clicável
  async function sendPostShareMessage(otherId, postId){
    const raw = await loadConversationRaw(otherId);
    const msg = { id: uid(), senderId: ME_ID, text: '', sharedPostId: postId, createdAt: Date.now() };
    raw.messages.push(msg);
    if(raw.messages.length > 300) raw.messages = raw.messages.slice(raw.messages.length - 300);
    raw.lastRead[ME_ID] = msg.createdAt;
    await saveConversationRaw(otherId, raw);
    pushNotification(otherId, { type: 'shared_post', postId }); // best-effort
    incrementSendFreq(otherId); // best-effort — alimenta a lista de "mais enviados"
    return raw.messages;
  }
  // resposta a um story vira DM normal, mas guardando o id do story e uma
  // CÓPIA da imagem dele no momento do envio — não tenta reabrir o story
  // depois, já que ele pode expirar (24h) ou ser apagado antes da pessoa ler
  async function sendStoryReplyMessage(otherId, storyId, storyImage, text){
    const raw = await loadConversationRaw(otherId);
    const msg = { id: uid(), senderId: ME_ID, text, storyReplyId: storyId, storyReplyImage: storyImage || null, createdAt: Date.now() };
    raw.messages.push(msg);
    if(raw.messages.length > 300) raw.messages = raw.messages.slice(raw.messages.length - 300);
    raw.lastRead[ME_ID] = msg.createdAt;
    await saveConversationRaw(otherId, raw);
    pushNotification(otherId, { type: 'story_reply', storyId }); // best-effort
    incrementSendFreq(otherId);
    return raw.messages;
  }
  // reação rápida com emoji num story — mesma estrutura da resposta, só que
  // sem texto e com o emoji marcado em storyReactionEmoji
  async function sendStoryReactionMessage(otherId, storyId, storyImage, emoji){
    const raw = await loadConversationRaw(otherId);
    const msg = { id: uid(), senderId: ME_ID, text: '', storyReplyId: storyId, storyReplyImage: storyImage || null, storyReactionEmoji: emoji, createdAt: Date.now() };
    raw.messages.push(msg);
    if(raw.messages.length > 300) raw.messages = raw.messages.slice(raw.messages.length - 300);
    raw.lastRead[ME_ID] = msg.createdAt;
    await saveConversationRaw(otherId, raw);
    pushNotification(otherId, { type: 'story_reaction', storyId, emoji }); // best-effort
    incrementSendFreq(otherId);
    return raw.messages;
  }
  // reenviar/encaminhar o PRÓPRIO story por mensagem (botão de enviar na
  // barra de baixo do visualizador, quando é o seu story) — guarda uma CÓPIA
  // da imagem no momento do envio, mesma lógica da resposta a story, só que
  // com um campo diferente (storyForwardId) pra não aparecer com o rótulo
  // errado de "respondeu ao story" na bolha do chat.
  async function sendStoryForwardMessage(otherId, storyId, storyImage){
    const raw = await loadConversationRaw(otherId);
    const msg = { id: uid(), senderId: ME_ID, text: '', storyForwardId: storyId, storyForwardImage: storyImage || null, createdAt: Date.now() };
    raw.messages.push(msg);
    if(raw.messages.length > 300) raw.messages = raw.messages.slice(raw.messages.length - 300);
    raw.lastRead[ME_ID] = msg.createdAt;
    await saveConversationRaw(otherId, raw);
    pushNotification(otherId, { type: 'story_forward', storyId }); // best-effort
    incrementSendFreq(otherId);
    return raw.messages;
  }
  // ---------- "mais enviados" (frequência de pra quem a pessoa manda frequências) ----------
  async function getSendFreq(){
    try{
      const r = await window.storage.get('sendfreq:' + ME_ID, true);
      if(r && r.value) return JSON.parse(r.value) || {};
    }catch(e){}
    return {};
  }
  async function incrementSendFreq(recipientId){
    try{
      const freq = await getSendFreq();
      freq[recipientId] = (freq[recipientId] || 0) + 1;
      await window.storage.set('sendfreq:' + ME_ID, JSON.stringify(freq), true);
    }catch(e){ /* best-effort */ }
  }
  // ---------- chat de grupo ----------
  // simplificado perto do DM: um doc só por grupo (sem lastRead por pessoa,
  // já que "não lida por conversa" não é algo que o grupo precise por enquanto)
  async function loadGroupChatRaw(groupId){
    let raw = { messages: [] };
    try{
      const r = await withTimeout(window.storage.get('groupchat:' + groupId, true), 8000);
      if(r && r.value){
        const parsed = JSON.parse(r.value);
        raw = { messages: parsed.messages || [] };
      }
    }catch(e){}
    return raw;
  }
  async function loadGroupChat(groupId){
    const raw = await loadGroupChatRaw(groupId);
    return raw.messages;
  }
  async function sendGroupMessage(groupId, text, image){

    const msg = { id: uid(), authorId: ME_ID, text, createdAt: Date.now() };
    if(image) msg.image = image;
    raw.messages.push(msg);
    if(raw.messages.length > 300) raw.messages = raw.messages.slice(raw.messages.length - 300);
    await withTimeout(window.storage.set('groupchat:' + groupId, JSON.stringify(raw), true), 8000);

  }
  function groupChatBubbleHtml(msg){
    const mine = msg.authorId === ME_ID;
    const author = profiles[msg.authorId];
    const nameHtml = (!mine && author) ? `<div class="group-chat-author-link" data-id="${author.id}" style="cursor:pointer; font-weight:700; font-size:11.5px; color:var(--text-faint); margin:0 0 3px 2px;">${escapeHtml(author.name)}</div>` : '';
    const avatarSmall = (!mine) ? `<div class="group-chat-author-link" data-id="${msg.authorId}" style="cursor:pointer; flex-shrink:0;">${author ? avatarHtml(author, 28) : `<div class="avatar" style="width:28px;height:28px;font-size:11px;">?</div>`}</div>` : '';
    const bubbleInner = msg.image
      ? `<img src="${msg.image}" class="chat-message-image" alt="" loading="lazy" decoding="async" />
        ${msg.text ? `<div class="chat-bubble" style="margin-top:6px;">${escapeHtml(msg.text)}</div>` : ''}`
      : `<div class="chat-bubble">${escapeHtml(msg.text)}</div>`;

  // linha de um destinatário possível no modal de envio — igual em ambas as
  // seções (busca por @ e "mais enviados"), só muda a lista que alimenta
  function shareTargetRowHtml(p){
    return `<div class="suggest-row">
      ${avatarHtml(p, 40)}
      <div class="suggest-row-info"><div class="name">${escapeHtml(p.name)}</div>${p.username ? `<div style="font-size:12px; color:var(--text-faint);">@${escapeHtml(p.username)}</div>` : ''}</div>

    </div>`;
  }
  function bindShareTargetButtons(listEl, postId){
    listEl.querySelectorAll('[data-send-to-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Enviando...';

  // link direto pra uma frequência específica — dá pra abrir esse link fora
  // do Aura (WhatsApp, etc.) que a pessoa cai direto nela; ver o "?post="
  // sendo lido lá no boot()
  function postShareUrl(postId){
    return `${location.origin}${location.pathname}?post=${encodeURIComponent(postId)}`;
  }
  async function shareExternally(postId){
    const url = postShareUrl(postId);
    const post = feedCache.find(p => p.id === postId);
    const author = post && profiles[post.authorId];
    const text = author ? `Dá uma olhada nessa frequência de @${author.username || author.name} no Aura` : 'Dá uma olhada nessa frequência no Aura';
    if(navigator.share){
      try{ await navigator.share({ title: 'Aura', text, url }); }
      catch(e){ /* pessoa cancelou o menu de compartilhar — não é erro */ }
      return;
    }
    try{
      await navigator.clipboard.writeText(url);
      showToast('Link copiado!');
    }catch(e){
      showToast('Não deu pra copiar o link agora.');

        return;
      }
      resultsEl.innerHTML = matches.map(shareTargetRowHtml).join('');
      bindTargets(resultsEl);
    }

    const searchInput = document.getElementById('shareStorySearchInput');
    searchInput.addEventListener('input', () => {
      const q = searchInput.value;
      if(q.trim() === ''){ renderDefaultSuggestions(); }
      else { renderSearchResults(q); }
    });

  }
  async function markConversationRead(otherId){
    const raw = await loadConversationRaw(otherId);
    if(raw.messages.length === 0) return;
    const lastTs = raw.messages[raw.messages.length - 1].createdAt;
    if(raw.lastRead[ME_ID] === lastTs) return; // já estava em dia, não precisa gravar
    raw.lastRead[ME_ID] = lastTs;
    try{ await saveConversationRaw(otherId, raw); }catch(e){ /* best-effort */ }
  }
  // reagir com emoji a uma mensagem (segurar a bolha e escolher) — guardado
  // DENTRO da própria mensagem, em msg.reactions = { userId: emoji }. Tocar
  // de novo no mesmo emoji que você já usou remove a reação (alterna).
  async function reactToMessage(otherId, msgId, emoji){
    const raw = await loadConversationRaw(otherId);
    const msg = raw.messages.find(m => m.id === msgId);
    if(!msg) return raw.messages;
    if(!msg.reactions) msg.reactions = {};
    if(msg.reactions[ME_ID] === emoji) delete msg.reactions[ME_ID];
    else msg.reactions[ME_ID] = emoji;
    await saveConversationRaw(otherId, raw);
    if(msg.senderId !== ME_ID) pushNotification(msg.senderId, { type: 'react_message', emoji }); // best-effort
    return raw.messages;
  }
  // ---------- "digitando..." (indicador de presença de digitação no chat) ----------
  // um documento levinho e separado da conversa em si (some sozinho de tanto
  // ser sobrescrito) — { [userId]: timestamp de quando começou/continuou
  // digitando }. Só é "digitando" de verdade se o timestamp for recente (a
  // pessoa pode ter fechado o app no meio, sem "avisar" que parou).
  const TYPING_FRESH_MS = 6000;
  async function setTypingState(otherId, isTyping){
    try{
      const key = 'typing:' + convId(ME_ID, otherId);
      let obj = {};
      try{
        const r = await window.storage.get(key, true);
        if(r && r.value) obj = JSON.parse(r.value);
      }catch(e){}
      if(isTyping) obj[ME_ID] = Date.now();
      else delete obj[ME_ID];
      await window.storage.set(key, JSON.stringify(obj), true);
    }catch(e){ /* best-effort — nunca trava a digitação por causa disso */ }
  }
  async function isOtherTyping(otherId){
    try{
      const key = 'typing:' + convId(ME_ID, otherId);
      const r = await window.storage.get(key, true);
      if(r && r.value){
        const obj = JSON.parse(r.value);
        const ts = obj[otherId];
        return !!(ts && (Date.now() - ts) < TYPING_FRESH_MS);
      }
    }catch(e){}
    return false;
  }
  async function loadMyConversations(){
    let values = {};
    try{
      const r = await withTimeout(window.storage.list('dm:', true), 8000);
      const allValues = (r && r.values) || {};
      Object.keys(allValues).filter(k => k.includes(ME_ID)).forEach(k => { values[k] = allValues[k]; });
    }catch(e){ values = {}; }
    const results = Object.keys(values).map(k => {
      try{
        if(!values[k]) return null;
        const parsed = JSON.parse(values[k]);
        const raw = Array.isArray(parsed)
          ? { messages: parsed, lastRead: {} }
          : { messages: parsed.messages || [], lastRead: parsed.lastRead || {} };
        if(raw.messages.length === 0) return null;
        const ids = k.replace('dm:', '').split('__');
        const otherId = ids.find(x => x !== ME_ID);
        if(!otherId) return null;
        const last = raw.messages[raw.messages.length - 1];
        return { otherId, last, unread: unreadCountInRaw(raw) };
      }catch(e){ return null; }
    });
    return results.filter(Boolean).sort((a, b) => b.last.createdAt - a.last.createdAt);
  }

  // ---------- notificações (seguidor novo, nota recebida, engajamento) ----------

  // agrupa os tipos de notificação em categorias que a pessoa pode desligar
  // individualmente nas configurações (ex: desliga "farmar aura" mas continua

  function notifCategoryFor(type){
    if(type === 'follow') return 'follows';
    if(type === 'rate_profile' || type === 'rate_post' || type === 'rate_comment' || type === 'rate_post_boosted' || type === 'rate_story' || type === 'aura_milestone' || type === 'first_rating') return 'ratings';
    if(type === 'boost_post' || type === 'boost_post_boosted') return 'boosts';

  async function pushNotification(targetUserId, notif){
    if(!targetUserId || targetUserId === ME_ID) return; // não notifica você mesmo
    // respeita a preferência da PESSOA QUE RECEBE (não de quem manda) — por
    // padrão toda categoria vem ligada, então perfil sem essa configuração
    // ainda definida continua recebendo tudo, igual sempre foi
    const targetProfile = profiles[targetUserId];
    const prefs = targetProfile && targetProfile.notifPrefs;
    if(prefs && prefs[notifCategoryFor(notif.type)] === false) return;
    try{
      let data = { items: [], lastSeenAt: 0 };
      const r = await window.storage.get('notifications:' + targetUserId, true);
      if(r && r.value){
        const parsed = JSON.parse(r.value);
        data = { items: parsed.items || [], lastSeenAt: parsed.lastSeenAt || 0 };
      }
      data.items.unshift({ id: uid(), fromId: ME_ID, createdAt: Date.now(), ...notif });
      if(data.items.length > 100) data.items = data.items.slice(0, 100);
      await window.storage.set('notifications:' + targetUserId, JSON.stringify(data), true);
    }catch(e){ /* best-effort — nunca trava a ação principal por causa disso */ }
  }
  // ACHADO O BUG DAS NOTIFICAÇÕES SUMINDO: antes, se a leitura falhasse (rede
  // instável, timeout de 8s numa conexão ruim etc.) essa função ENGOLIA o
  // erro e devolvia silenciosamente um objeto vazio {items:[]} como se a
  // pessoa realmente não tivesse notificação nenhuma. O problema é que quem
  // chama essa função (markNotificationsRead, ao abrir a tela de notificações)
  // pegava esse "vazio por falha de rede" e GRAVAVA ele de volta no Firestore
  // como se fosse a verdade — apagando de vez o histórico real que existia
  // no servidor, só porque a internet falhou naquele instante. Agora, se a
  // leitura falhar, a função deixa o erro estourar pra quem chamou, em vez
  // de fingir que não tinha nada — assim ninguém grava um "vazio" por cima
  // dos dados reais só por causa de uma falha temporária de conexão.
  async function loadMyNotifications(){
    const r = await withTimeout(window.storage.get('notifications:' + ME_ID, true), 8000);
    let data = { items: [], lastSeenAt: 0 };
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      data = { items: parsed.items || [], lastSeenAt: parsed.lastSeenAt || 0 };
    }
    notificationsCache = data;
    return data;
  }

  async function markNotificationsRead(){

      if(data.lastSeenAt !== maxTs){

      }
    }catch(e){ /* best-effort */ }

  // ---------- image resize ----------
  const MAX_UPLOAD_BYTES = 20 * 1024 * 1024; // 20MB — acima disso, nem tenta processar
  function fileToResizedDataUrl(file){
    if(file.size > MAX_UPLOAD_BYTES){
      return Promise.reject(new Error('arquivo muito grande (máx. 20MB)'));
    }
    return withTimeout(new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const size = 240;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const s = Math.min(img.width, img.height);
          const sx = (img.width - s) / 2, sy = (img.height - s) / 2;
          ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = () => reject(new Error('não consegui abrir essa imagem'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('não consegui ler o arquivo'));
      reader.readAsDataURL(file);
    }), 15000);
  }

  // lê o arquivo direto, sem redimensionar — usado pra GIFs, já que passar
  // por canvas destrói a animação (viraria uma imagem parada)
  function fileToRawDataUrl(file){
    if(file.size > MAX_UPLOAD_BYTES){
      return Promise.reject(new Error('arquivo muito grande (máx. 20MB)'));
    }
    return withTimeout(new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = () => reject(new Error('não consegui ler o arquivo'));
      reader.readAsDataURL(file);
    }), 15000);
  }

  // redimensiona mantendo a proporção (usado nas imagens de frequência, ao contrário
  // do corte quadrado usado nas fotos de perfil)
  function resizeImageDataUrl(file, maxDim, quality){
    if(file.size > MAX_UPLOAD_BYTES){
      return Promise.reject(new Error('arquivo muito grande (máx. 20MB)'));
    }
    return withTimeout(new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality || 0.75));
        };
        img.onerror = () => reject(new Error('não consegui abrir essa imagem'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('não consegui ler o arquivo'));
      reader.readAsDataURL(file);
    }), 15000);
  }

  // ---------- render ----------
  let lastRenderedViewKey = null;
  function render(){
    /* Corrige a página abrindo "no meio"/"no final": antes, ao trocar de página
       (ex: clicar no próprio perfil vindo do feed já rolado pra baixo), o scroll
       da janela continuava na mesma posição de antes, então se a página nova
       fosse mais curta que a rolagem atual, ela já abria lá embaixo. Só reseta
       o scroll quando a página (nome + id) realmente muda — re-renderizações da
       MESMA página (ex: depois de curtir um post, dar aura, mandar mensagem)
       não mexem no scroll, senão o feed/chat ficariam pulando pro topo à toa. */
    // limpa o preto "provisório" que só existia pra cobrir o intervalo antes do
    // JS rodar (ver comentário no HTML, perto do <div id="app">) — a partir
    // daqui quem manda no fundo é sempre a tela real sendo desenhada (a de
    // carregamento já pinta o próprio preto por cima, via .loading-wrap)
    app.style.background = '';
    // sai da tela de conversa = para de checar "digitando"/"visto" daquela
    // conversa (senão o poll ficava rodando pra sempre em segundo plano,
    // até de uma conversa que a pessoa já nem está mais vendo)
    if(view.name !== 'chat' && window._auraChatPollInterval){
      clearInterval(window._auraChatPollInterval);
      window._auraChatPollInterval = null;
    }
    const viewKey = view.name + ':' + (view.id || '');
    if(viewKey !== lastRenderedViewKey){
      window.scrollTo(0, 0);
      if(document.scrollingElement) document.scrollingElement.scrollTop = 0;
      // remove qualquer modal/overlay que tenha ficado aberto de antes de navegar
      // pra essa tela nova — os modais (.modal-bg) são anexados direto no <body>,
      // fora do #app, então eles NÃO somem sozinhos quando o app troca de tela
      // (ex: sessão expira / faz logout com um modal aberto, ou clica em algo
      // dentro de um modal que navega pra outro lugar). Se um modal ficar
      // "esquecido" assim, ele é um bloco fixed cobrindo a tela inteira (mesmo
      // quase transparente) e trava TODOS os cliques da tela de baixo, inclusive
      // as caixas de texto do login — por isso limpa aqui, sempre que a tela
      // realmente muda.
      document.querySelectorAll('.modal-bg').forEach(el => el.remove());
    }
    lastRenderedViewKey = viewKey;
    if(view.name === 'loading') return renderLoading();
    if(view.name === 'error') return renderError();
    if(view.name === 'auth') return renderAuth();
    if(view.name === 'onboard') return renderOnboard();
    if(view.name === 'home') return renderHome();
    if(view.name === 'ranking') return renderRanking();
    if(view.name === 'discover') return renderDiscover();
    if(view.name === 'inbox') return renderInbox();
    if(view.name === 'chat') return renderChat(view.id);
    if(view.name === 'notifications') return renderNotifications();
    if(view.name === 'post') return renderPostDetail(view.id);
    if(view.name === 'settings') return renderSettings();
    if(view.name === 'insights') return renderInsights();
    if(view.name === 'groups') return renderGroups();
    if(view.name === 'group') return renderGroupDetail(view.id);
    if(view.name === 'profile') return renderProfileDetail(view.id);
    if(view.name === 'edit') return renderEdit();
    if(view.name === 'saved') return renderSaved();
  }

            ` : (isProfilePage || hasOwnBackRow) ? `<div></div>` : (isHomePage ? `<button class="top-bar-avatar top-bar-msg arrow-btn-plain top-bar-search-btn" data-nav="discover" title="Pesquisar">${ICON_SEARCH}</button>` : `<button class="top-bar-avatar top-bar-msg arrow-btn-plain" id="topBarBackBtn" title="Voltar">${ICON_ARROW_LEFT}</button>`)}
            ${isProfilePage || isChatPage || isGroupChatPage ? '' : `<button class="top-bar-logo" data-nav="home" title="Início"><img src="${LOGO_WORDMARK}" alt="Aura" /></button>`}
            ${isProfilePage || isChatPage || isGroupChatPage ? '' : `<button class="top-bar-search-mobile" data-nav="notifications" title="Notificações">${ICON_BELL}<span class="nav-badge" id="notifBadgeTopBar" style="${unreadNotifCount > 0 ? '' : 'display:none;'}">${badgeCountText(unreadNotifCount)}</span></button>`}

        </main>
        <aside class="right-col">
          <div class="right-col-title">Sugestões pra seguir</div>
          <div id="suggestList"></div>
        </aside>
      </div>
    `;
    document.querySelectorAll('[data-nav]').forEach(btn => {
      btn.addEventListener('click', () => {
        const nav = btn.dataset.nav;
        if(nav === 'logout'){ window._auraAuth.signOut(); return; }
        if(nav === 'home' && view.name === 'home'){
          // já está no feed — só volta pro topo, sem recarregar a página (não perde o que já tava digitando)
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        if(nav === 'home') view = { name: 'home' };
        else if(nav === 'ranking') view = { name: 'ranking' };
        else if(nav === 'discover') view = { name: 'discover' };
        else if(nav === 'inbox') view = { name: 'inbox' };
        else if(nav === 'settings') view = { name: 'settings' };
        else if(nav === 'groups') view = { name: 'groups' };
        else if(nav === 'notifications') view = { name: 'notifications' };
        else if(nav === 'myprofile') view = { name: 'profile', id: ME_ID };
        render();
      });
    });
    // o "+" agora abre um mini-menu (nova frequência ou novo story) em vez de
    // ir direto pro modal de post — mesmo padrão de dropdown usado no "..."
    // dos posts (post-menu-wrap / post-menu-dropdown / closeAllPostMenus)
    function bindComposeMenu(btnId, dropdownId){
      const btn = document.getElementById(btnId);
      const dropdown = document.getElementById(dropdownId);
      if(!btn || !dropdown) return;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = dropdown.classList.contains('open');
        closeAllPostMenus();
        if(!wasOpen) dropdown.classList.add('open');
      });
      dropdown.querySelectorAll('[data-compose-action]').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          closeAllPostMenus();
          if(item.dataset.composeAction === 'story') openStoryCameraView();
          else openComposeModal();
        });
      });
    }
    bindComposeMenu('mobileComposeNavBtn', 'composeMenuMobile');
    bindComposeMenu('sidebarComposeBtn', 'composeMenuDesktop');
    const topBarBackBtn = document.getElementById('topBarBackBtn');
    if(topBarBackBtn) topBarBackBtn.addEventListener('click', () => { view = topBarBackTarget(view); render(); });
    renderRightColSuggestions();
    return document.getElementById('mainContentInner');
  }

        if(!emailVal){

          return;
        }

    function checkValid(){
      const name = nameInput.value.trim();
      const username = usernameInput.value.trim();
      let ok = name.length > 0 && username.length >= 3;
      if(username.length >= 3 && usernameTaken(username, null)){
        usernameError.textContent = 'Esse nome de usuário já está em uso.';
        ok = false;
      } else {
        usernameError.textContent = '';
      }
      createBtn.disabled = !ok;
    }
    nameInput.addEventListener('input', checkValid);
    usernameInput.addEventListener('input', () => {
      const clean = sanitizeUsername(usernameInput.value);
      if(clean !== usernameInput.value) usernameInput.value = clean;
      checkValid();
    });

    createBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const username = usernameInput.value.trim();

      if(usernameTaken(username, null)){ usernameError.textContent = 'Esse nome de usuário já está em uso.'; return; }

      createBtn.disabled = true;
      createBtn.textContent = 'Criando...';
      const id = ME_ID; // identidade já vem da conta autenticada
      let profileSaved = false;
      try{
        const bio = bioVal;

        view = { name: 'home' };

      }catch(err){
        // se o perfil chegou a ser salvo mas algo depois falhou, desfaz —
        // senão o nome de usuário fica "preso" travando novas tentativas
        if(profileSaved){
          try{ await window.storage.delete('profile:' + id, true); }catch(e){}

        }
        createBtn.disabled = false;
        createBtn.textContent = 'Criar meu perfil';

        showToast('Não deu pra criar o perfil (' + detail + '). Tente de novo.', 5000);
      }
    });
  }
