  async function openRatersModal(profileId){
    const bg = document.createElement('div');
    bg.className = 'modal-bg modal-bg-center';
    bg.innerHTML = `
      <div class="modal" style="max-height:70vh; max-height:70dvh; overflow-y:auto;">
        <h3 id="ratersModalTitle" class="modal-list-title">Quem avaliou</h3>
        <div id="ratersModalList" class="loading" style="padding:16px 0; width:100%; max-width:320px;">carregando...</div>
      </div>
    `;
    document.body.appendChild(bg);
    bg.addEventListener('click', (e) => { if(e.target === bg) bg.remove(); });

    let obj = {};
    try{
      const r = await window.storage.get('ratings:' + profileId, true);
      if(r && r.value) obj = JSON.parse(r.value);
    }catch(e){}
    const listEl = document.getElementById('ratersModalList');
    if(!listEl) return;
    listEl.className = '';
    const list = Object.keys(obj).map(id => ({ p: profiles[id], score: obj[id] })).filter(x => x.p);
    const titleEl = document.getElementById('ratersModalTitle');
    // texto muda dependendo de ser o próprio perfil ("te avaliou") ou o de
    // outra pessoa (usa o nome dela) — antes sempre dizia "você" mesmo
    // quando era a nota de outra pessoa
    const isMe = profileId === ME_ID;
    const subjName = isMe ? null : (profiles[profileId] ? profiles[profileId].name : 'essa pessoa');
    if(titleEl){
      if(list.length === 0){
        titleEl.textContent = isMe ? 'Ninguém te avaliou ainda' : `Ninguém avaliou ${escapeHtml(subjName)} ainda`;
      } else if(list.length === 1){
        titleEl.textContent = isMe ? '1 pessoa te avaliou' : `1 pessoa avaliou ${escapeHtml(subjName)}`;
      } else {
        titleEl.textContent = isMe ? `${list.length} pessoas te avaliaram` : `${list.length} pessoas avaliaram ${escapeHtml(subjName)}`;
      }
    }
    if(list.length === 0){
      listEl.innerHTML = `<div class="feed-empty">Ninguém avaliou ainda.</div>`;
      return;
    }
    list.sort((a, b) => b.score - a.score);
    // quem ligou "avaliar anonimamente" não aparece identificado aqui — nem
    // nome, nem foto, nem clique pro perfil
    listEl.innerHTML = list.map(x => {
      const anon = !!(x.p.rateAnonymously && x.p.id !== ME_ID);
      return `
      <div class="suggest-row">
        ${anon
          ? `<div class="avatar" style="width:40px;height:40px;font-size:13px;">?</div>`
          : `<div class="feed-author" data-id="${x.p.id}" style="cursor:pointer;">${avatarHtml(x.p, 40)}</div>`}
        <div class="suggest-row-info${anon ? '' : ' feed-author'}"${anon ? '' : ` data-id="${x.p.id}" style="cursor:pointer;"`}>
          <div class="name">${anon ? 'Alguém' : escapeHtml(x.p.name)}</div>
        </div>
        <div class="score-chip" style="color:${scoreColor(x.score)}">${x.score}</div>
      </div>
    `;}).join('');
    listEl.querySelectorAll('.feed-author').forEach(el => {
      el.addEventListener('click', () => { bg.remove(); view = { name: 'profile', id: el.dataset.id }; render(); });
    });

  // uma foto só continua igual de sempre (post.imageUrl/post.image); com mais
  // de uma, post.images é uma lista [{url}|{data}, ...] e vira o carrossel —

  function postMediaHtml(post){

  // pilha de cartas de verdade: a foto da frente fica centrada, a(s) de trás
  // ficam visíveis espiando na diagonal (rotacionadas/deslocadas) — arrastar
  // horizontal usa Pointer Events (cobre touch/mouse/caneta com o mesmo
  // código, sem precisar de listener nenhum fora do próprio elemento, então
  // não vaza listener quando o post é re-renderizado). touch-action:pan-y no
  // CSS já deixa o dedo rolar a página verticalmente sem brigar com o gesto.
  function bindCarousels(container){
    container.querySelectorAll('.post-carousel').forEach(carousel => {
      const stack = carousel.querySelector('.post-carousel-stack');
      const cards = Array.from(carousel.querySelectorAll('.post-carousel-card'));
      const dots = Array.from(carousel.querySelectorAll('.post-carousel-dot'));
      const total = cards.length;
      if(!stack || total <= 1) return;
      let front = 0;
      const cardEl = (i) => cards.find(c => parseInt(c.dataset.i, 10) === i);
      function layout(animate){
        cards.forEach(card => {
          const i = parseInt(card.dataset.i, 10);
          const rel = i - front;
          card.style.transition = animate ? 'transform 0.32s cubic-bezier(.2,.8,.2,1), opacity 0.32s ease' : 'none';
          if(rel === 0){
            card.style.zIndex = String(total + 2);
            card.style.transform = 'translate(0,0) rotate(0deg) scale(1)';
            card.style.opacity = '1';
          } else if(rel === 1){
            card.style.zIndex = String(total + 1);
            card.style.transform = 'translate(2.5%,-2%) rotate(2deg) scale(0.97)';
            card.style.opacity = '1';
          } else if(rel === 2){
            card.style.zIndex = String(total);
            card.style.transform = 'translate(4%,-3.5%) rotate(3.5deg) scale(0.95)';
            card.style.opacity = '0.9';
          } else if(rel > 2){
            card.style.zIndex = '1';
            card.style.transform = 'translate(4%,-3.5%) rotate(3.5deg) scale(0.95)';
            card.style.opacity = '0';
          } else {
            // rel < 0 — já passamos por essa foto; fica escondida no centro,
            // pronta pra "voar" de volta se o usuário arrastar pra trás
            card.style.zIndex = '0';
            card.style.transform = 'translate(0,0) rotate(0deg) scale(1)';
            card.style.opacity = '0';
          }
        });
        dots.forEach((d, i) => d.classList.toggle('active', i === front));
      }
      layout(false);

      let dragging = false, dx = 0, startX = 0, startY = 0, axis = null, pid = null;
      stack.addEventListener('pointerdown', (e) => {
        if(e.pointerType === 'mouse' && e.button !== 0) return;
        dragging = true; axis = null; dx = 0;
        startX = e.clientX; startY = e.clientY;
        pid = e.pointerId;
        try{ stack.setPointerCapture(pid); }catch(err){}
      });
      stack.addEventListener('pointermove', (e) => {
        if(!dragging || e.pointerId !== pid) return;
        dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if(axis === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
          axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
        }
        if(axis !== 'x') return;
        const card = cardEl(front);
        if(card){
          card.style.transition = 'none';
          card.style.transform = `translate(${dx}px,0) rotate(${dx / 22}deg)`;
        }
      });
      function endDrag(e){
        if(!dragging || (e && e.pointerId !== undefined && e.pointerId !== pid)) return;
        dragging = false;
        const THRESHOLD = 65;
        if(axis === 'x' && Math.abs(dx) > THRESHOLD){
          const dir = dx < 0 ? 1 : -1; // esquerda avança pra próxima, direita volta pra anterior
          const next = front + dir;
          if(next >= 0 && next < total){
            const leavingCard = cardEl(front);
            if(leavingCard){
              leavingCard.style.transition = 'transform 0.26s ease, opacity 0.26s ease';
              leavingCard.style.transform = `translate(${dir < 0 ? '-130%' : '130%'},0) rotate(${dir < 0 ? -20 : 20}deg)`;
              leavingCard.style.opacity = '0';
            }
            if(dir === -1){
              // voltando: a foto anterior entra "voando" de volta pela
              // direita, espelhando a saída — sem isso ela só reapareceria
              // sem gesto nenhum de entrada, parecendo um corte seco
              const enteringCard = cardEl(next);
              if(enteringCard){
                enteringCard.style.transition = 'none';
                enteringCard.style.zIndex = String(total + 2);
                enteringCard.style.transform = 'translate(130%,0) rotate(18deg)';
                enteringCard.style.opacity = '1';
                void enteringCard.offsetWidth; // força o navegador a registrar essa posição antes de animar
              }
            }
            front = next;
            setTimeout(() => layout(true), dir === -1 ? 16 : 70);
          } else {
            layout(true); // já tá na ponta (primeira/última foto) — volta pro lugar
          }
        } else {
          layout(true);
        }
        axis = null;
      }
      stack.addEventListener('pointerup', endDrag);
      stack.addEventListener('pointercancel', endDrag);
    });
  }

  // ---------- algoritmo do "Para você" ----------
  // Antes disso, o feed "Para você" só olhava pra 3 coisas: engajamento total do
  // post, idade dele, e se você segue o autor (sim/não). Isso funciona, mas não
  // aprende NADA sobre você especificamente — o feed de duas pessoas que seguem
  // as mesmas contas ficava idêntico, e conta nova nunca aparecia pra ninguém
  // (sem engajamento → nunca sobe → nunca ganha engajamento → ciclo sem saída).
  // Os pontos novos abaixo resolvem isso sem reescrever a base que já funcionava:

  // uma "semente" sorteada uma vez por sessão (não a cada render) — dá uma
  // variedade sutil de ordem entre uma abertura do app e outra, sem o feed
  // ficar embaralhando sozinho toda vez que você rola ou dá refresh na tela
  let feedSessionSeed = null;
  function getFeedSessionSeed(){
    if(feedSessionSeed === null) feedSessionSeed = Math.random().toString(36).slice(2);
    return feedSessionSeed;
  }
  function seededJitter(postId){
    const s = postId + getFeedSessionSeed();
    let h = 0;
    for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return 0.9 + (Math.abs(h) % 1000) / 1000 * 0.2; // fica entre 0.9x e 1.1x
  }
  // sinal pessoal: quanto mais você já deu aura ou farmou posts de alguém, mais
  // o algoritmo entende que quer ver mais dessa pessoa — é o que faz o feed
  // ficar "seu" com o tempo em vez de igual pra todo mundo que segue as mesmas contas
  function computeAuthorAffinity(authorId){
    if(authorId === ME_ID) return 0;
    let score = 0;
    feedCache.forEach(p => {
      if(p.authorId !== authorId) return;
      const r = postRatingsCache[p.id];
      if(r && r.myScore !== null && r.myScore !== undefined) score += 1.5;
      const b = boostsCache[p.id];
      if(b && b.amIBoosting) score += 1;
    });
    return score;
  }
  function computeFeedScore(post){
    const stats = postRatingsCache[post.id] || { avg: null, count: 0 };
    const boost = boostsCache[post.id] || { count: 0 };
    const commentCount = post.commentCount || 0;
    const engagement = (stats.count * 2) + (boost.count * 3) + commentCount + (stats.avg && stats.avg >= 7 ? 2 : 0);
    const ageHours = Math.max(0, (Date.now() - post.createdAt) / (1000 * 60 * 60));
    const decay = 1 / Math.pow(ageHours + 2, 1.5);
    const followBonus = (followersCache[post.authorId] && followersCache[post.authorId].amIFollowing) ? 1.3 : 1;
    const affinity = 1 + Math.min(computeAuthorAffinity(post.authorId) * 0.15, 1.2);
    // te marcaram nesse post? isso quase sempre sobe pro topo — é conteúdo
    // que fala diretamente com você, não só "relevante em geral"
    const mentionBoost = extractMentionedUserIds(post.text || '').includes(ME_ID) ? 3 : 1;
    // força extra pra quem ainda tem poucas frequências publicadas — sem isso,
    // ninguém nunca vê o post de uma conta nova, ela nunca recebe aura/comentário,
    // e desiste de usar o app antes de criar qualquer laço aqui
    const authorPostCount = feedCache.filter(p => p.authorId === post.authorId).length;
    const newCreatorBoost = authorPostCount <= 3 ? 1.35 : 1;
    return (1 + engagement) * decay * followBonus * affinity * mentionBoost * newCreatorBoost * seededJitter(post.id);
  }
  // depois de ordenar por relevância, evita que a MESMA pessoa apareça 3x seguidas
  // no feed — mesmo que ela tenha os posts mais "fortes", intercala com o próximo
  // autor diferente disponível. É o que faz o feed parecer variado em vez de virar
  // o mural pessoal de quem posta mais
  function diversifyByAuthor(items){
    const pool = items.slice();
    const result = [];
    let lastAuthor = null, streak = 0;
    while(pool.length){
      let idx = 0;
      if(lastAuthor !== null && streak >= 2){
        const altIdx = pool.findIndex(x => x.post.authorId !== lastAuthor);
        if(altIdx !== -1) idx = altIdx;
      }
      const chosen = pool.splice(idx, 1)[0];
      result.push(chosen);
      if(chosen.post.authorId === lastAuthor) streak++; else { lastAuthor = chosen.post.authorId; streak = 1; }
    }
    return result;
  }
  // Monte de "cartões de aura" pra intercalar no meio do feed — mistura as
  // novidades específicas (quem ganhou avaliação, quem subiu/desceu) com fatos
  // sempre disponíveis (quem lidera o ranking agora, a aura de alguém que você
  // segue, um empurrãozinho pra avaliar quem você ainda não avaliou). Sorteado
  // a cada carregamento do feed — de propósito, pra não repetir sempre a mesma
  // ordem e manter a sensação de "sempre tem algo novo por aqui".
  function buildFeedInsightPool(){
    const pool = [];
    recapUpdates.forEach(u => pool.push({ icon: ICON_STAR, text: u }));

    const top3 = computeGlobalTopRanked(3);
    if(top3.length > 0){
      const leader = top3[0];
      const name = '@' + (leader.p.username || leader.p.name);
      pool.push({ icon: ICON_TROPHY, text: `No topo do ranking global agora: ${name}, com nota ${leader.stats.avg.toFixed(1)}.`, targetId: leader.p.id });
      if(top3.length > 1){
        const pick = top3[1 + Math.floor(Math.random() * (top3.length - 1))];
        const pickName = '@' + (pick.p.username || pick.p.name);
        pool.push({ icon: ICON_TROPHY, text: `${pickName} está no Top ${top3.indexOf(pick) + 1} do ranking global.`, targetId: pick.p.id });
      }
    }

    const followingWithScore = Object.keys(profiles).filter(pid =>
      pid !== ME_ID && followersCache[pid] && followersCache[pid].amIFollowing &&
      ratingsCache[pid] && ratingsCache[pid].avg !== null && ratingsCache[pid].avg !== undefined
    );
    if(followingWithScore.length > 0){
      const pid = followingWithScore[Math.floor(Math.random() * followingWithScore.length)];
      const p = profiles[pid];
      const st = ratingsCache[pid];
      pool.push({ icon: ICON_STAR, text: `A aura de @${p.username || p.name} está em ${st.avg.toFixed(1)}, com ${st.count} avaliaç${st.count === 1 ? 'ão' : 'ões'}.`, targetId: pid });
    }

    const notRatedYet = Object.keys(profiles).filter(pid =>
      pid !== ME_ID && !(ratingsCache[pid] && ratingsCache[pid].myScore !== null && ratingsCache[pid].myScore !== undefined)
    );
    if(notRatedYet.length > 0){
      const pid = notRatedYet[Math.floor(Math.random() * notRatedYet.length)];
      const p = profiles[pid];
      pool.push({ icon: ICON_STAR, text: `Você ainda não deu aura pra @${p.username || p.name}. Que tal medir agora?`, targetId: pid });
    }

    const myStats = ratingsCache[ME_ID];
    if(myStats && myStats.avg !== null && myStats.avg !== undefined){
      pool.push({ icon: ICON_STAR, text: `Sua aura está em ${myStats.avg.toFixed(1)}, com ${myStats.count} avaliaç${myStats.count === 1 ? 'ão' : 'ões'} no total.`, targetId: ME_ID });
    }

    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool;
  }
  // o cartão de "novidade de aura" que aparece intercalado no feed — desenhado
  // pra parecer uma publicação de verdade vinda da própria conta @aura (igual
  // um aviso oficial da rede), com o logo como foto de perfil, em vez de uma
  // caixinha genérica solta no meio do feed
  function auraNoticeCardHtml(insight){
    return `<div class="feed-unit">
      <div class="feed-item aura-notice-item"${insight.targetId ? ` data-profile-open="${insight.targetId}"` : ''} style="cursor:pointer;">
        <div class="aura-notice-avatar"><img src="${LOGO_ICON}" alt="Aura" /></div>
        <div class="content">
          <div class="head">
            <div class="head-left">
              <span class="name">@aura</span>
            </div>
            <span class="aura-notice-badge" title="Aviso da Aura">${ICON_BELL}</span>
          </div>
          <div class="text">${escapeHtml(insight.text)}</div>
        </div>
      </div>
    </div>`;
  }
  function feedListHtml(authorFilterId, sortMode){
    if(authorFilterId){
      if(isBlockedEitherWay(authorFilterId)) return `<div class="feed-empty">Essa pessoa ainda não publicou nenhuma frequência.</div>`;
      const list = feedCache.filter(p => p.authorId === authorFilterId && isGroupMember(p.groupId, ME_ID));
      if(!list || list.length === 0){
        return `<div class="feed-empty">Essa pessoa ainda não publicou nenhuma frequência.</div>`;
      }
      return list.map(p => feedItemHtml(p)).join('');
    }
    // feed geral: mistura os posts públicos de todo mundo + os que EU farmei.
    // Frequências publicadas dentro de um grupo TAMBÉM entram aqui, mas só pra
    // quem também é membro daquele grupo — pra quem não é, elas continuam
    // invisíveis fora da própria página do grupo. Frequências de contas
    // privadas que eu não sigo também ficam de fora.
    const publicPosts = feedCache.filter(p => {
      if(!isGroupMember(p.groupId, ME_ID)) return false;
      if(isBlockedEitherWay(p.authorId)) return false;
      const author = profiles[p.authorId];
      if(author && author.private && author.id !== ME_ID){
        const amIFollowingAuthor = followersCache[author.id]?.amIFollowing;
        if(!amIFollowingAuthor) return false;
      }
      return true;
    });
    const myBoosted = boostedPostsCache[ME_ID] || {};
    const originals = publicPosts.map(p => ({ post: p, ts: p.createdAt, boosted: false }));
    const myReposts = Object.keys(myBoosted)
      .map(postId => feedCache.find(p => p.id === postId))
      .filter(p => p && isGroupMember(p.groupId, ME_ID))
      .map(p => ({ post: p, ts: myBoosted[p.id], boosted: true }));
    let combined = [...originals, ...myReposts];
    if(sortMode === 'recent'){
      combined.sort((a, b) => b.ts - a.ts);
    } else {
      combined.sort((a, b) => computeFeedScore(b.post) - computeFeedScore(a.post));
      combined = diversifyByAuthor(combined); // só no "Para você" — "Recentes" fica cronológico puro
    }
    if(combined.length === 0){
      // se o feed ainda nem carregou de verdade uma vez (internet lenta, por
      // exemplo), não afirma que "não existe nenhuma frequência" — isso pode
      // estar errado, é só a resposta que ainda não chegou
      if(!feedLoadedOnce){
        return `<div class="feed-empty loading">carregando frequências...</div>`;
      }
      return `<div class="feed-empty">Ainda não tem nenhuma frequência publicada. Seja o primeiro.</div>`;
    }
    const meName = profiles[ME_ID]?.name || 'Você';
    // os cartões de aura só aparecem no "Para você" (sortMode !== 'recent') —
    // o "Recentes" fica cronológico puro, sem interrupções, pra quem prefere
    // ver só as frequências mesmo
    const insightPool = (sortMode !== 'recent') ? buildFeedInsightPool() : [];
    const parts = [];
    // um aviso a cada 8 frequências (antes era a cada 5 — tava aparecendo
    // demais) e nunca repete o mesmo aviso dentro do mesmo carregamento do
    // feed: para de inserir assim que o "estoque" de avisos daquela vez acaba,
    // em vez de dar a volta e repetir os mesmos de novo
    combined.forEach((item, i) => {
      parts.push(feedItemHtml(item.post, item.boosted ? meName : null));
      if(insightPool.length > 0 && (i + 1) % 8 === 0){
        const insightIndex = Math.floor((i + 1) / 8) - 1;
        if(insightIndex < insightPool.length){
          parts.push(auraNoticeCardHtml(insightPool[insightIndex]));
        }
      }
    });
    return parts.join('');
  }
  // combina o que a pessoa publicou + o que ela farmou (igual timeline com retweets).
  // Frequências publicadas dentro de um grupo só entram aqui pra quem visita o
  // perfil E também é membro daquele grupo — os demais visitantes nem ficam
  // sabendo que aquela frequência existe.
  function profilePostsOnlyHtml(profileId){
    const boostedMap = boostedPostsCache[profileId] || {};
    const authored = feedCache.filter(p => p.authorId === profileId && isGroupMember(p.groupId, ME_ID)).map(p => ({ post: p, ts: p.createdAt, boosted: false }));
    const boosted = Object.keys(boostedMap)
      .map(postId => feedCache.find(p => p.id === postId))
      .filter(p => p && p.authorId !== profileId && isGroupMember(p.groupId, ME_ID))
      .map(p => ({ post: p, ts: boostedMap[p.id], boosted: true }));
    let combined = [...authored, ...boosted].sort((a, b) => b.ts - a.ts);
    if(combined.length === 0) return `<div class="feed-empty">Nenhuma frequência publicada ainda.</div>`;
    const profileName = profiles[profileId]?.name || 'Alguém';
    // a frequência fixada (só uma por vez) sempre aparece primeiro, com o selinho
    const pinnedPostId = profiles[profileId] && profiles[profileId].pinnedPostId;
    let pinnedHtml = '';
    if(pinnedPostId){
      const idx = combined.findIndex(item => !item.boosted && item.post.id === pinnedPostId);
      if(idx !== -1){
        const [pinnedItem] = combined.splice(idx, 1);
        pinnedHtml = feedItemHtml(pinnedItem.post, null, false, true);
      }
    }
    return pinnedHtml + combined.map(item => feedItemHtml(item.post, item.boosted ? profileName : null)).join('');
  }
  function profileBoostedOnlyHtml(profileId){
    const boostedMap = boostedPostsCache[profileId] || {};
    const profileName = profiles[profileId]?.name || 'Alguém';
    const list = Object.keys(boostedMap)
      .map(postId => feedCache.find(p => p.id === postId))
      .filter(p => p && p.authorId !== profileId && isGroupMember(p.groupId, ME_ID))
      .sort((a, b) => boostedMap[b.id] - boostedMap[a.id]);
    if(list.length === 0) return `<div class="feed-empty">Nenhuma frequência farmada ainda.</div>`;
    return list.map(p => feedItemHtml(p, profileName)).join('');
  }
  // grade de mídias do perfil (só frequências COM imagem) — inspirada na grade
  // de fotos que toda rede social tem, mas com identidade própria do Aura:
  // cantos arredondados (não quadrados retos) e um selinho com a nota de aura
  // daquela frequência em cima da miniatura, em vez de ficar em branco.
  function profileMediaHtml(profileId){
    const list = feedCache.filter(p => p.authorId === profileId && (p.imageUrl || p.image) && isGroupMember(p.groupId, ME_ID)).sort((a, b) => b.createdAt - a.createdAt);
    // enquanto as frequências dessa pessoa ainda não terminaram de carregar (ver
    // ensureAuthorPostsLoaded), mostra um esqueleto em vez do estado "sem mídia" —
    // sem essa distinção, a tela piscava "nenhuma mídia publicada" por um instante
    // e DEPOIS as fotos apareciam, o que parecia mais lento/quebrado do que
    // realmente era (a foto já tava vindo, só a mensagem errada aparecia primeiro)
    if(list.length === 0 && !authorPostsLoadedFor.has(profileId)){
      return `<div class="media-grid">${'<div class="media-grid-item media-grid-skeleton"></div>'.repeat(6)}</div>`;
    }
    if(list.length === 0) return `<div class="feed-empty">Nenhuma mídia publicada ainda.</div>`;
    return `<div class="media-grid">${list.map(p => {
      const stats = postRatingsCache[p.id] || { avg: null, count: 0, points: 0 };
      return `<div class="media-grid-item" data-post-open="${p.id}">
        <img src="${p.imageUrl || p.image}" alt="" loading="lazy" decoding="async" />
        ${stats.count > 0 ? `<div class="media-grid-score" style="color:#F2C464;">${formatAuraCount(stats.points)} pts</div>` : ''}
      </div>`;
    }).join('')}</div>`;
  }
  function renderProfileTabContent(profileId, tab){
    if(tab === 'boosted') return profileBoostedOnlyHtml(profileId);
    if(tab === 'media') return profileMediaHtml(profileId);
    return profilePostsOnlyHtml(profileId);
  }
  function commentRowHtml(c, allComments){

  // fecha qualquer menu de "..." aberto num post — chamado antes de abrir outro,
  // ao escolher uma opção, e num clique em qualquer lugar fora do menu
  function closeAllPostMenus(){
    document.querySelectorAll('.post-menu-dropdown.open').forEach(d => d.classList.remove('open'));
  }
  // clique fora do "..." só fecha a caixinha — não pode "vazar" e também
  // acionar o que tem embaixo (abrir o post, ir pro perfil etc). Por isso
  // roda na fase de CAPTURA (antes de qualquer outro clique do próprio
  // elemento) e barra o evento de continuar quando tem menu aberto.
  document.addEventListener('click', (e) => {
    const hasOpenMenu = document.querySelector('.post-menu-dropdown.open');
    if(!hasOpenMenu) return;
    if(e.target.closest('.post-menu-wrap')) return; // clique no botão "..." ou dentro do menu — deixa seguir normal
    e.stopPropagation();
    e.preventDefault();
    closeAllPostMenus();
  }, true);
  // clique num avatar com anel de story (feed, comentários, cabeçalho do
  // perfil — ver avatarWithStoryRingHtml) abre o story em vez de ir pro
  // perfil, igual Instagram: o nome/usuário do lado continua indo pro
  // perfil normalmente. Um listener global só, na fase de CAPTURA, pra não
  // precisar religar isso em cada lugar que desenha um avatar — e pra
  // "vencer" o clique de ir-pro-perfil que já existe em cima do avatar
  // (ex: o .feed-author que envolve o avatar do post).
  document.addEventListener('click', (e) => {
    const ring = e.target.closest('[data-story-avatar]');
    if(!ring) return;
    const authorId = ring.dataset.storyAvatar;
    if(!authorId) return;
    e.stopPropagation();
    e.preventDefault();
    openStoryViewer(authorId);
  }, true);
  // estrela que estoura na posição tocada/clicada — usada no duplo toque
  // pra avaliar a foto do post, igual o coração do Instagram
  function showRatingBurst(x, y){
    const burst = document.createElement('div');
    burst.className = 'rating-burst';
    // left/top posicionam o ponto de origem; a animação (via keyframes) que
    // cuida do translate(-50%,-50%) + scale — por isso NÃO dá pra setar
    // isso aqui como transform inline (a animação sobrescreveria de qualquer
    // jeito enquanto estiver rodando)
    burst.style.left = x + 'px';
    burst.style.top = y + 'px';
    burst.innerHTML = ICON_STAR;
    document.body.appendChild(burst);
    burst.addEventListener('animationend', () => burst.remove());
    // salva-guarda caso o navegador não dispare animationend por algum motivo
    setTimeout(() => burst.remove(), 1200);
  }
  // duplo toque na FOTO do post avalia rápido com nota alta (igual duplo
  // toque = curtir no Instagram) e mostra a estrela estourando. Se a pessoa
  // já tinha avaliado, só mostra a animação de novo (não sobrescreve pra
  // baixo uma nota que já era alta) — toque único na foto não faz nada
  // (igual Instagram: só a foto de perfil/@ abre o perfil, e o resto da
  // frequência abre os detalhes do post).
  const DOUBLE_TAP_RATE_SCORE = 10;
  const DOUBLE_TAP_WINDOW_MS = 320;
  function bindDoubleTapToRate(container){
    container.querySelectorAll('.post-image').forEach(imgEl => {
      imgEl.addEventListener('click', (e) => {
        e.stopPropagation();
        const feedItem = imgEl.closest('[data-post-open]');
        const postId = feedItem ? feedItem.dataset.postOpen : null;
        const now = Date.now();
        const last = imgEl._lastTapAt || 0;
        imgEl._lastTapAt = now;
        if(now - last < DOUBLE_TAP_WINDOW_MS){
          // segundo toque — avalia (ou só reforça a animação, se já avaliado)
          imgEl._lastTapAt = 0;
          showRatingBurst(e.clientX, e.clientY);
          const stats = postId ? (postRatingsCache[postId] || { myScore: null }) : { myScore: null };
          if(postId && (stats.myScore === null || stats.myScore === undefined)){
            submitPostRating(postId, DOUBLE_TAP_RATE_SCORE).then(() => {
              const scoreChip = feedItem.querySelector('.score-chip');
              const rateBtn = feedItem.querySelector('[data-post-id="' + postId + '"]');
              const newStats = postRatingsCache[postId];
              if(scoreChip && newStats){
                scoreChip.textContent = newStats.avg === null ? '—' : newStats.avg.toFixed(1);
                scoreChip.style.color = scoreColor(newStats.avg);
              }
              if(rateBtn && newStats){
                rateBtn.classList.add('active');
                rateBtn.dataset.postScore = newStats.myScore;
                const span = rateBtn.querySelector('span');
                if(span) span.textContent = newStats.count > 0 ? newStats.count : '';
                pulseFeedback(rateBtn);
              }
            }).catch(() => { showToast('Não deu pra avaliar agora. Tente de novo.'); });
          }
        }
        // toque único na foto não faz nada — igual Instagram, só a batida
        // dupla avalia. Pra abrir a frequência é só tocar em qualquer outra
        // parte dela (texto, ícones, foto de perfil/@ de quem postou etc.)
      });
    });
  }

    container.querySelectorAll('[data-pin-id]').forEach(el => {

    container.querySelectorAll('[data-views-post]').forEach(el => {

  // "pontos de aura" — o primeiro passo do sistema de aura cumulativa: em vez
  // de uma média (que pode cair quando alguém te dá uma nota mais baixa), isso
  // é a SOMA de todas as notas que a pessoa já recebeu (ex: notas 5, 5 e 10 =
  // 20 pontos). Como cada pessoa só pode te avaliar 1 vez (reavaliação
  // atualiza a nota dela dentro da mesma soma, não soma de novo do zero), esse
  // total tende a só crescer conforme mais gente avalia. Isolado numa função
  // própria pra já deixar claro que esse é o número que deve crescer com o
  // tempo, caso a gente expanda depois pra somar pontos de outras ações também.
  function getAuraPoints(profileId){
    const stats = ratingsCache[profileId] || { sum: 0 };
    return stats.sum || 0;
  }
  // formata a contagem de aura pro jeito compacto pedido: número cru até
  // 9.999 (com "." separando milhar, ex: "1.000"), e a partir de 10 mil passa
  // pro formato "X.Y mil" (ex: 10100 -> "10.1 mil"), e na casa dos milhões
  // pro "X.Y mi" do mesmo jeito.
  function formatAuraCount(n){
    n = Math.max(0, Math.round(n || 0));
    if(n < 10000) return n.toLocaleString('pt-BR');
    if(n < 1000000) return (n / 1000).toFixed(1) + ' mil';
    return (n / 1000000).toFixed(1) + ' mi';
  }
  // marcos de pontos de aura que disparam uma notificação especial pra quem
  // foi avaliado — de 1000 em 1000 no começo (pra dar aquele gostinho rápido),
  // e depois os saltos vão aumentando, senão quem já tem muita aura acumulada
  // ia ficar recebendo notificação toda hora
  const AURA_POINT_MILESTONES = [1000, 2000, 3000, 4000, 5000, 7000, 10000, 15000, 20000, 30000, 45000, 65000, 100000, 150000, 220000, 320000, 470000, 700000, 1000000, 1500000, 2200000];
  // compara os pontos/avaliações de ANTES e DEPOIS de uma avaliação nova pra
  // ver se algum marco foi cruzado, e notifica quem foi avaliado (não quem
  // avaliou) — best-effort, nunca trava o envio da avaliação em si
  async function notifyAuraMilestones(profileId, prevSum, newSum, prevCount, newCount){
    try{
      if(prevCount === 0 && newCount >= 1){
        await pushNotification(profileId, { type: 'first_rating' });
      }
      const crossed = AURA_POINT_MILESTONES.filter(m => prevSum < m && newSum >= m);
      for(const milestone of crossed){
        await pushNotification(profileId, { type: 'aura_milestone', milestone });
      }
    }catch(e){ /* best-effort */ }
  }
  // widget do medidor + pontos de aura — usado no topo do feed, no perfil e no
  // Top Auras, sempre com a mesma linguagem visual (gauge + número em destaque).
  // opts.hideAura respeita a configuração "esconder nota de aura de quem não
  // te segue" — sem isso, o widget vazaria a nota/pontos escondidos em outro lugar.
  function auraPointsWidgetHtml(profileId, opts){
    opts = opts || {};
    const rawStats = ratingsCache[profileId] || { avg: null, count: 0 };
    const hidden = !!opts.hideAura;
    const displayAvg = hidden ? null : rawStats.avg;
    const points = hidden ? null : getAuraPoints(profileId);
    const avaliacoesWord = `avaliaç${rawStats.count === 1 ? 'ão' : 'ões'}`;
    const levelText = hidden ? '— de aura' : `<span class="feed-insights-points-num">${formatAuraCount(points)}</span> pts de aura`;
    const subText = hidden ? 'Nota de aura privada' : `${rawStats.count} ${avaliacoesWord}`;
    return `<div class="feed-insights-summary${opts.clickable ? '' : ' feed-insights-summary-static'}${opts.flat ? ' feed-insights-summary-flat' : ''}"${opts.id ? ` id="${opts.id}"` : ''}>
      <div class="feed-insights-summary-left">
        ${scoreGaugeHtml(displayAvg, opts.size || 50)}
        <div>
          <div class="feed-insights-summary-level">${levelText}</div>
          <div class="feed-insights-summary-sub">${subText}</div>
        </div>
      </div>
      ${(opts.clickable && !opts.hideArrow) ? `<div class="feed-insights-summary-arrow">›</div>` : ''}
    </div>`;
  }
  // resumo compacto de insights do próprio perfil — mostrado no topo do feed,
  // no lugar da caixa de escrever (publicar agora é só pelo "+" da barra de
  // cima), com os pontos de aura (número que só sobe) em cima e a quantidade
  // de avaliações embaixo.
  function feedInsightsSummaryHtml(){
    return auraPointsWidgetHtml(ME_ID, { clickable: true, id: 'feedInsightsSummary' });
  }

  // ---------- grupos ----------
  let myGroupsCache = null;
  async function createGroup(name, description){
    const groupId = uid();
    const groupData = {
      name, description: description || '',
      ownerId: ME_ID,
      memberIds: [ME_ID],
      createdAt: Date.now()
    };
    await withTimeout(window.storage.set('groups:' + groupId, JSON.stringify(groupData), true), 8000);
    myGroupsCache = null; // força recarregar na próxima vez
    return groupId;
  }
  let allGroupsCache = null;
  async function loadAllGroupsRaw(){
    let list = [];
    try{
      const r = await withTimeout(window.storage.list('groups:', true), 8000);
      const values = (r && r.values) || {};
      const results = Object.keys(values).map(k => {
        try{
          if(!values[k]) return null;
          const data = JSON.parse(values[k]);
          return { id: k.replace('groups:', ''), ...data };
        }catch(e){ return null; }
      });
      list = results.filter(g => g && g.memberIds);
    }catch(e){}
    return list;
  }
  // usadas pra decidir se uma frequência publicada dentro de um grupo pode
  // aparecer pra alguém fora da página do próprio grupo (feed geral, perfil de
  // quem postou) — só quem também é membro do grupo enxerga essas frequências
  // ali, os outros nem sabem que ela existe fora do grupo.
  function isGroupMember(groupId, userId){
    if(!groupId) return true; // não é post de grupo, não tem restrição nenhuma
    const group = (allGroupsCache || []).find(g => g.id === groupId);
    if(!group) return false; // ainda não carregou os grupos, ou grupo não existe mais
    return (group.memberIds || []).includes(userId);
  }
  function groupNameFor(groupId){
    const group = (allGroupsCache || []).find(g => g.id === groupId);
    return group ? group.name : 'um grupo';
  }
  async function loadMyGroups(){
    const all = await loadAllGroupsRaw();
    allGroupsCache = all;
    const list = all.filter(g => g.memberIds.includes(ME_ID));
    myGroupsCache = list;
    return list;
  }
  async function loadAllGroups(){
    const all = await loadAllGroupsRaw();
    allGroupsCache = all;
    return all;
  }
  async function loadGroup(groupId){
    try{
      const r = await withTimeout(window.storage.get('groups:' + groupId, true), 8000);
      if(r && r.value) return { id: groupId, ...JSON.parse(r.value) };
    }catch(e){}
    return null;
  }
  async function addGroupMember(groupId, userId){
    const group = await loadGroup(groupId);
    if(!group) throw new Error('grupo não encontrado');
    if(!group.memberIds.includes(userId)) group.memberIds.push(userId);
    const { id, ...data } = group;
    await withTimeout(window.storage.set('groups:' + groupId, JSON.stringify(data), true), 8000);
    return group;
  }
  async function updateGroupPhoto(groupId, photoData){
    const group = await loadGroup(groupId);
    if(!group) throw new Error('grupo não encontrado');
    group.photo = photoData;
    const { id, ...data } = group;
    await withTimeout(window.storage.set('groups:' + groupId, JSON.stringify(data), true), 8000);
    return group;
  }
  // sair do grupo — tira a própria pessoa de memberIds. Se ela era a dona e
  // ainda sobra gente no grupo, passa a "dono" pra o próximo membro da lista
  // (senão o grupo ficaria "órfão", sem ninguém com permissão de dono).
  async function leaveGroup(groupId){
    const group = await loadGroup(groupId);
    if(!group) throw new Error('grupo não encontrado');
    const remaining = (group.memberIds || []).filter(id => id !== ME_ID);
    group.memberIds = remaining;
    if(group.ownerId === ME_ID && remaining.length > 0){
      group.ownerId = remaining[0];
    }
    const { id, ...data } = group;
    await withTimeout(window.storage.set('groups:' + groupId, JSON.stringify(data), true), 8000);
    return group;
  }

  // parte de baixo do Top Auras (a lista em si) isolada numa função pura —
  // além de deixar renderRanking mais enxuta, isso permite montar uma prévia
  // real da aba "Global"/"Seguindo" durante o arrasto pro lado, em vez de só
  // um ícone genérico (o conteúdo já vem pronto igualzinho ao que vai aparecer
  // de verdade quando o arrasto for confirmado).
  function rankingListInnerHtml(rankingTab){
    if(rankingTab === 'following' && !(ME_ID in followingIdsCache)){
      loadFollowingIds(ME_ID).then(() => {
        if(view.name === 'ranking') renderRanking();
      }).catch(() => {});
    }

    // exige um mínimo de avaliações pra entrar no ranking — é isso que impede
    // uma nota 10 com poucas avaliações de aparecer acima de alguém com bem mais
    // avaliações e nota um pouco menor (ex: 3 avaliações nota 10 vs 9 avaliações
    // nota 8.2 — com esse mínimo em 5, o primeiro nem entra no ranking ainda).
    const MIN_RATINGS_FOR_RANKING = 5;
    let allRated = Object.values(profiles)
      .map(p => ({ p, stats: ratingsCache[p.id] || { avg: null, count: 0 } }))
      .filter(x => x.stats.count > 0 && x.stats.avg !== null);

    if(rankingTab === 'following'){
      const myFollowing = followingIdsCache[ME_ID] || {};
      allRated = allRated.filter(x => myFollowing[x.p.id]);
    }

    const rated = allRated.filter(x => x.stats.count >= MIN_RATINGS_FOR_RANKING);

    // ranking ordenado por pontos de aura acumulados (total, não média) —
    // quem tem mais pontos de aura no total aparece primeiro.
    const ranked = rated
      .map(x => ({ ...x, points: getAuraPoints(x.p.id) }))
      .sort((a, b) => b.points - a.points)
      .slice(0, 10);

    if(ranked.length === 0){
      return `<div class="empty"><h3>Ranking ainda vazio</h3><p>${rankingTab === 'following' ? 'Ninguém que você segue entrou no ranking ainda.' : (allRated.length === 0 ? 'Assim que alguém receber uma nota de aura, o ranking aparece aqui.' : `É preciso pelo menos ${MIN_RATINGS_FOR_RANKING} avaliações pra entrar no ranking — ainda ninguém chegou lá.`)}</p></div>`;
    }
    return `<div class="rank-panel"><div class="rank-list">${ranked.map((x, i) => rankRowHtml(x.p, x.stats, i)).join('')}</div></div>`;
  }
  function bindRankingListEvents(container){

  function notificationRowHtml(n, oldLastSeenAt){
    const from = profiles[n.fromId];
    const name = from ? from.name : 'Alguém';

    // específica — usa o logo da própria @aura no lugar do avatar de quem
    // avaliou, senão pareceria que aquela pessoa é quem está "avisando"
    const isAuraMilestoneNotif = n.type === 'aura_milestone' || n.type === 'first_rating';
    const avatarSmall = isAuraMilestoneNotif
      ? `<div class="aura-notice-avatar" style="width:44px;height:44px;"><img src="${LOGO_ICON}" alt="Aura" /></div>`
      : (from ? avatarHtml(from, 44) : `<div class="avatar" style="width:44px;height:44px;font-size:13px;">?</div>`);
    let text = '', icon = ICON_BELL;
    const isPostEngagement = (n.type === 'rate_post' || n.type === 'boost_post' || n.type === 'comment_post' || n.type === 'mention_post' || n.type === 'mention_comment' || n.type === 'reply_comment' || n.type === 'rate_comment' || n.type === 'rate_post_boosted' || n.type === 'comment_post_boosted' || n.type === 'boost_post_boosted' || n.type === 'shared_post') && n.postId;
    if(n.type === 'follow'){ icon = ICON_USERS; text = `<strong>${escapeHtml(name)}</strong> começou a seguir você`; }
    else if(n.type === 'shared_post'){ icon = ICON_SEND; text = `<strong>${escapeHtml(name)}</strong> te enviou uma frequência`; }
    else if(n.type === 'first_rating'){ icon = ICON_STAR; text = `Você recebeu sua primeira avaliação de aura!`; }
    else if(n.type === 'aura_milestone'){ icon = ICON_TROPHY; text = `Você chegou a <strong>${formatAuraCount(n.milestone)} de aura</strong>!`; }
    else if(n.type === 'rate_profile'){ icon = ICON_STAR; text = `<strong>${escapeHtml(name)}</strong> mediu sua aura: ${n.score}/10`; }
    else if(n.type === 'rate_post'){ icon = ICON_STAR; text = `<strong>${escapeHtml(name)}</strong> deu ${n.score}/10 numa sua frequência`; }
    else if(n.type === 'rate_story'){ icon = ICON_STAR; text = `<strong>${escapeHtml(name)}</strong> deu ${n.score}/10 no seu story`; }
    else if(n.type === 'boost_post'){ icon = ICON_REPEAT; text = `<strong>${escapeHtml(name)}</strong> farmou a aura da sua frequência`; }
    else if(n.type === 'comment_post'){ icon = ICON_COMMENT; text = `<strong>${escapeHtml(name)}</strong> comentou na sua frequência`; }
    else if(n.type === 'mention_post'){ icon = ICON_COMMENT; text = `<strong>${escapeHtml(name)}</strong> marcou você numa frequência`; }
    else if(n.type === 'mention_comment'){ icon = ICON_COMMENT; text = `<strong>${escapeHtml(name)}</strong> marcou você num comentário`; }
    else if(n.type === 'reply_comment'){ icon = ICON_COMMENT; text = `<strong>${escapeHtml(name)}</strong> respondeu seu comentário`; }
    else if(n.type === 'rate_comment'){ icon = ICON_STAR; text = `<strong>${escapeHtml(name)}</strong> deu ${n.score}/10 no seu comentário`; }
    else if(n.type === 'rate_post_boosted'){ icon = ICON_STAR; text = `<strong>${escapeHtml(name)}</strong> deu ${n.score}/10 numa frequência que você farmou`; }
    else if(n.type === 'comment_post_boosted'){ icon = ICON_COMMENT; text = `<strong>${escapeHtml(name)}</strong> comentou numa frequência que você farmou`; }
    else if(n.type === 'boost_post_boosted'){ icon = ICON_REPEAT; text = `<strong>${escapeHtml(name)}</strong> também farmou a aura de uma frequência que você farmou`; }
    else if(n.type === 'story_reply'){ icon = ICON_MESSAGE; text = `<strong>${escapeHtml(name)}</strong> respondeu seu story`; }
    else if(n.type === 'story_reaction'){ icon = ICON_HEART; text = `<strong>${escapeHtml(name)}</strong> reagiu ao seu story${n.emoji ? ` com ${n.emoji}` : ''}`; }
    else if(n.type === 'story_forward'){ icon = ICON_SEND; text = `<strong>${escapeHtml(name)}</strong> te enviou um story`; }
    else if(n.type === 'react_message'){ icon = ICON_HEART; text = `<strong>${escapeHtml(name)}</strong> reagiu à sua mensagem${n.emoji ? ` com ${n.emoji}` : ''}`; }
    // resposta/reação a story, story encaminhado, e reação a mensagem, abrem
    // a conversa com quem mandou (é onde a mensagem realmente está), não o perfil
    const isChatNotif = n.type === 'story_reply' || n.type === 'story_reaction' || n.type === 'story_forward' || n.type === 'react_message';
    // antes, uma notificação nova mostrava a palavra "agora" no lugar do
    // horário (em vez da hora de verdade) — e como isso dependia só de
    // "ainda não vista", da PRIMEIRA vez que a tela de notificações abria (o
    // que já marca como vista), na próxima abertura a MESMA notificação
    // mostrava um tempo bem maior, parecendo que o horário "mudou sozinho".
    // Agora o horário mostrado é sempre o de verdade (timeAgo); quem não foi
    // vista ainda só ganha uma bolinha roxa do lado, igual Instagram/Twitter.
    const isUnread = oldLastSeenAt != null && n.createdAt > oldLastSeenAt;
    return `<div class="notif-row ${isUnread ? 'unread' : ''}" data-id="${n.fromId}" ${isPostEngagement ? `data-post-id="${n.postId}"` : ''} ${isChatNotif ? `data-chat-id="${n.fromId}"` : ''}>

  // agrupa as notificações por período, igual o Instagram (Hoje / Ontem /
  // Últimos 30 dias / mais antigas que isso), em vez de uma lista corrida só —
  // fica bem mais fácil de escanear rapidamente o que é recente
  function groupNotifsByPeriod(items){
    const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
    const todayTs = startOfToday.getTime();
    const yesterdayTs = todayTs - 24 * 60 * 60 * 1000;
    const days30Ts = todayTs - 30 * 24 * 60 * 60 * 1000;
    const groups = [
      { label: 'Hoje', items: [] },
      { label: 'Ontem', items: [] },
      { label: 'Últimos 30 dias', items: [] },
      { label: 'Mais antigas', items: [] },
    ];
    items.forEach(n => {
      if(n.createdAt >= todayTs) groups[0].items.push(n);
      else if(n.createdAt >= yesterdayTs) groups[1].items.push(n);
      else if(n.createdAt >= days30Ts) groups[2].items.push(n);
      else groups[3].items.push(n);
    });
    return groups.filter(g => g.items.length > 0);
  }

  function formatAudioDuration(totalSeconds){
    const s = Math.max(0, Math.round(totalSeconds || 0));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  // tocador de áudio das mensagens de voz, feito na mão (ver o "if(msg.audio)"
  // dentro de chatBubbleHtml): um <audio> escondido controlado por um botão
  // de play/pause + barrinha de progresso + tempo, pra bolha ficar só na cor
  // certa (sem o fundo clarinho e o menu de "..." que o player nativo do
  // navegador cola por dentro, e que não tem como tirar só no CSS).
  // currentlyPlayingAudioEl garante que só toca um áudio de cada vez — tocar
  // um novo pausa automaticamente o que já estava tocando.
  let currentlyPlayingAudioEl = null;
  function initAudioPlayers(container){
    container.querySelectorAll('.chat-audio-bubble').forEach(bubble => {
      if(bubble.dataset.audioBound) return;
      bubble.dataset.audioBound = '1';
      const audioEl = bubble.querySelector('audio');
      const playBtn = bubble.querySelector('.chat-audio-play-btn');
      const trackFill = bubble.querySelector('.chat-audio-track-fill');
      const timeEl = bubble.querySelector('.chat-audio-time');
      const track = bubble.querySelector('.chat-audio-track');
      if(!audioEl || !playBtn) return;
      audioEl.addEventListener('loadedmetadata', () => {
        if(isFinite(audioEl.duration) && audioEl.duration > 0 && audioEl.paused) timeEl.textContent = formatAudioDuration(audioEl.duration);
      });
      // a barrinha NÃO anda mais só no evento "timeupdate" — o navegador só
      // dispara ele umas 4 vezes por segundo, o que dava aquele efeito
      // "travado"/pouco fluido. Enquanto o áudio tá tocando, um loop de
      // requestAnimationFrame acompanha currentTime a cada quadro (~60fps),
      // então o preenchimento anda liso de verdade.
      let audioRafId = null;
      function updateAudioProgress(){
        if(isFinite(audioEl.duration) && audioEl.duration > 0){
          trackFill.style.width = ((audioEl.currentTime / audioEl.duration) * 100) + '%';
          timeEl.textContent = formatAudioDuration(audioEl.currentTime);
        }
        if(!audioEl.paused && !audioEl.ended) audioRafId = requestAnimationFrame(updateAudioProgress);
      }
      audioEl.addEventListener('timeupdate', () => {
        if(audioEl.paused) updateAudioProgress(); // barrinha some se pausar/soltar o dedo na track
      });
      audioEl.addEventListener('ended', () => {
        if(audioRafId) cancelAnimationFrame(audioRafId);
        trackFill.style.width = '0%';
        timeEl.textContent = isFinite(audioEl.duration) ? formatAudioDuration(audioEl.duration) : '0:00';
      });
      audioEl.addEventListener('play', () => {
        playBtn.innerHTML = ICON_AUDIO_PAUSE;
        if(audioRafId) cancelAnimationFrame(audioRafId);
        audioRafId = requestAnimationFrame(updateAudioProgress);
      });
      audioEl.addEventListener('pause', () => {
        playBtn.innerHTML = ICON_AUDIO_PLAY;
        if(audioRafId){ cancelAnimationFrame(audioRafId); audioRafId = null; }
      });
      playBtn.addEventListener('click', () => {
        if(audioEl.paused){
          if(currentlyPlayingAudioEl && currentlyPlayingAudioEl !== audioEl) currentlyPlayingAudioEl.pause();
          audioEl.play().catch(() => {});
          currentlyPlayingAudioEl = audioEl;
        } else {
          audioEl.pause();
        }
      });
      if(track){
        track.addEventListener('click', (e) => {
          if(!isFinite(audioEl.duration) || audioEl.duration <= 0) return;
          const rect = track.getBoundingClientRect();
          const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
          audioEl.currentTime = ratio * audioEl.duration;
        });
      }
    });
  }
  // chips de reação embaixo da bolha (segurar a mensagem pra reagir — ver
  // openMessageReactionPicker/bindMessageLongPress). Cada pessoa só pode ter
  // UMA reação por mensagem (no máximo 2 chips numa DM, um por pessoa).
  function reactionsRowHtml(msg){
    if(!msg.reactions) return '';
    const emojis = Object.values(msg.reactions).filter(Boolean);
    if(emojis.length === 0) return '';
    return `<div class="chat-msg-reactions">${emojis.map(e => `<span class="chat-msg-reaction-chip">${escapeHtml(e)}</span>`).join('')}</div>`;
  }
  function chatBubbleHtml(msg, other){

    if(msg.storyReplyId){

        // o emoji escolhido flutuando sobreposto no canto inferior esquerdo

    if(msg.audio){
      // tocador próprio (ver ICON_AUDIO_PLAY/PAUSE lá em cima) — sem isso, o
      // player nativo do navegador colava um fundo clarinho + um menu de
      // "..." por dentro da bolha, que não tem como tirar só com CSS
      const durLabel = msg.audioDuration ? formatAudioDuration(msg.audioDuration) : '0:00';
      return `<div class="chat-row ${mine ? 'mine' : ''}" data-msg-id="${msg.id}" style="align-items:flex-end; gap:8px;">
        ${avatarSmall}
        <div class="chat-msg-col">
          <div class="chat-audio-bubble" data-audio-src="${msg.audio}">
            <audio preload="metadata" src="${msg.audio}" style="display:none;"></audio>
            <button class="chat-audio-play-btn" type="button" title="Tocar áudio">${ICON_AUDIO_PLAY}</button>
            <div class="chat-audio-track"><div class="chat-audio-track-fill"></div></div>
            <span class="chat-audio-time">${durLabel}</span>
          </div>
          ${msg.text ? `<div class="chat-bubble" style="margin-top:6px;">${escapeHtml(msg.text)}</div>` : ''}
          ${reactionsHtml}
        </div>
      </div>`;
    }
    if(msg.image){
      // igual iMessage: a foto vai sem balão (só a imagem com cantos
      // arredondados), e se tiver legenda, ela vira um balão normal
      // (com a cor de quem mandou) logo embaixo — dois elementos empilhados,
      // não uma coisa só colada na imagem.
      return `<div class="chat-row ${mine ? 'mine' : ''}" data-msg-id="${msg.id}" style="align-items:flex-end; gap:8px;">
        ${avatarSmall}
        <div class="chat-msg-col">
          <img src="${msg.image}" class="chat-message-image" alt="" loading="lazy" decoding="async" />
          ${msg.text ? `<div class="chat-bubble" style="margin-top:6px;">${escapeHtml(msg.text)}</div>` : ''}
          ${reactionsHtml}
        </div>
      </div>`;
    }
    return `<div class="chat-row ${mine ? 'mine' : ''}" data-msg-id="${msg.id}" style="align-items:flex-end; gap:8px;">
      ${avatarSmall}
      <div class="chat-msg-col"><div class="chat-bubble">${escapeHtml(msg.text)}</div>${reactionsHtml}</div>
    </div>`;
  }
  // segurar (mobile) ou clicar e segurar (mouse) numa mensagem por ~450ms
  // abre o seletor de reação rápida — mesma lista de emojis dos stories
  function bindMessageLongPress(container, otherId, msgs, onReacted){
    container.querySelectorAll('.chat-row[data-msg-id]').forEach(row => {
      let pressTimer = null;
      let longPressed = false;
      const start = () => {
        longPressed = false;
        pressTimer = setTimeout(() => {
          longPressed = true;
          const msg = msgs.find(m => m.id === row.dataset.msgId);
          if(msg) openMessageReactionPicker(otherId, msg, onReacted);
        }, 450);
      };
      const cancel = () => { if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
      row.addEventListener('touchstart', start, { passive: true });
      row.addEventListener('touchend', cancel);
      row.addEventListener('touchmove', cancel);
      row.addEventListener('mousedown', start);
      row.addEventListener('mouseup', cancel);
      row.addEventListener('mouseleave', cancel);
      // evita que o toque que ABRIU o seletor também clique em algo por baixo
      // (ex: data-open-shared-post) logo depois de soltar
      row.addEventListener('click', (e) => { if(longPressed){ e.stopPropagation(); longPressed = false; } }, true);
    });
  }
  function openMessageReactionPicker(otherId, msg, onDone){

    bg.className = 'modal-bg modal-bg-center';
    const myReaction = msg.reactions && msg.reactions[ME_ID];
    bg.innerHTML = `
      <div class="modal modal-narrow" style="text-align:center;">
        <div class="msg-reaction-picker-row">
          ${STORY_QUICK_REACTIONS.map(e => `<button type="button" class="msg-reaction-picker-btn ${myReaction === e ? 'active' : ''}" data-emoji="${e}">${e}</button>`).join('')}
        </div>
        ${myReaction ? `<button class="rate-modal-remove-btn" id="removeMsgReactionBtn">Remover reação</button>` : ''}
      </div>
    `;
    document.body.appendChild(bg);
    const finish = () => bg.remove();
    bg.addEventListener('click', (e) => { if(e.target === bg) finish(); });
    bg.querySelectorAll('.msg-reaction-picker-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        try{
          await reactToMessage(otherId, msg.id, btn.dataset.emoji);
          finish();
          if(onDone) onDone();
        }catch(e){ showToast('Não deu pra reagir. Tente de novo.'); }

    const removeBtn = bg.querySelector('#removeMsgReactionBtn');
    if(removeBtn) removeBtn.addEventListener('click', async () => {
      try{
        await reactToMessage(otherId, msg.id, myReaction); // mesmo emoji de novo = alterna e remove
        finish();
        if(onDone) onDone();
      }catch(e){ showToast('Não deu pra remover. Tente de novo.'); }
    });
  }

  function renderChat(otherId){
    const other = profiles[otherId];
    if(!other){ view = { name: 'inbox' }; return renderInbox(); }
    const content = renderShellAndGetContent();
    content.innerHTML = `
      <div class="chat-screen">
        <div id="chatMessages" class="chat-messages loading">carregando conversa...</div>
        <div class="chat-typing-indicator" id="chatTypingIndicator" style="display:none;"><span></span><span></span><span></span></div>
        <div id="chatImagePreview" class="chat-compose-image-preview" style="flex-shrink:0;">
          <img id="chatImagePreviewImg" alt="" />
          <button class="chat-compose-image-remove" id="chatImageRemove" title="Remover imagem">✕</button>
        </div>
        <div class="chat-compose" style="flex-shrink:0;" id="chatComposeRow">
          <button class="icon-btn chat-compose-plus" id="chatImageBtn" title="Adicionar foto">${ICON_PLUS}</button>
          <input type="file" id="chatImageInput" accept="image/*" style="display:none;" />
          <input type="text" id="chatInput" class="chat-input" maxlength="500" placeholder="Escreva uma mensagem..." />
          <button class="icon-btn" id="chatMicBtn" title="Gravar áudio">${ICON_MIC}</button>
          <button class="icon-btn" id="chatSendBtn" title="Enviar" style="display:none;">${ICON_ARROW_RIGHT}</button>
        </div>
        <div class="chat-recording-row" id="chatRecordingRow" style="display:none; flex-shrink:0;">
          <button class="icon-btn chat-recording-cancel" id="chatRecordingCancelBtn" title="Cancelar">${ICON_TRASH}</button>
          <div class="chat-recording-indicator"><span class="chat-recording-dot"></span><span id="chatRecordingTime">0:00</span></div>
          <button class="icon-btn chat-recording-send" id="chatRecordingSendBtn" title="Enviar áudio">${ICON_ARROW_RIGHT}</button>
        </div>
      </div>
    `;

    const chatHeaderProfileLink = document.getElementById('chatHeaderProfileLink');
    if(chatHeaderProfileLink) chatHeaderProfileLink.addEventListener('click', () => { view = { name: 'profile', id: otherId }; render(); });

    function scrollToBottom(){
      const el = document.getElementById('chatMessages');
      if(el) el.scrollTop = el.scrollHeight;
    }
    function bindSharedPostClicks(container){
      container.querySelectorAll('[data-open-shared-post]').forEach(el => {
        el.addEventListener('click', () => { view = { name: 'post', id: el.dataset.openSharedPost }; render(); });
      });
    }
    let currentMsgs = [];
    function paintMessages(msgs, scroll){
      currentMsgs = msgs;
      const msgsEl = document.getElementById('chatMessages');
      if(!msgsEl) return;
      msgsEl.classList.remove('loading');
      // o aviso de "não criptografado" agora rola JUNTO com as mensagens (fica
      // lá em cima, no início da conversa) em vez de ficar fixo ocupando
      // espaço o tempo todo — some da vista assim que rola pra baixo, igual
      // um aviso normal de início de conversa
      const noticeHtml = `<div class="dm-notice">As mensagens aqui não são criptografadas — trate como um bilhete entre amigos, não como algo super sigiloso.</div>`;
      msgsEl.innerHTML = noticeHtml + (msgs.length === 0
        ? `<div class="feed-empty">Nenhuma mensagem ainda. Diga oi.</div>`
        : msgs.map(m => chatBubbleHtml(m, other)).join(''));
      bindSharedPostClicks(msgsEl);
      bindMessageLongPress(msgsEl, otherId, currentMsgs, () => reloadMessages(true));
      initAudioPlayers(msgsEl);
      if(scroll){
        scrollToBottom();
        // fotos, áudios com capa e frequências/stories compartilhados dentro das
        // mensagens ainda não carregaram nesse instante — eles aumentam a altura
        // da conversa DEPOIS do scroll acima já ter rodado, e sem reajustar de
        // novo quando terminam de carregar, a conversa abria "subida" (mostrando
        // mensagens antigas) em vez de já cair certinho nas mais recentes.
        // IMPORTANTE: corrige só UMA vez, depois que TODAS as imagens
        // pendentes terminarem (carregando ou não) — reajustar o scroll uma
        // vez pra cada imagem, separadamente, é o que fazia a tela "piscar"/
        // pular de lugar várias vezes rapidinho ao abrir a conversa.
        const pendingImgs = Array.from(msgsEl.querySelectorAll('img')).filter(img => !img.complete);
        if(pendingImgs.length > 0){
          let remaining = pendingImgs.length;
          let done = false;
          const onSettle = () => {
            remaining--;
            if(remaining <= 0 && !done){
              done = true;
              scrollToBottom();
            }
          };
          pendingImgs.forEach(img => {
            img.addEventListener('load', onSettle, { once: true });
            img.addEventListener('error', onSettle, { once: true });
          });
        }
      }
    }
    function reloadMessages(scroll){
      return loadConversation(otherId).then(msgs => {
        if(!(view.name === 'chat' && view.id === otherId)) return;
        paintMessages(msgs, scroll);
      }).catch(() => {});
    }

    loadConversation(otherId).then(msgs => {
      if(!(view.name === 'chat' && view.id === otherId)) return;
      paintMessages(msgs, true);
      // marca como lida e atualiza o selo de notificação do menu
      markConversationRead(otherId).then(() => refreshUnreadBadge()).catch(() => {});
    }).catch(() => {
      const msgsEl = document.getElementById('chatMessages');
      if(msgsEl){ msgsEl.classList.remove('loading'); msgsEl.innerHTML = `<div class="feed-empty">Não deu pra carregar a conversa.</div>`; }
    });

    // "digitando..." + "visto" — poll levinho enquanto essa conversa está
    // aberta (a app não tem realtime/onSnapshot, então segue o mesmo padrão
    // do resto do app: checa de tempos em tempos). Some sozinho ao sair da
    // tela — ver a limpeza desse mesmo intervalo lá no render() principal.
    if(window._auraChatPollInterval) clearInterval(window._auraChatPollInterval);
    async function pollChatStatus(){
      if(!(view.name === 'chat' && view.id === otherId)) return;
      try{
        const typing = await isOtherTyping(otherId);
        const typingEl = document.getElementById('chatTypingIndicator');
        if(typingEl){
          const wasVisible = typingEl.style.display !== 'none';
          typingEl.style.display = typing ? 'flex' : 'none';
          if(typing && !wasVisible) scrollToBottom();
        }
      }catch(e){}
      try{
        const raw = await loadConversationRaw(otherId);
        const mine = raw.messages.filter(m => m.senderId === ME_ID);
        const lastMine = mine[mine.length - 1];
        const msgsEl = document.getElementById('chatMessages');
        let seenLabel = document.getElementById('chatSeenLabel');
        if(lastMine && raw.lastRead && raw.lastRead[otherId] >= lastMine.createdAt){
          if(!seenLabel && msgsEl){
            seenLabel = document.createElement('div');
            seenLabel.id = 'chatSeenLabel';
            seenLabel.className = 'chat-seen-label';
            seenLabel.textContent = 'Visto';
            msgsEl.appendChild(seenLabel);
          }
        } else if(seenLabel){
          seenLabel.remove();
        }
      }catch(e){}
    }
    pollChatStatus();
    window._auraChatPollInterval = setInterval(pollChatStatus, 3000);

    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('chatSendBtn');
    const chatImageBtn = document.getElementById('chatImageBtn');
    const chatImageInput = document.getElementById('chatImageInput');
    const chatImagePreview = document.getElementById('chatImagePreview');
    const chatImagePreviewImg = document.getElementById('chatImagePreviewImg');
    const chatImageRemove = document.getElementById('chatImageRemove');
    let chatImageData = null;

    chatImageBtn.addEventListener('click', () => chatImageInput.click());
    chatImageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      try{
        if(file.type === 'image/gif'){
          if(file.size > 700 * 1024){
            showToast('Esse GIF é grande demais (máx. ~700KB). Escolha um menor.', 3500);
            chatImageInput.value = '';
            return;
          }
          chatImageData = await fileToRawDataUrl(file);
        } else {
          const attempts = [[700, 0.65], [550, 0.5], [400, 0.35]];
          let result = null;
          for(const [dim, q] of attempts){
            result = await resizeImageDataUrl(file, dim, q);
            if(result.length < 350000) break;
          }
          chatImageData = result;
        }
        chatImagePreviewImg.src = chatImageData;
        chatImagePreview.style.display = 'block';
        syncSendToggle();
      }catch(err){
        showToast('Não deu pra carregar essa imagem. Tente outra.');
      }
    });
    chatImageRemove.addEventListener('click', () => {
      chatImageData = null;
      chatImageInput.value = '';
      chatImagePreview.style.display = 'none';
      syncSendToggle();
    });

    // microfone vira setinha de enviar assim que tem texto (ou foto anexada)
    // — igual Instagram/WhatsApp — em vez dos dois aparecerem juntos o tempo
    // todo. bindComposeSendToggle está definido lá em cima, perto do chat de
    // grupo, que usa o mesmo padrão.
    const syncSendToggle = bindComposeSendToggle(input, document.getElementById('chatMicBtn'), sendBtn, () => !!chatImageData);

    // avisa a outra pessoa que eu tô digitando — some sozinho se eu parar de
    // teclar por alguns segundos (ver setTypingState/isOtherTyping), sem
    // precisar de um "parei de digitar" explícito
    let typingStopTimer = null;
    input.addEventListener('input', () => {
      syncSendToggle();
      setTypingState(otherId, true);
      if(typingStopTimer) clearTimeout(typingStopTimer);
      typingStopTimer = setTimeout(() => setTypingState(otherId, false), 3500);
    });

    async function doSend(){
      const text = input.value.trim();
      if(!text && !chatImageData) return;
      input.disabled = true;
      sendBtn.disabled = true;
      if(typingStopTimer){ clearTimeout(typingStopTimer); typingStopTimer = null; }
      setTypingState(otherId, false);
      try{
        const msgs = await sendMessage(otherId, text, chatImageData);
        input.value = '';
        chatImageData = null;
        chatImageInput.value = '';
        chatImagePreview.style.display = 'none';
        syncSendToggle();
        paintMessages(msgs, true);
      }catch(err){
        showToast('Não deu pra enviar. Tente de novo.');
      }
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
    sendBtn.addEventListener('click', doSend);
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') doSend(); });

    // ---------- gravação de áudio ----------
    const micBtn = document.getElementById('chatMicBtn');
    const composeRow = document.getElementById('chatComposeRow');
    const recordingRow = document.getElementById('chatRecordingRow');
    const recordingTimeEl = document.getElementById('chatRecordingTime');
    const recordingCancelBtn = document.getElementById('chatRecordingCancelBtn');
    const recordingSendBtn = document.getElementById('chatRecordingSendBtn');
    const MAX_RECORDING_MS = 120000; // 2 minutos — segura o tamanho do áudio
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordingStream = null;
    let recordingStartedAt = 0;
    let recordingTimerInt = null;
    let recordingCancelled = false;

    function stopRecordingTracks(){
      if(recordingStream){ recordingStream.getTracks().forEach(t => t.stop()); recordingStream = null; }
      if(recordingTimerInt){ clearInterval(recordingTimerInt); recordingTimerInt = null; }
    }
    function exitRecordingUI(){
      composeRow.style.display = 'flex';
      recordingRow.style.display = 'none';
      micBtn.classList.remove('recording');
    }
    async function startRecording(){
      if(!navigator.mediaDevices || !window.MediaRecorder){
        showToast('Seu navegador não suporta gravar áudio.');
        return;
      }
      try{
        recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }catch(e){
        showToast('Não deu pra acessar o microfone. Verifique a permissão.');
        return;
      }
      recordedChunks = [];
      recordingCancelled = false;
      try{
        mediaRecorder = new MediaRecorder(recordingStream);
      }catch(e){
        showToast('Não deu pra gravar áudio nesse aparelho.');
        stopRecordingTracks();
        return;
      }
      mediaRecorder.addEventListener('dataavailable', (e) => { if(e.data && e.data.size > 0) recordedChunks.push(e.data); });
      mediaRecorder.addEventListener('stop', async () => {
        stopRecordingTracks();
        exitRecordingUI();
        if(recordingCancelled || recordedChunks.length === 0) return;
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        const durationSec = Math.round((Date.now() - recordingStartedAt) / 1000);
        if(durationSec < 1){ showToast('Áudio muito curto.'); return; }
        try{
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
          let audioUrl = dataUrl;
          try{ audioUrl = await withTimeout(window._auraStorage.uploadImage(dataUrl, 'audio'), 15000); }
          catch(e){ /* Storage falhou — manda o base64 direto mesmo, igual as fotos fazem */ }
          const msgs = await sendMessage(otherId, '', null, audioUrl, durationSec);
          paintMessages(msgs, true);
        }catch(e){
          showToast('Não deu pra enviar o áudio. Tente de novo.');
        }
      });
      mediaRecorder.start();
      recordingStartedAt = Date.now();
      composeRow.style.display = 'none';
      recordingRow.style.display = 'flex';
      micBtn.classList.add('recording');
      recordingTimeEl.textContent = '0:00';
      recordingTimerInt = setInterval(() => {
        const elapsed = Date.now() - recordingStartedAt;
        const s = Math.floor(elapsed / 1000);
        recordingTimeEl.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
        if(elapsed >= MAX_RECORDING_MS && mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
      }, 250);
    }
    function finishRecording(cancel){
      recordingCancelled = !!cancel;
      if(mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
      else exitRecordingUI();
    }
    micBtn.addEventListener('click', startRecording);
    recordingCancelBtn.addEventListener('click', () => finishRecording(true));
    recordingSendBtn.addEventListener('click', () => finishRecording(false));
  }

  function renderDiscover(){
    const me = profiles[ME_ID];
    if(!me){ view = { name: 'onboard' }; return renderOnboard(); }
    const othersAll = Object.values(profiles).filter(p => p.id !== ME_ID);
    const searchVal = view.search || '';
    const isSearching = searchVal.trim().length > 0;

    let listToShow;
    if(isSearching){
      listToShow = othersAll.filter(p => normalize(p.name).includes(normalize(searchVal)));
    } else {
      // prioriza quem você ainda não segue e ainda não avaliou, limitado a 10 contas —
      // mas entre pessoas com a mesma prioridade, a ordem embaralha um pouco a cada
      // sessão (seededJitter, mesmo truque já usado no feed "Para você"); antes disso
      // o empate sempre desempatava pela ordem "crua" da lista de perfis, que não muda
      // sozinha, então a mesma pessoa ficava sempre em primeiro por semanas a fio
      listToShow = othersAll.map(p => {
        const followed = followersCache[p.id]?.amIFollowing;
        const rated = ratingsCache[p.id] && ratingsCache[p.id].myScore !== null;
        return { p, weight: (followed ? 1 : 0) + (rated ? 1 : 0), jitter: seededJitter(p.id) };
      }).sort((a, b) => (a.weight - b.weight) || (a.jitter - b.jitter)).map(x => x.p).slice(0, 10);
    }

    // frequências com mais avaliações (só na aba padrão, sem busca ativa)
    const topPosts = !isSearching
      ? feedCache
          .map(p => ({ post: p, count: (postRatingsCache[p.id] || { count: 0 }).count }))
          .filter(x => x.count > 0)
          .sort((a, b) => b.count - a.count)
          .slice(0, 5)
          .map(x => x.post)
      : [];

    const content = renderShellAndGetContent();
    content.innerHTML = `
      <div class="ig-search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search ig-search" id="searchInput" placeholder="Pesquisar pessoas" value="${escapeHtml(searchVal)}" ${othersAll.length === 0 ? 'disabled' : ''} />
      </div>
      ${topPosts.length > 0 ? `
        <div class="section-label" style="margin-top:6px;"><h2>Frequências em alta</h2></div>
        <div id="topPostsList">${topPosts.map(p => feedItemHtml(p)).join('')}</div>
      ` : ''}
      ${othersAll.length === 0 ? `
        <div class="empty">
          <h3>Ainda não tem ninguém aqui</h3>
          <p>Compartilhe este link com outras pessoas para que elas criem o perfil delas.</p>
        </div>
      ` : listToShow.length === 0 ? `
        <div class="empty"><p>Nenhum perfil encontrado com "${escapeHtml(searchVal)}".</p></div>
      ` : `
        ${!isSearching ? `<div class="section-label" style="margin-top:6px;"><h2>Sugestões pra seguir</h2></div>` : ''}
        <div class="discover-list">${listToShow.map(discoverCardHtml).join('')}</div>
      `}
    `;
    const topPostsEl = document.getElementById('topPostsList');
    if(topPostsEl) bindFeedListEvents(topPostsEl);
    const search = document.getElementById('searchInput');
    if(search){
      search.addEventListener('input', (e) => { view.search = e.target.value; render(); setTimeout(()=>{
        const s = document.getElementById('searchInput'); if(s){ s.focus(); s.selectionStart = s.selectionEnd = s.value.length; }
      },0); });
    }
    document.querySelectorAll('.discover-row').forEach(el => {
      el.addEventListener('click', (e) => {
        if(e.target.closest('.follow-btn')) return;
        view = { name: 'profile', id: el.dataset.id }; render();
      });
    });
    document.querySelectorAll('.follow-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        btn.disabled = true;
        try{
          await toggleFollow(id);
          renderDiscover();
        }catch(err){
          btn.disabled = false;
          showToast('Não deu pra seguir agora. Tente de novo.');
        }
      });
    });
  }
