  async function exportAllData(){
    const backup = { exportedAt: new Date().toISOString(), profiles: {}, ratings: {}, feed: [] };
    // perfis
    const profileKeys = await window.storage.list('profile:', true);
    await Promise.all((profileKeys?.keys || []).map(async k => {
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) backup.profiles[k] = JSON.parse(r.value);
      }catch(e){}
    }));
    // notas (formato novo, uma chave por perfil)
    const ratingKeys = await window.storage.list('ratings:', true);
    await Promise.all((ratingKeys?.keys || []).map(async k => {
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) backup.ratings[k] = JSON.parse(r.value);
      }catch(e){}
    }));
    // feed (frequências)
    try{
      const r = await window.storage.get('feed', true);
      backup.feed = (r && r.value) ? JSON.parse(r.value) : [];
    }catch(e){}
    return backup;
  }

  function openBackupModal(){
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal">
        <div class="handle"></div>
        <h3>Backup dos dados</h3>
        <div class="field" style="text-align:center; max-width:320px;">
          <p style="color:var(--text-muted); font-size:13px; line-height:1.5; margin:0 0 16px;" id="backupStatus">
            Reunindo todos os perfis e notas...
          </p>
        </div>
        <div class="row-2" id="backupActions" style="display:none;">
          <button class="btn btn-primary" id="downloadBackupBtn">Baixar .json</button>
          <button class="btn btn-ghost" id="selectAllBtn">Selecionar tudo</button>
        </div>
        <textarea id="backupText" readonly style="display:none; width:100%; max-width:320px; height:160px; margin-top:14px; background:var(--card); border:1px solid var(--border); border-radius:13px; color:var(--text); font-family:'Manrope', sans-serif; font-size:11px; padding:10px;"></textarea>
        <button class="btn btn-ghost btn-block" id="closeBackupModal" style="max-width:320px; margin-top:14px;">Fechar</button>
      </div>
    `;
    document.body.appendChild(bg);
    bg.addEventListener('click', (e) => { if(e.target === bg) bg.remove(); });
    document.getElementById('closeBackupModal').addEventListener('click', () => bg.remove());

    exportAllData().then(backup => {
      const json = JSON.stringify(backup, null, 2);
      const status = document.getElementById('backupStatus');
      const nProfiles = Object.keys(backup.profiles).length;
      const nRatingSets = Object.keys(backup.ratings).length;
      status.textContent = `${nProfiles} perfis e ${nRatingSets} conjuntos de notas encontrados.`;
      document.getElementById('backupActions').style.display = 'flex';
      const textarea = document.getElementById('backupText');
      textarea.style.display = 'block';
      textarea.value = json;

      document.getElementById('downloadBackupBtn').addEventListener('click', () => {
        try{
          const blob = new Blob([json], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'aura-backup-' + new Date().toISOString().slice(0,10) + '.json';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }catch(e){
          showToast('Não deu pra baixar — copie o texto abaixo.');
        }
      });
      document.getElementById('selectAllBtn').addEventListener('click', () => {
        textarea.focus();
        textarea.select();
        showToast('Texto selecionado — use Ctrl+C / Cmd+C');
      });
    }).catch(() => {
      document.getElementById('backupStatus').textContent = 'Não consegui reunir os dados agora. Tente de novo em instantes.';
    });
  }

  function renderProfileDetail(id){
    const p = profiles[id];
    if(!p){ view = { name: 'home' }; return renderHome(); }
    const rawStats = ratingsCache[id] || { avg: null, count: 0, myScore: null };
    const isMe = id === ME_ID;
    const fStats = followersCache[id] || { count: 0, amIFollowing: false };
    // se a pessoa ligou "esconder nota de aura de quem não segue" e você não
    // segue ela, a nota vira "—" pra você — mas o resto (contagem de
    // avaliações, seguidores etc.) continua normal
    const auraHidden = !!p.hideAuraFromNonFollowers && !isMe && !fStats.amIFollowing;
    const stats = auraHidden ? { ...rawStats, avg: null } : rawStats;
    const scoreTxt = stats.avg === null ? '—' : stats.avg.toFixed(1);
    const auraPointsForProfile = auraHidden ? null : getAuraPoints(id);
    const givenCount = givenCountCache[id] ?? 0;
    const followingCount = followingCountCache[id] ?? 0;
    const postCount = feedCache.filter(post => post.authorId === id).length;

    // carrega seguidores/seguindo/auras medidas/frequências farmadas/avaliações recebidas em segundo plano, e re-renderiza quando pronto
    // (as avaliações também são pré-carregadas no boot, mas se aquele carregamento em lote não
    // chegou a terminar a tempo pra esse perfil — comum quando tem muita gente cadastrada —
    // garantimos aqui que elas são buscadas de novo, senão o número de "Avaliações" fica zerado)
    if(!(id in followersCache) || !(id in givenCountCache) || !(id in boostedPostsCache) || !(id in followingCountCache) || !(id in ratingsCache)){
      Promise.all([loadFollowers(id), loadGivenCount(id), loadBoostedPosts(id), loadFollowingCount(id), loadRatingsFor(id)]).then(() => {
        // as frequências que essa pessoa farmou podem ser de qualquer autor —
        // busca as que ainda não estiverem na página do feed já carregada
        const boostedIds = Object.keys(boostedPostsCache[id] || {});
        return ensurePostsLoadedByIds(boostedIds);
      }).then(() => {
        if(view.name === 'profile' && view.id === id) renderProfileDetail(id);
      }).catch(() => {});
    }
    // agora que o feed geral carrega aos poucos, as frequências PUBLICADAS por
    // essa pessoa também podem não estar no cache ainda (ex: perfil de alguém
    // que não posta há um tempo) — busca direto, sem depender da paginação
    ensureAuthorPostsLoaded(id).then((changed) => {
      if(changed && view.name === 'profile' && view.id === id) renderProfileDetail(id);
    }).catch(() => {});
    // Destaques (stories fixados) — carregados à parte, sem travar o resto
    // do perfil, igual o padrão dos outros caches acima
    if(!(id in highlightsCache)){
      loadHighlights(id).then(list => {
        highlightsCache[id] = list;
        if(view.name === 'profile' && view.id === id) renderProfileDetail(id);
      }).catch(() => {});
    }

    const content = renderShellAndGetContent();

    const activeTab = view.profileTab || 'media';
    // conta privada: esconde frequências e nota de aura de quem ainda não segue
    const isLocked = !!p.private && !isMe && !fStats.amIFollowing;
    // bloqueio: se EU bloqueei essa pessoa, ou ela me bloqueou, o perfil vira
    // uma casca vazia — sem stats, sem frequências, só a opção de desbloquear
    const isBlocked = !isMe && isBlockedEitherWay(id);
    const hideProfileContent = isLocked || isBlocked;
    const otherDisplayName = p.username || p.name;
    const profileDotsMenuHtml = isMe ? `
      <button class="post-menu-btn profile-dots-btn-abs" id="openSettingsBtn" title="Mais opções">${ICON_DOTS}</button>
    ` : `
      <div class="post-menu-wrap profile-dots-btn-abs" style="position:absolute; top:0; right:0;">
        <button class="post-menu-btn" id="profileDotsBtn" title="Mais opções">${ICON_DOTS}</button>
        <div class="post-menu-dropdown" id="profileDotsMenu">
          <button class="post-menu-item" id="reportProfileBtn">${ICON_FLAG}<span>Denunciar perfil</span></button>
          <button class="post-menu-item post-menu-item-danger" id="blockProfileBtn">${ICON_BLOCK}<span>${iBlockedUser(id) ? 'Desbloquear' : 'Bloquear'} @${escapeHtml(otherDisplayName)}</span></button>
        </div>
      </div>
    `;

    content.innerHTML = `
      <div class="p-hero" style="position:relative;">
        ${profileDotsMenuHtml}
        ${avatarWithStoryRingHtml(p, 88, true)}
        <div class="name">${escapeHtml(p.name)}</div>
        ${p.username ? `<div class="profile-username">@${escapeHtml(p.username)}</div>` : ''}
      </div>

      ${isBlocked ? '' : hideProfileContent ? `
        <div class="profile-stats profile-stats-left profile-combined-stats-only">
          <div class="stat" id="followersStatBtn" style="cursor:pointer;"><div class="num">${formatAuraCount(fStats.count)}</div><div class="lbl">Seguidores</div></div>
        </div>
      ` : `
        <div class="profile-stats" style="margin-top:6px;">
          <div class="stat" id="profileAuraWidget" style="cursor:pointer;" title="${stats.count} avaliaç${stats.count === 1 ? 'ão' : 'ões'}"><div class="num" style="color:var(--violet);">${scoreTxt}</div><div class="lbl">Nota</div></div>
          <div class="stat" id="followersStatBtn" style="cursor:pointer;"><div class="num">${formatAuraCount(fStats.count)}</div><div class="lbl">Seguidores</div></div>
          <div class="stat" id="profilePointsStat" style="cursor:pointer;"><div class="num">${auraPointsForProfile === null ? '—' : formatAuraCount(auraPointsForProfile)}</div><div class="lbl">Pontos</div></div>
        </div>
      `}

      ${(p.bio && !isBlocked) ? `<div class="profile-bio-full">${escapeHtml(p.bio)}</div>` : ''}
      ${(p.link && !isBlocked) ? `<a class="profile-bio-link" href="${escapeHtml(p.link)}" target="_blank" rel="noopener noreferrer nofollow">${ICON_LINK}<span>${escapeHtml(displayProfileLink(p.link))}</span></a>` : ''}

      ${!hideProfileContent && (id in highlightsCache) ? highlightsRowHtml(id, isMe) : ''}

      ${!isMe && !hideProfileContent ? `
        <div class="profile-actions-row">
          <button class="follow-btn ${fStats.amIFollowing ? 'following' : ''}" id="followBtn">${fStats.amIFollowing ? 'Seguindo' : 'Seguir'}</button>
          <button class="msg-btn" id="dmBtn">Mensagem</button>
          <button class="msg-btn heart-rate-btn ${stats.myScore !== null ? 'active' : ''}" id="rateProfileBtn" title="Avaliar aura">${ICON_HEART}</button>
        </div>
      ` : ''}

      <div class="section-divider"></div>
      ${isBlocked ? `
        <div class="empty">
          <h3>${iBlockedUser(id) ? 'Você bloqueou esse perfil' : 'Perfil indisponível'}</h3>
          <p>${iBlockedUser(id) ? `Desbloqueie @${escapeHtml(otherDisplayName)} pra ver as frequências e a nota de aura de novo.` : 'Não é possível ver o conteúdo desse perfil.'}</p>
        </div>
      ` : isLocked ? `
        <div class="empty">
          <h3>Essa conta é privada</h3>
          <p>Siga ${escapeHtml(p.name)} pra ver as frequências, a nota de aura e as mídias.</p>
        </div>
      ` : `
        <div class="profile-tabs">
          <button class="profile-tab-btn ${activeTab === 'media' ? 'active' : ''}" data-tab="media" title="Mídias">${ICON_IMAGE}</button>
          <button class="profile-tab-btn ${activeTab === 'posts' ? 'active' : ''}" data-tab="posts" title="Frequências">${ICON_HOME}</button>
          <button class="profile-tab-btn ${activeTab === 'boosted' ? 'active' : ''}" data-tab="boosted" title="Farmar aura">${ICON_REPEAT}</button>
          ${isMe ? `<button class="profile-tab-btn" id="profileGroupsTabBtn" title="Grupos">${ICON_GROUPS}</button>` : ''}
        </div>
        <div id="profileFeedList">${renderProfileTabContent(p.id, activeTab)}</div>
      `}
    `;

    const profileFeedEl = document.getElementById('profileFeedList');
    if(profileFeedEl) bindFeedListEvents(profileFeedEl);
    const highlightsRowEl = document.getElementById('highlightsRow');
    if(highlightsRowEl) bindHighlightsRowEvents(highlightsRowEl, id);
    document.querySelectorAll('.profile-tab-btn[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => { view.profileTab = btn.dataset.tab; renderProfileDetail(id); });
    });
    const followersStatBtn = document.getElementById('followersStatBtn');
    if(followersStatBtn) followersStatBtn.addEventListener('click', () => openFollowersModal(id));
    const followingStatBtn = document.getElementById('followingStatBtn');
    if(followingStatBtn) followingStatBtn.addEventListener('click', () => openFollowingModal(id));
    const profileAuraWidget = document.getElementById('profileAuraWidget');
    if(profileAuraWidget) profileAuraWidget.addEventListener('click', () => openRatersModal(id)); // nota + pontos de aura vêm das mesmas avaliações — mesma lista; a quantidade de avaliações aparece dentro do modal
    const profilePointsStat = document.getElementById('profilePointsStat');
    if(profilePointsStat) profilePointsStat.addEventListener('click', () => openRatersModal(id));
    const profileGroupsTabBtn = document.getElementById('profileGroupsTabBtn');
    if(profileGroupsTabBtn) profileGroupsTabBtn.addEventListener('click', () => { view = { name: 'groups' }; render(); });

    if(isMe){
      const settingsBtn = document.getElementById('openSettingsBtn');
      if(settingsBtn) settingsBtn.addEventListener('click', () => { view = { name: 'settings' }; render(); });
    } else {
      const profileDotsBtn = document.getElementById('profileDotsBtn');
      const profileDotsMenu = document.getElementById('profileDotsMenu');
      if(profileDotsBtn && profileDotsMenu){
        profileDotsBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const wasOpen = profileDotsMenu.classList.contains('open');
          closeAllPostMenus();
          if(!wasOpen) profileDotsMenu.classList.add('open');
        });
      }
      const reportProfileBtn = document.getElementById('reportProfileBtn');
      if(reportProfileBtn) reportProfileBtn.addEventListener('click', () => {
        closeAllPostMenus();
        openReportModal('profile', id, {});
      });
      const blockProfileBtn = document.getElementById('blockProfileBtn');
      if(blockProfileBtn) blockProfileBtn.addEventListener('click', () => {
        closeAllPostMenus();
        confirmAndToggleBlock(id, otherDisplayName);
      });
    }

    if(!isMe){
      const followBtn = document.getElementById('followBtn');
      if(followBtn){
        followBtn.addEventListener('click', async () => {
          followBtn.disabled = true;
          try{
            await toggleFollow(id);
            pulseFeedback(followBtn);
            setTimeout(() => renderProfileDetail(id), 260);
          }catch(err){
            followBtn.disabled = false;
            showToast('Não deu pra seguir agora. Tente de novo.');
          }
        });
      }
      const dmBtn = document.getElementById('dmBtn');
      if(dmBtn) dmBtn.addEventListener('click', () => { view = { name: 'chat', id: id }; render(); });
      const rateProfileBtn = document.getElementById('rateProfileBtn');
      if(rateProfileBtn) rateProfileBtn.addEventListener('click', () => openRateProfileModal(id));
    }
  }

  // modal de avaliar aura do perfil — antes ficava um bloco fixo na tela do
  // perfil; agora abre por aqui, clicando no coração do lado de "Mensagem"
  function openRateProfileModal(profileId){
    const p = profiles[profileId];
    if(!p) return;
    const stats = ratingsCache[profileId] || { avg: null, count: 0, myScore: null };
    const bg = document.createElement('div');
    bg.className = 'modal-bg modal-bg-center';
    bg.innerHTML = `
      <div class="modal modal-narrow rate-modal-glass">
        <h3>Sua nota de aura para ${escapeHtml(p.name)}</h3>
        <div class="rate-modal-card">
          <div id="rateGauge"></div>
          <div class="rate-modal-slider-col">
            <input type="range" min="0" max="10" step="1" value="${stats.myScore ?? 5}" id="rateSlider" />
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="sendRating" style="max-width:280px; margin-top:14px;">${stats.myScore !== null ? 'Atualizar' : 'Enviar'}</button>
        ${stats.myScore !== null ? `<button class="rate-modal-remove-btn" id="removeRatingBtn">Remover minha avaliação</button>` : ''}
      </div>
    `;
    document.body.appendChild(bg);
    bg.addEventListener('click', (e) => { if(e.target === bg) bg.remove(); });
    const slider = document.getElementById('rateSlider');
    bindRateGauge(slider, 'rateGauge');
    document.getElementById('sendRating').addEventListener('click', async (e) => {
      const btn = e.target;
      const originalLabel = btn.textContent;
      const score = parseInt(slider.value);
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      try{
        await submitRating(profileId, score);
        showToast('Aura enviada');
        if(score >= 9){
          const rect = btn.getBoundingClientRect();
          burstConfetti(rect.left + rect.width / 2, rect.top);
        }
        bg.remove();
        renderProfileDetail(profileId);
      }catch(err){
        btn.disabled = false;
        btn.textContent = originalLabel;
        showToast('Não deu pra enviar. Tente de novo.');
      }
    });
    const removeBtn = document.getElementById('removeRatingBtn');
    if(removeBtn){
      removeBtn.addEventListener('click', async () => {
        if(!confirm(`Remover sua avaliação de aura pra ${p.name}?`)) return;
        removeBtn.disabled = true;
        removeBtn.textContent = 'Removendo...';
        try{
          await removeRating(profileId);
          showToast('Avaliação removida.');
          bg.remove();
          renderProfileDetail(profileId);
        }catch(err){
          removeBtn.disabled = false;
          removeBtn.textContent = 'Remover minha avaliação';
          showToast('Não deu pra remover agora. Tente de novo.');
        }
      });
    }
  }

  function groupRowHtml(g){
    const memberCount = (g.memberIds || []).length;
    const avatarInner = g.photo
      ? `<img src="${g.photo}" style="width:100%;height:100%;object-fit:cover;" loading="lazy" decoding="async" />`
      : `<div class="avatar" style="width:100%;height:100%;font-size:20px;">${escapeHtml(initials(g.name))}</div>`;
    return `<div class="discover-row" data-id="${g.id}" style="cursor:pointer;">
      <div style="width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;">${avatarInner}</div>
      <div class="discover-row-info">
        <div class="name">${escapeHtml(g.name)}</div>
        <div class="discover-row-meta"><span class="count">${memberCount} ${memberCount === 1 ? 'membro' : 'membros'}</span></div>
      </div>
    </div>`;
  }
  // linha de grupo nas "Sugestões de grupos" — mesma aparência, mas com botão de participar
  function groupSuggestRowHtml(g){
    const memberCount = (g.memberIds || []).length;
    const avatarInner = g.photo
      ? `<img src="${g.photo}" style="width:100%;height:100%;object-fit:cover;" loading="lazy" decoding="async" />`
      : `<div class="avatar" style="width:100%;height:100%;font-size:20px;">${escapeHtml(initials(g.name))}</div>`;
    return `<div class="discover-row" data-id="${g.id}" style="cursor:pointer;">
      <div style="width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;">${avatarInner}</div>
      <div class="discover-row-info">
        <div class="name">${escapeHtml(g.name)}</div>
        <div class="discover-row-meta"><span class="count">${memberCount} ${memberCount === 1 ? 'membro' : 'membros'}</span></div>
      </div>
      <button class="follow-btn-mini" data-join-group-id="${g.id}">Participar</button>
    </div>`;
  }
  function renderGroups(){
    if(!profiles[ME_ID]){ view = { name: 'onboard' }; return renderOnboard(); }
    const content = renderShellAndGetContent();
    const searchVal = view.groupSearch || '';
    content.innerHTML = `
      <div class="back-row">
        <div class="lbl">Grupos</div>
        <button class="icon-btn" id="createGroupBtn" title="Criar grupo" style="margin-left:auto;">${ICON_PLUS}</button>
      </div>
      <div class="ig-search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search ig-search" id="groupSearchInput" placeholder="Pesquisar grupos" value="${escapeHtml(searchVal)}" />
      </div>
      <div id="groupsList" class="loading" style="padding:30px 0;">carregando grupos...</div>
    `;
    document.getElementById('createGroupBtn').addEventListener('click', openCreateGroupModal);
    const searchInput = document.getElementById('groupSearchInput');
    searchInput.addEventListener('input', (e) => {
      view.groupSearch = e.target.value;
      renderGroups();
      setTimeout(() => {
        const s = document.getElementById('groupSearchInput');
        if(s){ s.focus(); s.selectionStart = s.selectionEnd = s.value.length; }
      }, 0);
    });

    loadMyGroups().then((myGroups) => {
      const el = document.getElementById('groupsList');
      if(!el) return;
      el.removeAttribute('style');
      el.className = '';

      const isSearching = searchVal.trim().length > 0;

      const myGroupsFiltered = isSearching
        ? myGroups.filter(g => normalize(g.name).includes(normalize(searchVal)))
        : myGroups;

      if(myGroupsFiltered.length === 0){
        el.className = 'empty';
        el.innerHTML = isSearching
          ? `<p>Nenhum grupo encontrado com "${escapeHtml(searchVal)}".</p>`
          : `<h3>Nenhum grupo ainda</h3><p>Crie um grupo pra reunir seus amigos num feed só. Você também aparece aqui quando alguém te adiciona num grupo.</p>`;
        return;
      }

      el.innerHTML = `
        <div class="section-label" style="margin-top:6px;"><h2>Meus grupos</h2></div>
        <div class="discover-list">${myGroupsFiltered.map(groupRowHtml).join('')}</div>
      `;
      el.querySelectorAll('.discover-row').forEach(row => {
        row.addEventListener('click', () => {
          view = { name: 'group', id: row.dataset.id }; render();
        });
      });
    }).catch(() => {
      const el = document.getElementById('groupsList');
      if(el){ el.removeAttribute('style'); el.className = 'empty'; el.innerHTML = `<p>Não deu pra carregar os grupos.</p>`; }
    });
  }
  function openCreateGroupModal(){
    const bg = document.createElement('div');
    bg.className = 'modal-bg modal-bg-center';
    bg.innerHTML = `
      <div class="modal">
        <h3>Criar grupo</h3>
        <div class="edit-field" style="max-width:320px; width:100%; text-align:left;">
          <label class="edit-field-label">Nome do grupo</label>
          <input type="text" id="newGroupName" maxlength="40" />
        </div>
        <div class="edit-field" style="max-width:320px; width:100%; text-align:left;">
          <label class="edit-field-label">Descrição (opcional)</label>
          <textarea class="bio-input" id="newGroupDesc" maxlength="140"></textarea>
        </div>
        <button class="btn btn-primary btn-block" id="createGroupSubmitBtn" style="max-width:320px;">Criar</button>
      </div>
    `;
    document.body.appendChild(bg);
    bg.addEventListener('click', (e) => { if(e.target === bg) bg.remove(); });
    document.getElementById('createGroupSubmitBtn').addEventListener('click', async () => {
      const name = document.getElementById('newGroupName').value.trim();
      if(!name) return;
      const btn = document.getElementById('createGroupSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Criando...';
      try{
        const desc = document.getElementById('newGroupDesc').value.trim();
        const groupId = await createGroup(name, desc);
        bg.remove();
        view = { name: 'group', id: groupId };
        render();
      }catch(err){
        btn.disabled = false;
        btn.textContent = 'Criar';
        showToast('Não deu pra criar o grupo. Tente de novo.');
      }
    });
  }
  function openInviteToGroupModal(groupId, group){
    const bg = document.createElement('div');
    bg.className = 'modal-bg modal-bg-center';
    bg.innerHTML = `
      <div class="modal" style="max-height:70vh; max-height:70dvh; overflow-y:auto;">
        <h3>Adicionar ao grupo</h3>
        <div id="inviteList" style="width:100%; max-width:320px;"></div>
      </div>
    `;
    document.body.appendChild(bg);
    bg.addEventListener('click', (e) => { if(e.target === bg) bg.remove(); });
    const candidates = Object.values(profiles).filter(p => !(group.memberIds || []).includes(p.id));
    const listEl = document.getElementById('inviteList');
    if(candidates.length === 0){
      listEl.innerHTML = `<div class="feed-empty">Todo mundo que você conhece já está no grupo.</div>`;
      return;
    }
    listEl.innerHTML = candidates.map(p => `
      <div class="suggest-row">
        ${avatarHtml(p, 40)}
        <div class="suggest-row-info"><div class="name">${escapeHtml(p.name)}</div></div>
        <button class="follow-btn-mini" data-add-id="${p.id}">Adicionar</button>
      </div>
    `).join('');
    listEl.querySelectorAll('[data-add-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Adicionando...';
        try{
          await addGroupMember(groupId, btn.dataset.addId);
          btn.textContent = 'Adicionado';
          btn.classList.add('following');
        }catch(err){
          btn.disabled = false;
          btn.textContent = 'Adicionar';
          showToast('Não deu. Tente de novo.');
        }
      });
    });
  }
  // liga/desliga os botões de "gravar áudio" (microfone) e "enviar" (seta) —
  // igual Instagram/WhatsApp: só aparece a setinha de enviar quando tem
  // alguma coisa pra mandar (texto ou imagem anexada); sem isso, o microfone
  // some e dá lugar a ela. hasContentFn() diz se tem algo pra enviar agora.
  function bindComposeSendToggle(inputEl, micBtn, sendBtn, hasContentFn){
    function sync(){
      const hasContent = inputEl.value.trim().length > 0 || (hasContentFn && hasContentFn());
      if(micBtn) micBtn.style.display = hasContent ? 'none' : '';
      sendBtn.style.display = hasContent ? '' : 'none';
    }
    sync();
    return sync;
  }
  function renderGroupDetail(groupId){
    if(!profiles[ME_ID]){ view = { name: 'onboard' }; return renderOnboard(); }
    const groupTab = view.groupTab || 'feed';
    const isChatTab = groupTab === 'chat';
    const content = renderShellAndGetContent();
    content.innerHTML = isChatTab
      ? `<div id="groupContent" class="loading" style="flex:1; display:flex; flex-direction:column; min-height:0;">carregando chat...</div>`
      : `<div id="groupContent" class="loading" style="padding:30px 0;">carregando grupo...</div>`;

    loadGroup(groupId).then(group => {
      const el = document.getElementById('groupContent');
      if(!el) return;
      if(!group || !(group.memberIds || []).includes(ME_ID)){
        el.removeAttribute('style');
        el.className = 'empty';
        el.innerHTML = `<h3>Grupo não encontrado</h3><p>Você não faz parte desse grupo, ou ele não existe mais.</p>`;
        return;
      }
      // guarda nome/foto pro cabeçalho da tela cheia do chat (ver
      // groupHeaderCache lá em cima) e, se o cabeçalho já tinha sido
      // desenhado sem esses dados (loadGroup ainda não tinha voltado quando
      // a casca foi montada), atualiza ele agora no lugar
      groupHeaderCache[groupId] = { name: group.name, photo: group.photo || null };
      if(isChatTab){
        const hAvatarWrap = document.getElementById('groupChatHeaderAvatarWrap');
        if(hAvatarWrap && group.photo && !hAvatarWrap.querySelector('img')) hAvatarWrap.innerHTML = `<img src="${group.photo}" style="width:100%;height:100%;object-fit:cover;" />`;
        const hName = document.getElementById('groupChatHeaderName');
        if(hName) hName.textContent = group.name;
      }
      const isOwner = group.ownerId === ME_ID;

      // ---------- aba de chat: tela cheia, igual a conversa 1-a-1 (sem a
      // foto/descrição/abas do grupo em cima — só a lista de mensagens e a
      // caixa de escrever, sempre grudada no rodapé de verdade) ----------
      if(isChatTab){
        el.removeAttribute('style');
        el.className = 'chat-screen';
        el.innerHTML = `
          <div id="groupChatMessages" class="chat-messages loading">carregando chat...</div>
          <div id="groupChatImagePreview" class="chat-compose-image-preview" style="flex-shrink:0;">
            <img id="groupChatImagePreviewImg" alt="" />
            <button class="chat-compose-image-remove" id="groupChatImageRemove" title="Remover imagem">✕</button>
          </div>
          <div class="chat-compose" style="flex-shrink:0;" id="groupChatComposeRow">
            <button class="icon-btn chat-compose-plus" id="groupChatImageBtn" title="Adicionar foto">${ICON_PLUS}</button>
            <input type="file" id="groupChatImageInput" accept="image/*" style="display:none;" />
            <input type="text" id="groupChatInput" class="chat-input" maxlength="500" placeholder="Escreva pro grupo..." />
            <button class="icon-btn" id="groupChatSendBtn" title="Enviar" style="display:none;">${ICON_ARROW_RIGHT}</button>
          </div>
        `;
        function bindGroupChatAuthorLinks(container){
          container.querySelectorAll('.group-chat-author-link').forEach(linkEl => {
            linkEl.addEventListener('click', () => { view = { name: 'profile', id: linkEl.dataset.id }; render(); });
          });
        }
        function scrollGroupChatToBottom(){
          const msgsElInner = document.getElementById('groupChatMessages');
          if(msgsElInner) msgsElInner.scrollTop = msgsElInner.scrollHeight;
        }
        loadGroupChat(groupId).then(msgs => {
          if(!(view.name === 'group' && view.id === groupId && (view.groupTab || 'feed') === 'chat')) return;
          const msgsEl = document.getElementById('groupChatMessages');
          if(!msgsEl) return;
          msgsEl.classList.remove('loading');
          msgsEl.innerHTML = msgs.length === 0
            ? `<div class="feed-empty">Nenhuma mensagem ainda nesse grupo. Diga oi.</div>`
            : msgs.map(groupChatBubbleHtml).join('');
          bindGroupChatAuthorLinks(msgsEl);
          scrollGroupChatToBottom();
        }).catch(() => {
          const msgsEl = document.getElementById('groupChatMessages');
          if(msgsEl){ msgsEl.classList.remove('loading'); msgsEl.innerHTML = `<div class="feed-empty">Não deu pra carregar o chat.</div>`; }
        });

        const gcInput = document.getElementById('groupChatInput');
        const gcSendBtn = document.getElementById('groupChatSendBtn');
        const gcImageBtn = document.getElementById('groupChatImageBtn');
        const gcImageInput = document.getElementById('groupChatImageInput');
        const gcImagePreview = document.getElementById('groupChatImagePreview');
        const gcImagePreviewImg = document.getElementById('groupChatImagePreviewImg');
        const gcImageRemove = document.getElementById('groupChatImageRemove');
        let gcImageData = null;
        const syncGcSendToggle = bindComposeSendToggle(gcInput, null, gcSendBtn, () => !!gcImageData);
        gcInput.addEventListener('input', syncGcSendToggle);

        gcImageBtn.addEventListener('click', () => gcImageInput.click());
        gcImageInput.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if(!file) return;
          try{
            if(file.type === 'image/gif'){
              if(file.size > 700 * 1024){
                showToast('Esse GIF é grande demais (máx. ~700KB). Escolha um menor.', 3500);
                gcImageInput.value = '';
                return;
              }
              gcImageData = await fileToRawDataUrl(file);
            } else {
              const attempts = [[700, 0.65], [550, 0.5], [400, 0.35]];
              let result = null;
              for(const [dim, q] of attempts){
                result = await resizeImageDataUrl(file, dim, q);
                if(result.length < 350000) break;
              }
              gcImageData = result;
            }
            gcImagePreviewImg.src = gcImageData;
            gcImagePreview.style.display = 'block';
            syncGcSendToggle();
          }catch(err){
            showToast('Não deu pra carregar essa imagem. Tente outra.');
          }
        });
        gcImageRemove.addEventListener('click', () => {
          gcImageData = null;
          gcImageInput.value = '';
          gcImagePreview.style.display = 'none';
          syncGcSendToggle();
        });

        async function doSendGroupMsg(){
          const text = gcInput.value.trim();
          if(!text && !gcImageData) return;
          gcInput.disabled = true;
          gcSendBtn.disabled = true;
          try{
            const msgs = await sendGroupMessage(groupId, text, gcImageData);
            gcInput.value = '';
            gcImageData = null;
            gcImageInput.value = '';
            gcImagePreview.style.display = 'none';
            syncGcSendToggle();
            const msgsEl = document.getElementById('groupChatMessages');
            if(msgsEl){
              msgsEl.classList.remove('loading');
              msgsEl.innerHTML = msgs.map(groupChatBubbleHtml).join('');
              bindGroupChatAuthorLinks(msgsEl);
              scrollGroupChatToBottom();
            }
          }catch(err){
            showToast('Não deu pra enviar. Tente de novo.');
          }
          gcInput.disabled = false;
          gcSendBtn.disabled = false;
          gcInput.focus();
        }
        gcSendBtn.addEventListener('click', doSendGroupMsg);
        gcInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doSendGroupMsg(); });
        return;
      }

      // ---------- abas "Frequências" e "Ranking": página normal do grupo,
      // com foto, descrição, contagem de membros e o seletor de abas ----------
      el.removeAttribute('style');
      el.className = '';
      const memberCount = (group.memberIds || []).length;
      const groupPosts = feedCache.filter(p => p.groupId === groupId).sort((a, b) => b.createdAt - a.createdAt);
      const memberRanked = (group.memberIds || [])
        .map(id => ({ p: profiles[id], stats: ratingsCache[id] || { avg: null, count: 0 } }))
        .filter(x => x.p && x.stats.avg !== null)
        .sort((a, b) => (b.stats.avg || 0) - (a.stats.avg || 0));
      const groupAvatarInner = group.photo
        ? `<img src="${group.photo}" style="width:100%;height:100%;object-fit:cover;" />`
        : `<div class="avatar" style="width:100%;height:100%;font-size:24px;">${escapeHtml(initials(group.name))}</div>`;
      el.innerHTML = `
        <div class="p-hero" style="padding-top:0; flex-direction:row; text-align:left; justify-content:flex-start; gap:14px;">
          <div id="groupAvatarWrap" style="width:64px;height:64px;border-radius:50%;overflow:hidden;flex-shrink:0;position:relative;${isOwner ? 'cursor:pointer;' : ''}">
            ${groupAvatarInner}
            ${isOwner ? `<div style="position:absolute; inset:0; background:rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s ease;" class="group-avatar-hover">${ICON_PENCIL}</div>` : ''}
          </div>
          ${isOwner ? '<input type="file" id="groupPhotoInput" accept="image/*" style="display:none;" />' : ''}
          <div>
            <div class="name" style="margin-top:0; font-size:20px;">${escapeHtml(group.name)}</div>
            ${group.description ? `<div class="bio" style="margin-top:2px;">${escapeHtml(group.description)}</div>` : ''}
            <div id="groupMembersLink" style="color:var(--text-faint); font-size:12px; margin-top:4px; cursor:pointer; text-decoration:underline; text-decoration-color:transparent;">${memberCount} ${memberCount === 1 ? 'membro' : 'membros'}</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-block" id="inviteMemberBtn" style="margin-top:14px;">Adicionar pessoas ao grupo</button>
        <button class="btn btn-ghost btn-block" id="leaveGroupBtn" style="margin-top:8px; color:#e05c5c;">Sair do grupo</button>
        <div class="section-divider"></div>
        <div class="profile-tabs">
          <button class="profile-tab-btn group-tab-btn ${groupTab === 'feed' ? 'active' : ''}" data-tab="feed" title="Frequências">${ICON_HOME}</button>
          <button class="profile-tab-btn group-tab-btn ${groupTab === 'chat' ? 'active' : ''}" data-tab="chat" title="Chat do grupo">${ICON_MESSAGE}</button>
          <button class="profile-tab-btn group-tab-btn ${groupTab === 'ranking' ? 'active' : ''}" data-tab="ranking" title="Top auras do grupo">${ICON_TROPHY}</button>
        </div>
        <div id="groupTabContent">${groupTab === 'ranking' ? `
          <div class="rank-panel">
            <div class="rank-list">${memberRanked.length === 0 ? `<div class="feed-empty">Ninguém do grupo tem aura avaliada ainda.</div>` : memberRanked.map((x, i) => rankRowHtml(x.p, x.stats, i)).join('')}</div>
          </div>
        ` : `
          <div class="feed-compose">
            <textarea id="groupPostText" maxlength="240" placeholder="Escreva pro grupo..."></textarea>
            <div class="feed-compose-footer">
              <span></span>
              <span class="feed-char-count" id="groupCharCount">240</span>
              <button class="btn btn-primary feed-post-btn" id="groupPostBtn">Publicar</button>
            </div>
          </div>
          <div id="groupFeedList">${groupPosts.length === 0 ? `<div class="feed-empty">Nenhuma frequência nesse grupo ainda.</div>` : groupPosts.map(p => feedItemHtml(p, null, true)).join('')}</div>
        `}</div>
      `;
      document.querySelectorAll('.group-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => { view.groupTab = btn.dataset.tab; renderGroupDetail(groupId); });
      });
      if(groupTab === 'ranking'){
        document.querySelectorAll('.rank-row').forEach(rowEl => {
          rowEl.addEventListener('click', () => { view = { name: 'profile', id: rowEl.dataset.id }; render(); });
        });
      }
      const groupFeedEl = document.getElementById('groupFeedList');
      if(groupFeedEl) bindFeedListEvents(groupFeedEl);

      const textarea = document.getElementById('groupPostText');
      const charCount = document.getElementById('groupCharCount');
      const postBtn = document.getElementById('groupPostBtn');
      if(textarea){
      attachMentionAutocomplete(textarea, textarea.closest('.feed-compose'));
      textarea.addEventListener('input', () => { charCount.textContent = 240 - textarea.value.length; });
      postBtn.addEventListener('click', async () => {
        const text = textarea.value.trim();
        if(!text) return;
        if(containsBlockedContent(text)){
          showToast('Esse conteúdo não é permitido no Aura.', 3500);
          return;
        }
        postBtn.disabled = true;
        try{
          await publishPost(text, null, groupId);
          renderGroupDetail(groupId);
        }catch(err){
          showToast('Não deu pra publicar. Tente de novo.');
          postBtn.disabled = false;
        }
      });
      }

      document.getElementById('inviteMemberBtn').addEventListener('click', () => openInviteToGroupModal(groupId, group));
      const groupMembersLinkEl = document.getElementById('groupMembersLink');
      if(groupMembersLinkEl) groupMembersLinkEl.addEventListener('click', () => openGroupMembersModal(groupId, group));
      const leaveGroupBtnEl = document.getElementById('leaveGroupBtn');
      if(leaveGroupBtnEl){
        leaveGroupBtnEl.addEventListener('click', async () => {
          if(!confirm('Tem certeza que quer sair desse grupo?')) return;
          leaveGroupBtnEl.disabled = true;
          try{
            await leaveGroup(groupId);
            showToast('Você saiu do grupo.');
            view = { name: 'groups' };
            render();
          }catch(err){
            showToast('Não deu pra sair do grupo. Tente de novo.');
            leaveGroupBtnEl.disabled = false;
          }
        });
      }
      if(isOwner){
        const avatarWrap = document.getElementById('groupAvatarWrap');
        const photoInput = document.getElementById('groupPhotoInput');
        const hoverEl = avatarWrap.querySelector('.group-avatar-hover');
        avatarWrap.addEventListener('mouseenter', () => { if(hoverEl) hoverEl.style.opacity = '1'; });
        avatarWrap.addEventListener('mouseleave', () => { if(hoverEl) hoverEl.style.opacity = '0'; });
        avatarWrap.addEventListener('click', () => photoInput.click());
        photoInput.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if(!file) return;
          try{
            const photoData = await fileToResizedDataUrl(file);
            await updateGroupPhoto(groupId, photoData);
            renderGroupDetail(groupId);
          }catch(err){
            showToast('Não deu pra trocar a foto. Tente de novo.');
          }
        });
      }
    }).catch(() => {
      const el = document.getElementById('groupContent');
      if(el){ el.removeAttribute('style'); el.className = 'empty'; el.innerHTML = `<p>Não deu pra carregar o grupo.</p>`; }
    });
  }

          showToast(wantsPrivate ? 'Sua conta agora é privada.' : 'Sua conta agora é pública.');

          showToast(val ? 'Sua nota de aura agora fica escondida de quem não te segue.' : 'Sua nota de aura voltou a ficar visível pra todo mundo.');

          hideAuraToggle.checked = !val;

        hideAuraToggle.disabled = false;
      });

    if(rateAnonymouslyToggle){
      rateAnonymouslyToggle.addEventListener('change', async () => {

        try{
          await saveProfile({ ...me, rateAnonymously: val });
          showToast(val ? 'A partir de agora suas avaliações aparecem como anônimas.' : 'Suas avaliações voltam a mostrar seu nome.');

      });
    }
    const enablePushBtn = document.getElementById('enablePushBtn');
    if(enablePushBtn){
      enablePushBtn.addEventListener('click', async () => {
        if(pushAlreadyRegisteredHere) return; // já ativado nesse aparelho, nada a fazer
        if(!window._auraMessaging){ showToast('Notificações push não disponíveis nesse navegador.'); return; }
        enablePushBtn.disabled = true;
        try{
          const token = await window._auraMessaging.requestPermissionAndGetToken();
          // guarda o token desse dispositivo pra Cloud Function achar quem
          // avisar quando alguém interagir com você — igual "followers:<id>",
          // um documento por pessoa com um token por chave (várias chaves =
          // vários aparelhos logados)
          let obj = {};
          try{
            const r = await window.storage.get('pushTokens:' + ME_ID, true);
            if(r && r.value) obj = JSON.parse(r.value);
          }catch(e){ obj = {}; }
          obj[token] = { addedAt: Date.now(), ua: navigator.userAgent.slice(0, 120) };
          await window.storage.set('pushTokens:' + ME_ID, JSON.stringify(obj), true);
          try{ localStorage.setItem('aura_push_registered', '1'); }catch(e){}
          showToast('Notificações push ativadas nesse aparelho!');
          render();
        }catch(err){
          showToast(err.message || 'Não deu pra ativar as notificações agora. Tente de novo.');
        }
        enablePushBtn.disabled = false;
      });
    }
    document.querySelectorAll('.notifPrefToggle').forEach(toggle => {
      toggle.addEventListener('change', async () => {
        const key = toggle.dataset.key;
        const val = toggle.checked;
        toggle.disabled = true;
        try{
          const notifPrefs = { ...(me?.notifPrefs || {}), [key]: val };
          await saveProfile({ ...me, notifPrefs });
        }catch(err){
          toggle.checked = !val;
          showToast('Não deu pra salvar. Tente de novo.');
        }
        toggle.disabled = false;
      });
    });
    const insightsBtn = document.getElementById('insightsBtn');
    if(insightsBtn) insightsBtn.addEventListener('click', () => { view = { name: 'insights' }; render(); });
    const editProfileLinkBtn = document.getElementById('editProfileLinkBtn');
    if(editProfileLinkBtn) editProfileLinkBtn.addEventListener('click', () => { view = { name: 'edit' }; render(); });
    const lightThemeToggle = document.getElementById('lightThemeToggle');
    if(lightThemeToggle){
      lightThemeToggle.addEventListener('change', () => {
        const wantsLight = lightThemeToggle.checked;
        document.documentElement.setAttribute('data-theme', wantsLight ? 'light' : 'dark');
        try{ localStorage.setItem('aura_theme', wantsLight ? 'light' : 'dark'); }catch(e){ /* best-effort */ }
        const meta = document.querySelector('meta[name="theme-color"]');
        if(meta) meta.setAttribute('content', wantsLight ? '#FAFAFA' : '#000000');
      });
    }
    const savedPostsLinkBtn = document.getElementById('savedPostsLinkBtn');
    if(savedPostsLinkBtn) savedPostsLinkBtn.addEventListener('click', () => { view = { name: 'saved' }; render(); });
    const changePasswordBtn = document.getElementById('changePasswordBtn');
    if(changePasswordBtn){
      changePasswordBtn.addEventListener('click', async () => {
        changePasswordBtn.disabled = true;
        try{
          await window._auraAuth.sendPasswordReset(email);
          showToast('Te mandamos um e-mail com o link pra trocar a senha.', 4000);
        }catch(err){
          showToast('Não deu pra enviar o e-mail. Tente de novo.');
        }
        changePasswordBtn.disabled = false;
      });
    }
    const installBtn = document.getElementById('installAppBtn');
    if(installBtn){
      installBtn.addEventListener('click', async () => {
        if(window._auraInstallPrompt){
          window._auraInstallPrompt.prompt();
          const result = await window._auraInstallPrompt.userChoice;
          window._auraInstallPrompt = null;
          if(result.outcome === 'accepted') showToast('App instalado!');
        } else {
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          if(isIOS){
            showToast('No iPhone: toque em Compartilhar ⬆️ e escolha "Adicionar à Tela de Início".', 5000);
          } else {
            showToast('Abra o menu do navegador e procure "Instalar app" ou "Adicionar à tela inicial".', 5000);
          }
        }
      });
    }
    document.getElementById('togglePrivacy').addEventListener('click', () => {
      const el = document.getElementById('privacyText');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    });
    document.getElementById('settingsLogoutBtn').addEventListener('click', () => {
      window._auraAuth.signOut();
    });
    const blockedUsersBtn = document.getElementById('blockedUsersBtn');
    if(blockedUsersBtn) blockedUsersBtn.addEventListener('click', openBlockedUsersModal);
    const deleteAccountBtn = document.getElementById('deleteAccountBtn');
    if(deleteAccountBtn){
      deleteAccountBtn.addEventListener('click', async () => {
        if(!confirm('Tem certeza que quer excluir sua conta? Seu perfil e suas frequências vão ser apagados e isso não pode ser desfeito.')) return;
        const typed = prompt('Pra confirmar, digite EXCLUIR (em maiúsculas):');
        if(typed !== 'EXCLUIR'){
          if(typed !== null) showToast('Texto não confere. Sua conta não foi excluída.');
          return;
        }
        deleteAccountBtn.disabled = true;
        deleteAccountBtn.textContent = 'Excluindo...';
        try{
          await deleteMyAccount();
          showToast('Conta excluída.');
        }catch(err){
          deleteAccountBtn.disabled = false;
          deleteAccountBtn.textContent = 'Excluir minha conta';
          if(err && err.code === 'auth/requires-recent-login'){
            showToast('Por segurança, saia e entre de novo na sua conta antes de excluir. Tente em seguida.', 6000);
          } else {
            showToast('Não deu pra excluir agora. Tente de novo.', 4000);
          }
        }
      });
    }
  }

  // ---------- insights (dentro de configurações) ----------
  // um retrato do momento (não é um gráfico histórico — o app não guarda o
  // dado do passado pra isso ainda), reunindo o que já está espalhado pelo
  // app (visualizações, avaliações, farmar aura, comentários) num só lugar.
  function renderInsights(){
    const myPosts = feedCache.filter(p => p.authorId === ME_ID);
    const totalViews = myPosts.reduce((s, p) => s + (postViewsCache[p.id] || 0), 0);
    const totalBoosts = myPosts.reduce((s, p) => s + ((boostsCache[p.id] || {}).count || 0), 0);
    const totalComments = myPosts.reduce((s, p) => s + (postCommentsCache[p.id] ? postCommentsCache[p.id].length : (p.commentCount || 0)), 0);
    const totalPostRatings = myPosts.reduce((s, p) => s + ((postRatingsCache[p.id] || {}).count || 0), 0);
    // a "frequência em destaque" é a que tem MAIS avaliações (não só a nota
    // média mais alta isolada) — uma única nota 10 não deveria ganhar de uma
    // frequência com várias avaliações boas; em empate, desempata pela média
    let bestPost = null;
    myPosts.forEach(p => {
      const stats = postRatingsCache[p.id] || { avg: null, count: 0 };
      if(!stats.count) return;
      if(bestPost === null || stats.count > bestPost.count || (stats.count === bestPost.count && stats.avg > bestPost.avg)){
        bestPost = { post: p, avg: stats.avg, count: stats.count };
      }
    });
    const myStats = ratingsCache[ME_ID] || { avg: null, count: 0 };
    const fStats = followersCache[ME_ID] || { count: 0 };
    const followingCount = followingCountCache[ME_ID] ?? 0;

    const content = renderShellAndGetContent();
    content.innerHTML = `
      <div class="back-row">
        <div class="icon-btn arrow-btn-plain" id="backToSettingsBtn" title="Voltar">${ICON_ARROW_LEFT}</div>
        <div class="lbl">Insights da sua conta</div>
      </div>
      <div class="insights-hero">
        ${scoreGaugeHtml(myStats.avg, 80)}
        <div>
          <div class="score-summary-level">Sua aura</div>
          <div class="score-summary-sub">${myStats.count} avaliaç${myStats.count === 1 ? 'ão' : 'ões'} recebida${myStats.count === 1 ? '' : 's'} no total</div>
        </div>
      </div>
      <div class="insights-grid">
        <div class="insights-tile"><div class="insights-num">${myPosts.length}</div><div class="insights-lbl">Frequências publicadas</div></div>
        <div class="insights-tile"><div class="insights-num">${totalViews}</div><div class="insights-lbl">Visualizações no total</div></div>
        <div class="insights-tile"><div class="insights-num">${totalPostRatings}</div><div class="insights-lbl">Avaliações nas frequências</div></div>
        <div class="insights-tile"><div class="insights-num">${totalBoosts}</div><div class="insights-lbl">Vezes que farmaram sua aura</div></div>
        <div class="insights-tile"><div class="insights-num">${totalComments}</div><div class="insights-lbl">Comentários recebidos</div></div>
        <div class="insights-tile"><div class="insights-num">${formatAuraCount(fStats.count)}</div><div class="insights-lbl">Seguidores</div></div>
        <div class="insights-tile"><div class="insights-num">${formatAuraCount(followingCount)}</div><div class="insights-lbl">Seguindo</div></div>
      </div>
      ${bestPost ? `
        <div class="section-label" style="margin-top:22px;"><h2>Sua frequência mais avaliada</h2></div>
        <div id="insightsBestPost">${feedItemHtml(bestPost.post)}</div>
      ` : ''}
    `;
    document.getElementById('backToSettingsBtn').addEventListener('click', () => { view = { name: view.from || 'settings' }; render(); });
    const bestPostEl = document.getElementById('insightsBestPost');
    if(bestPostEl) bindFeedListEvents(bestPostEl);
  }

        btn.textContent = originalLabel;

        showToast('Não deu pra salvar (' + detail + ').', 5000);
      }
    });
  }

    content.innerHTML = `
      <div class="back-row">

      <div id="savedPostsList" class="loading" style="padding:30px 0;">carregando...</div>
    `;
    const me = profiles[ME_ID];
    // mais recente salvo primeiro (savedPostIds guarda na ordem em que foram
    // salvos, do mais antigo pro mais novo — por isso o reverse aqui)
    const savedIds = (me.savedPostIds || []).slice().reverse();
    const finish = () => {
      const el = document.getElementById('savedPostsList');
      if(!el) return;
      if(savedIds.length === 0){
        el.className = 'feed-empty';
        el.removeAttribute('style');
        el.textContent = 'Você ainda não salvou nenhuma frequência. Toque nos "..." de um post e escolha "Salvar".';
        return;
      }
      const posts = savedIds.map(id => feedCache.find(p => p.id === id)).filter(Boolean);
      if(posts.length === 0){
        el.className = 'feed-empty';
        el.removeAttribute('style');
        el.textContent = 'Os posts que você salvou não estão mais disponíveis.';
        return;
      }
      el.className = '';
      el.removeAttribute('style');
      el.innerHTML = posts.map(p => feedItemHtml(p)).join('');
      bindFeedListEvents(el);
    };
    if(savedIds.length === 0){ finish(); return; }
    ensurePostsLoadedByIds(savedIds).then(finish).catch(finish);
  }

  // ---------- boot ----------
  // ---------- puxar pra baixo no topo do feed pra atualizar ----------
  (function setupPullToRefresh(){
    const REFRESH_THRESHOLD = 80;
    const ARROW_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>';
    let startY = null, pulling = false, triggered = false, refreshing = false;
    let indicatorEl = null;
    function getIndicator(){
      if(indicatorEl) return indicatorEl;
      indicatorEl = document.createElement('div');
      indicatorEl.className = 'ptr-indicator';
      indicatorEl.innerHTML = `<span class="ptr-arrow">${ARROW_SVG}</span><span class="ptr-label">Puxe para atualizar</span>`;
      document.body.appendChild(indicatorEl);
      return indicatorEl;
    }
    // funciona em qualquer tela (não só no feed), desde que já esteja no topo
    // da rolagem e não tenha nenhum modal aberto por cima (senão brigaria com
    // o gesto de fechar/rolar dentro do modal)
    // 'chat' fica de fora: dentro de uma conversa quem rola é só a listinha de
    // mensagens (não a página), então window.scrollY já fica sempre em 0 lá —
    // sem essa exceção, QUALQUER arrasto dentro da conversa disparava esse
    // indicador de "puxe pra atualizar" por cima do cabeçalho, parecendo bug.
    const NO_PULL_VIEWS = { loading: true, auth: true, onboard: true, error: true, chat: true };
    document.addEventListener('touchstart', (e) => {
      if(!NO_PULL_VIEWS[view.name] && window.scrollY <= 0 && !document.querySelector('.modal-bg')){
        startY = e.touches[0].clientY;
        pulling = true;
        triggered = false;
      }
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if(!pulling || startY === null || refreshing) return;
      const diff = e.touches[0].clientY - startY;
      const ind = getIndicator();
      if(diff <= 4){
        ind.classList.remove('visible');
        triggered = false;
        return;
      }
      triggered = diff > REFRESH_THRESHOLD;
      ind.classList.add('visible');
      const label = ind.querySelector('.ptr-label');
      const arrow = ind.querySelector('.ptr-arrow');
      const pct = Math.min(diff / REFRESH_THRESHOLD, 1);
      arrow.style.transform = `rotate(${triggered ? 180 : pct * 180}deg)`;
      label.textContent = triggered ? 'Solte para atualizar' : 'Puxe para atualizar';
    }, { passive: true });
    document.addEventListener('touchend', async () => {
      const ind = getIndicator();
      if(pulling && triggered && !refreshing){
        refreshing = true;
        ind.classList.add('visible', 'spinning');
        ind.querySelector('.ptr-label').textContent = 'Atualizando...';
        try{
          await Promise.all([
            withTimeout(loadFeed(), 8000).catch(() => {}),
            withTimeout(loadAllPostRatings(), 8000).catch(() => {}),
            withTimeout(loadAllBoosts(), 8000).catch(() => {}),
            withTimeout(loadAllRatings(), 8000).catch(() => {}),
            withTimeout(loadAllFollowers(), 8000).catch(() => {}),
          ]);
          refreshTopAuraRanks();
          render(); // redesenha a tela atual, seja ela qual for, com os dados frescos
          showToast('Atualizado');
        }catch(e){ /* best-effort */ }
        refreshing = false;
        ind.classList.remove('spinning');
      }
      ind.classList.remove('visible');
      pulling = false; startY = null; triggered = false;
    }, { passive: true });
  })();

  let authInited = false;
  async function boot(){
    if(!ME_ID){
      view = { name: 'auth' };
      render();
      return;
    }
    view = { name: 'loading' };
    render();
    // esse carregamento (perfis) é o único que TRAVA a abertura do app — os
    // outros (feed, avaliações, seguidores etc, mais abaixo) já rodam em
    // paralelo e não travam a tela. Numa conexão mais lenta, 10s às vezes não
    // bastava e caía direto na tela de erro pedindo pra recarregar manualmente
    // — agora tenta de novo sozinho 1 vez (com mais tempo) antes de desistir,
    // o que cobre a maioria dos casos de rede só um pouco lenta.
    try{
      await withTimeout(loadAllProfiles(), 12000);
    }catch(e){
      try{
        await withTimeout(loadAllProfiles(), 18000);
      }catch(e2){
        view = { name: 'error' };
        render();
        return;
      }
    }
    if(profiles[ME_ID]){
      // "conserta sozinho" o índice @usuario -> e-mail pra quem já tinha um @ definido
      // ANTES do login por @ existir — sem isso, só quem TROCASSE de @ depois dessa
      // atualização ganhava o índice, e todo mundo mais antigo ficava sem conseguir
      // entrar digitando o @ (só com e-mail continuava funcionando normalmente)
      backfillUsernameIndex(profiles[ME_ID]); // best-effort, não trava o boot
      // loadAllRatings só depende de "profiles" (já carregado acima) — não precisa
      // terminar antes do feed/seguidores/grupos/stories começarem a buscar, então
      // entra na mesma onda paralela deles em vez de rodar sozinha antes. Isso corta
      // uma rodada inteira de espera de rede do boot (a app abria mais devagar antes).
      await Promise.allSettled([
        withTimeout(loadAllRatings(), 10000),
        withTimeout(loadFeed(), 10000),
        withTimeout(loadAllFollowers(), 10000),
        withTimeout(loadBoostedPosts(ME_ID), 10000),
        // precisa estar carregado ANTES do feed/perfil renderizarem, senão a gente
        // não sabe ainda quem é membro de qual grupo pra decidir se mostra ou
        // esconde uma frequência de grupo fora da página do próprio grupo
        withTimeout(loadMyGroups(), 10000),
        withTimeout(loadStories(), 10000)
      ]);
      refreshTopAuraRanks(); // precisa vir depois das avaliações carregarem (ver onda acima)

      // com o essencial pronto (feed, perfis, seguidores, grupos, stories), já
      // mostra a tela pra pessoa — igual o Instagram faz: o feed aparece primeiro,
      // e os números de avaliação/visualização/boost de cada post/story vão sendo
      // preenchidos sozinhos alguns instantes depois, sem travar a abertura do app
      if(!deepLinkHandled){
        deepLinkHandled = true;
        let sharedPostId = null;
        try{
          sharedPostId = new URLSearchParams(location.search).get('post');
          if(sharedPostId) window.history.replaceState({}, '', location.pathname);
        }catch(e){ /* best-effort */ }
        view = sharedPostId ? { name: 'post', id: sharedPostId } : { name: 'home' };
      } else {
        view = { name: 'home' };
      }
      render();

      refreshUnreadBadge(); // best-effort, não bloqueia a tela inicial
      refreshUnreadNotifCount(); // idem
      updateMyPresence();
      refreshOnlineSet();
      if(!window._auraUnreadPoll){
        window._auraUnreadPoll = setInterval(() => {
          refreshUnreadBadge();
          refreshUnreadNotifCount();
          updateMyPresence();
          refreshOnlineSet();
          refreshTopAuraRanks(); // o Top 10 muda com o tempo — recalcula com o que já está em cache
        }, 20000);
      }
      // com o app JÁ ABERTO, uma push que chegar não aparece sozinha (isso só
      // acontece com o app em segundo plano/fechado) — então avisa por um
      // toast e já atualiza o sininho na hora, sem precisar esperar os 20s
      // do polling acima
      if(!window._auraForegroundPushBound && window._auraMessaging){
        window._auraForegroundPushBound = true;
        window._auraMessaging.onForegroundMessage((payload) => {
          const data = (payload && payload.data) || {};
          const title = data.title || 'Aura';
          const body = data.body || '';
          showToast(body ? `${title}: ${body}` : title, 3500);
          refreshUnreadNotifCount();
        });
      }

      // resto completa em segundo plano, com a tela já de pé: as frequências que
      // EU farmei (podem ser de fora da primeira página do feed), as avaliações/
      // visualizações/boosts de cada post e story, e o resumo de novidades. Quando
      // terminar, redesenha só se a pessoa ainda estiver numa tela que mostra esses
      // números — sem isso ela ficaria vendo "0" até sair e voltar pra tela.
      (async () => {
        try{ await ensurePostsLoadedByIds(Object.keys(boostedPostsCache[ME_ID] || {})); }catch(e){ /* best-effort */ }
        // essas dependem do feed já carregado (a onda de cima), mas não dependem
        // umas das outras — rodam juntas em vez de em fila
        await Promise.allSettled([
          withTimeout(loadAllPostRatings(), 10000),
          withTimeout(loadAllPostViews(), 10000),
          withTimeout(loadAllBoosts(), 10000),
          withTimeout(loadAllStoryViews(), 10000),
          withTimeout(loadAllStoryRatings(), 10000),
          // precisa vir DEPOIS de ratings e followers carregados, senão não tem com
          // o que comparar; roda só uma vez por abertura do app (não a cada render),
          // pra não sobrescrever a "foto anterior" antes do usuário ver as novidades
          withTimeout(computeRecapUpdates(), 10000)
        ]);
        if(view.name === 'home') renderHome();
        else if(view.name === 'post' || view.name === 'profile') render();
      })();
    } else {
      view = { name: 'onboard' };
      render();
    }
  }
  window.addEventListener('unhandledrejection', (ev) => {
    showToast('Algo deu errado. Tente de novo.');
  });
  // mantém elementos fixos no rodapé (como a caixa de digitar do chat) acima do teclado
  // no celular — vh/dvh não sabem que o teclado abriu, só a Visual Viewport API sabe
  if(window.visualViewport){
    const vv = window.visualViewport;
    // só existe teclado aberto de verdade se tem um campo de texto focado —
    // sem essa trava, QUALQUER evento de resize/scroll do visualViewport
    // (inclusive a barra de endereço do Safari escondendo/aparecendo, ou o
    // "elástico" de puxar demais numa lista curta, tipo um chat com poucas
    // mensagens que não enche a tela) já mexia na variável e fazia a caixa
    // de digitar pular sozinha mesmo sem o teclado estar aberto
    let hasFocusedField = false;
    // kb-open agora liga/desliga NA HORA do foco/desfoque, em vez de esperar
    // o resize do visualViewport calcular um inset "grande o bastante" —
    // esse cálculo variava demais de aparelho pra aparelho (em alguns o
    // vão de baixo nunca sumia porque o inset nunca passava do limiar), então
    // a folguinha de baixo (pro home indicator) e o menu de baixo agora
    // reagem direto ao campo estar ou não focado, que é bem mais confiável
    document.addEventListener('focusin', (e) => {
      if(e.target.matches && e.target.matches('input, textarea, [contenteditable="true"]')){
        hasFocusedField = true;
        document.body.classList.add('kb-open');
      }
    });
    document.addEventListener('focusout', (e) => {
      if(e.target.matches && e.target.matches('input, textarea, [contenteditable="true"]')){
        hasFocusedField = false;
        document.body.classList.remove('kb-open');
        document.documentElement.style.setProperty('--keyboard-inset', '0px');
      }
    });
    function syncKeyboardInset(){
      if(!hasFocusedField){
        document.documentElement.style.setProperty('--keyboard-inset', '0px');
        return;
      }
      const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--keyboard-inset', inset + 'px');
    }
    vv.addEventListener('resize', syncKeyboardInset);
    vv.addEventListener('scroll', syncKeyboardInset);
    syncKeyboardInset();
  }
  // trava o "clique fantasma": no celular, se a pessoa está ARRASTANDO pra
  // rolar o feed e o dedo solta em cima do avatar/@ de alguém (ou de
  // qualquer outra parte clicável do post), o navegador dispara um evento de
  // "click" ali mesmo, mesmo sem ter sido um toque de verdade — e isso
  // estava abrindo o perfil (ou o post) sem a pessoa ter clicado em nada de
  // propósito. Essa trava mede se o dedo se moveu de verdade entre o início
  // do toque e o clique; se moveu, cancela esse clique específico antes que
  // qualquer outro listener (abrir perfil, abrir post, avaliar etc.) rode —
  // sem afetar cliques de mouse no desktop, nem toques parados de verdade
  // (ex: duplo toque na foto pra avaliar).
  (function setupScrollClickGuard(){
    const MOVE_THRESHOLD = 10;
    let startX = null, startY = null, movedTooMuch = false;
    document.addEventListener('touchstart', (e) => {
      const t = e.touches && e.touches[0];
      if(!t) return;
      startX = t.clientX; startY = t.clientY;
      movedTooMuch = false;
    }, { passive: true, capture: true });
    document.addEventListener('touchmove', (e) => {
      const t = e.touches && e.touches[0];
      if(!t || startX === null) return;
      if(Math.abs(t.clientX - startX) > MOVE_THRESHOLD || Math.abs(t.clientY - startY) > MOVE_THRESHOLD){
        movedTooMuch = true;
      }
    }, { passive: true, capture: true });
    document.addEventListener('click', (e) => {
      if(movedTooMuch){
        e.stopPropagation();
        e.preventDefault();
        movedTooMuch = false; // consome só esse clique fantasma, não trava o próximo toque de verdade
      }
    }, true); // capture:true — precisa rodar ANTES dos listeners de clique de cada botão/link
  })();
  // esconde a barra de topo ao rolar pra baixo, e traz ela de volta assim que
  // o usuário rola pra cima — mesmo no meio do feed, sem precisar voltar ao topo.
  // Fica num listener só (não por render()) porque a .top-bar é recriada toda
  // vez que a tela muda, então buscamos ela de novo a cada evento de scroll.
  (function setupTopBarAutoHide(){
    let lastY = window.scrollY;
    // acumula a distância rolada NA MESMA DIREÇÃO desde a última troca de
    // direção — antes comparava só o delta de um frame pro outro (±4px), e
    // numa rolagem lenta o dedo/trackpad naturalmente treme e faz esse delta
    // trocar de sinal quase a cada frame, então a barra ficava entrando e
    // saindo repetidas vezes bem rápido (parecia uma "piscada" mostrando o
    // logo/lupa/sino por uma fração de segundo). Só troca de estado depois de
    // uma rolagem consistente de verdade numa direção.
    // O mesmo cálculo de direção também encolhe o dock de baixo (.sidebar)
    // ao rolar pra baixo, e devolve ao tamanho normal ao rolar pra cima —
    // por isso não fica mais restrito a só existir quando o cabeçalho existe.
    let dir = 0; // 1 = descendo, -1 = subindo, 0 = ainda não definida
    let accum = 0;
    const TOGGLE_DISTANCE = 28;
    let ticking = false;
    window.addEventListener('scroll', () => {
      if(ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const bar = document.querySelector('.top-bar.top-bar-autohide');
        const dock = document.querySelector('.sidebar');
        const y = window.scrollY;
        const delta = y - lastY;
        lastY = y;
        if(y < 40){
          if(bar) bar.classList.remove('top-bar-hidden');
          if(dock) dock.classList.remove('dock-compact');
          dir = 0; accum = 0;
        } else if(delta !== 0){
          const newDir = delta > 0 ? 1 : -1;
          if(newDir !== dir){ dir = newDir; accum = 0; } // mudou de direção — recomeça a contagem
          accum += Math.abs(delta);
          if(accum >= TOGGLE_DISTANCE){
            if(dir === 1){
              if(bar) bar.classList.add('top-bar-hidden');
              if(dock) dock.classList.add('dock-compact');
            } else {
              if(bar) bar.classList.remove('top-bar-hidden');
              if(dock) dock.classList.remove('dock-compact');
            }
            accum = 0;
          }
        }
        ticking = false;
      });
    }, { passive: true });
  })();
  view = { name: 'loading' };
  render();
  window._auraAuth.onChange((user) => {
    const newId = user ? user.uid : null;
    if(authInited && newId === ME_ID) return; // nada mudou
    authInited = true;
    ME_ID = newId;
    boot();
  });
  // se o login com Google deu erro (ver getRedirectResult lá no módulo do
  // Firebase), redesenha a tela de login pra mostrar a mensagem real assim
  // que ela chegar — sem isso, o erro só aparecia por sorte/timing
  window.addEventListener('aura-google-redirect-error', () => {
    if(view && view.name === 'auth') render();
  });
})();
});
</script>
</body>
</html>
